مله‌ها شروع و ادامه بده: It was… / I was going to… but… / I realized I had… / Just as I was…"}, "li": {"t": "Andrew Stanton — The clues to a great story", "u": "https://www.ted.com/talks/andrew_stanton_the_clues_to_a_great_story", "task": "از کارگردان Pixar دربارهٔ ساختار داستان. (یک شوخی بزرگسالانه در ابتدا دارد.) ۶۰ ثانیه Shadow؛ ۳ قانونش را یادداشت کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Narrative rhythm — pausing & suspense", "fa": "قصه‌گوی خوب قبل از اوج مکث می‌کند، سرعت را کم می‌کند و بعد تند می‌شود. با صدا بازی کن.", "items": ["So there I was… (pause) completely alone.", "And then… (slow) the door… opened.", "You won't believe what happened next.", "And to make things WORSE…"]}, "fl": "Story ladder: یک خاطره را ۳ بار بگو: ۳ دقیقه، ۲ دقیقه، ۱ دقیقه (۴/۳/۲). در هر دور، یک جزئیات جذاب نگه دار و بقیه را کوتاه کن.", "rp": {"scene": "We are friends at a dinner party. Ask me to tell you a story: the most embarrassing, funniest or scariest thing that has happened to me. React like a real listener (laugh, gasp, ask 'And then what?'). Then tell me a short story yourself and ask me to retell it in my own words.", "role": "a friend at a dinner party who loves stories"}, "qs": ["What's the most embarrassing thing that's ever happened to you?", "Tell me about the worst trip you've ever had.", "Have you ever got completely lost?", "What's a funny thing that happened at work?"], "ch": "یک خاطرهٔ ۲ دقیقه‌ای ضبط کن با ساختار کامل. معیار قبولی: شروع جذاب (This one time…)، حداقل ۳ زمان روایی، یک To make things worse و جملهٔ پایانی Looking back…", "work": "۳ خاطرهٔ جذاب زندگی‌ات را انتخاب کن که همیشه آمادهٔ گفتن باشند (برای Small Talk و مصاحبه).", "must": ["This one time, ...", "So there I was, ...", "To make things worse, ...", "Looking back, ...", "burst out (laughing)"]});
S({"n": 42, "ph": 5, "t": "اشتباه‌ها و درس‌ها", "en": "Mistakes, regrets and lessons learned", "goal": "دربارهٔ اشتباه‌ها و پشیمانی‌ها صادقانه و بالغانه صحبت کنی و درسش را بیان کنی.", "v": [["mistake", "اشتباه", "It was a big mistake."], ["regret", "پشیمانی؛ پشیمان بودن", "I regret not studying harder."], ["lesson", "درس", "It taught me an important lesson."], ["failure", "شکست", "Failure is part of success."], ["hindsight", "نگاه به گذشته", "In hindsight, it was the wrong decision."], ["realize", "متوجه شدن", "I realized I was wrong."], ["mature", "بالغ، پخته", "It made me more mature."], ["valuable", "باارزش", "It was a valuable experience."]], "pv": [["mess up", "خراب کردن", "I really messed up the presentation."], ["learn from", "درس گرفتن از", "I've learned from my mistakes."], ["look back on", "به گذشته نگاه کردن", "When I look back on it, I laugh."], ["bounce back", "دوباره سرپا شدن", "It took me a month to bounce back."]], "ex": [["If I could go back, I'd ...", "اگر می‌توانستم برگردم …", "If I could go back, I'd start earlier."], ["I wish I had ...", "ای کاش … کرده بودم", "I wish I had learned English as a kid."], ["It was a wake-up call.", "زنگ بیدارباش بود", "Losing that client was a wake-up call."], ["Lesson learned.", "درس گرفتم", "I didn't back up my files. Lesson learned."], ["It wasn't my finest moment.", "بهترین لحظهٔ من نبود", "It wasn't my finest moment, I admit."], ["The good thing that came out of it was ...", "اتفاق خوبی که از آن درآمد …", "The good thing that came out of it was a new process."]], "g": {"t": "Third conditional + wish (past)", "fa": "If + had + p.p.، would have + p.p. = گذشتهٔ غیرواقعی (اگر کرده بودم، شده بود). I wish I had + p.p. = ای کاش کرده بودم. در گفتار: would've, I'd've.", "ex": ["If I had tested it, it wouldn't have crashed.", "If we hadn't hired her, we would have failed.", "I wish I had listened to my manager.", "I wish I hadn't said that."], "drill": "۵ اشتباه واقعی زندگی‌ات را انتخاب کن و برای هر کدام یک third conditional و یک I wish I had… بگو."}, "li": {"t": "Jia Jiang — What I learned from 100 days of rejection", "u": "https://www.ted.com/talks/jia_jiang_what_i_learned_from_100_days_of_rejection", "task": "داستان‌گویی بامزه دربارهٔ شکست و ترس. ۶۰ ثانیه Shadow؛ داستان یکی از تجربه‌هایش را بازگو کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Weak forms in past modals & conditionals", "fa": "should have → «شودِو»/«shoulda»، would have → «woulda»، could have → «coulda»، had → 'd. شنیدن این‌ها بدون تمرین تقریباً غیرممکن است.", "items": ["I should've known.", "It would've been better.", "We could've won.", "If I'd known…", "I wish I'd asked.", "You shouldn't've said that."]}, "fl": "Regret-to-lesson: ۵ اشتباه کوچک و بزرگ (دیر رسیدن، سرمایه‌گذاری بد، ایمیل عجولانه…) — برای هر کدام ۴۰ ثانیه: چه شد → چه می‌شد اگر… → درس.", "rp": {"scene": "This is a relaxed mentoring conversation. You are an experienced mentor. Ask me about my biggest professional mistakes, what I would do differently and what I learned. Share one of your own failures. Push me to reflect deeply ('Why do you think that happened?') and correct my third conditionals.", "role": "an experienced, warm mentor"}, "qs": ["What's the biggest mistake you've made in your career?", "What would you have done differently?", "What do you wish someone had told you earlier?", "What's the best thing that came out of a failure?"], "ch": "۲ دقیقه دربارهٔ «بزرگ‌ترین اشتباه کاری‌ام و درسی که گرفتم» ضبط کن (برای مصاحبه هم به کار می‌آید). معیار قبولی: ۳ third conditional، ۲ I wish، و یک درس روشن در پایان.", "work": "یک اشتباه اخیرت را با In hindsight… و Lesson learned… به انگلیسی جمع‌بندی کن.", "must": ["If I could go back, I'd ...", "I wish I had ...", "It was a wake-up call.", "hindsight", "mess up"]});
S({"n": 43, "ph": 5, "t": "احساسات و واکنش‌ها", "en": "Feelings, emotions and reactions", "goal": "احساساتت را دقیق‌تر از happy/sad/angry بیان کنی و به حرف دیگران همدلانه واکنش نشان بدهی.", "v": [["thrilled", "خیلی خوشحال و هیجان‌زده", "I was thrilled with the result."], ["relieved", "خیالش راحت شده", "I was so relieved when it worked."], ["frustrated", "کلافه، ناکام", "I'm frustrated with the delays."], ["disappointed", "ناامید، دلسرد", "I was a bit disappointed."], ["nervous", "مضطرب، عصبی (پیش از چیزی)", "I get nervous before presentations."], ["grateful", "سپاسگزار", "I'm really grateful for your help."], ["upset", "ناراحت، دلخور", "She was upset about the decision."], ["drained", "از پا افتاده (ذهنی)", "After that meeting I felt completely drained."]], "pv": [["cheer up", "روحیه گرفتن/دادن", "Cheer up! It's not that bad."], ["calm down", "آرام شدن", "Take a breath and calm down."], ["freak out", "وحشت کردن (خودمانی)", "I freaked out when I saw the bill."], ["get over", "کنار آمدن با، فراموش کردن", "It took me a week to get over it."]], "ex": [["That must have been ...", "حتماً … بوده", "That must have been really stressful."], ["I know how you feel.", "می‌دانم چه حسی داری", "I know how you feel — I've been there."], ["That's great news! / Good for you!", "خبر عالی! / خوش به حالت!", "You got the job? Good for you!"], ["I'm so sorry to hear that.", "خیلی متأسفم که می‌شنوم", "I'm so sorry to hear that."], ["It really got to me.", "خیلی روم اثر گذاشت", "His comment really got to me."], ["I'm over the moon.", "در پوست خودم نمی‌گنجم", "I'm over the moon about it!"]], "g": {"t": "-ed vs -ing adjectives + 'make someone feel'", "fa": "-ed = حس خود آدم (I'm bored)؛ -ing = چیزی که آن حس را ایجاد می‌کند (It's boring). خطای رایج: I'm boring (یعنی من آدم کسل‌کننده‌ای هستم!).", "ex": ["I'm bored. / The meeting is boring.", "I was surprised. / The result was surprising.", "I felt embarrassed. / It was embarrassing.", "It made me feel really proud."], "drill": "۸ جفت جمله بساز: interested/interesting، tired/tiring، confused/confusing، annoyed/annoying، excited/exciting، worried/worrying، amazed/amazing، disappointed/disappointing."}, "li": {"t": "Guy Winch — Why we all need to practice emotional first aid", "u": "https://www.ted.com/talks/guy_winch_why_we_all_need_to_practice_emotional_first_aid", "task": "پر از واژگان احساسی و طنز ملایم. ۶۰ ثانیه Shadow؛ ۱۰ واژهٔ احساسی از آن یادداشت کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Emotional intonation: sincere vs sarcastic", "fa": "یک جمله با دو لحن، دو معنای کاملاً متفاوت دارد. «Great» با صدای بالا و گرم = واقعاً عالی؛ با صدای صاف و پایین = کنایه.", "items": ["Great! ↗ (sincere) / Great. → (sarcastic)", "Really? ↗ (surprised)", "Oh no… ↘ (sympathy)", "That's amazing! ↗", "I'm so sorry. ↘ (soft, slow)"]}, "fl": "Emotion diary: ۲ دقیقه دربارهٔ احساساتت در طول هفتهٔ گذشته حرف بزن؛ از حداقل ۸ صفت احساسی متفاوت (نه happy/sad/angry) استفاده کن.", "rp": {"scene": "You are a colleague. Tell me different pieces of news one by one — some good (a promotion, a baby), some bad (a family illness, a rejected project, burnout). I must react naturally with empathy or congratulations and ask sensitive follow-up questions. Then ask me how I felt at key moments in my life.", "role": "a colleague sharing personal news"}, "qs": ["How did you feel when you started your own business?", "When was the last time you felt really proud?", "What makes you frustrated at work?", "How do you calm down when you're stressed?"], "ch": "۲ دقیقه دربارهٔ «یک لحظه که احساسات زیادی را تجربه کردم» ضبط کن. معیار قبولی: حداقل ۶ صفت احساسی دقیق، ۲ جفت -ed/-ing درست و یک phrasal verb احساسی.", "work": "امروز به جای good/bad، حس دقیق هر موقعیت را در ذهنت به انگلیسی نام‌گذاری کن.", "must": ["That must have been ...", "I'm so sorry to hear that.", "It really got to me.", "relieved", "get over"]});
S({"n": 44, "ph": 5, "t": "شبکه‌سازی و آشنایی‌های حرفه‌ای", "en": "Networking and professional first meetings", "goal": "در یک رویداد، گفتگو را با غریبه شروع کنی، علاقهٔ مشترک پیدا کنی، کارت را معرفی کنی و ارتباط را ادامه‌دار کنی.", "v": [["network", "شبکه‌سازی کردن", "I'm not great at networking."], ["icebreaker", "شروع‌کنندهٔ گفتگو", "That question is a good icebreaker."], ["industry", "صنعت", "Which industry are you in?"], ["collaborate", "همکاری کردن", "It'd be great to collaborate."], ["mutual", "مشترک، متقابل", "We have a mutual friend."], ["conference", "کنفرانس", "Are you here for the whole conference?"], ["business card", "کارت ویزیت", "Here's my business card."], ["keep in touch", "در ارتباط ماندن", "Let's keep in touch."]], "pv": [["reach out (to)", "ارتباط گرفتن، پیغام دادن", "Feel free to reach out anytime."], ["hit it off", "از همان ابتدا با هم جور شدن", "We really hit it off."], ["get in touch", "تماس گرفتن", "I'll get in touch next week."], ["drop by", "سر زدن", "Drop by our booth later."]], "ex": [["Mind if I join you?", "اشکالی ندارد بپیوندم؟", "Hi — mind if I join you?"], ["What brings you here?", "چه چیزی شما را اینجا آورده؟", "So, what brings you here today?"], ["How do you know the host?", "میزبان را از کجا می‌شناسید؟", "How do you know Sara?"], ["That sounds fascinating.", "خیلی جالب به نظر می‌رسد", "That sounds fascinating — how did you get into it?"], ["It was great talking to you.", "صحبت با شما عالی بود", "It was great talking to you."], ["Let's connect on LinkedIn.", "در لینکدین در ارتباط باشیم", "Let's connect on LinkedIn."]], "g": {"t": "make vs do (collocations)", "fa": "فارسی برای هر دو «کردن» دارد، اما انگلیسی بین make و do فرق می‌گذارد. قاعدهٔ تقریبی: do = انجام دادن کار و فعالیت (do business, do research, do a task, do me a favor)؛ make = ساختن یا ایجاد نتیجه (make a decision, make a mistake, make progress, make contacts, make money, make a call). بقیه را باید مثل یک تکه یاد گرفت.", "ex": ["We do business with over 100 schools.", "These events are great for making new contacts.", "Could you do me a favor and introduce me to her?", "We made a lot of progress this year, but we also made some mistakes."], "drill": "این‌ها را با make یا do بگو و با هر کدام یک جملهٔ واقعی بساز: a decision, research, a mistake, business, progress, a favor, money, a call, your best, an effort, a presentation, homework."}, "li": {"t": "BBC — English at Work 48: Networking (6 min)", "u": "https://www.youtube.com/watch?v=Qk-69B86pEo", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "شروع گفتگو با غریبه و شبکه‌سازی. جمله‌های شروع و پایان گفتگو را یادداشت کن."}, "pr": {"t": "Introductions: names & linking", "fa": "اسم خودت را واضح و آرام بگو (بیشترین اشتباه: سریع گفتن اسم). Nice to meet you ← «نایس تِمیت یو» (linking). تکیه روی اسم.", "items": ["Hi, I'm MAjid. MAjid.", "Nice to meet you → nice-tə-meet-cha", "What do you do? → whaddaya do", "Where are you from? → where-r-ya from"]}, "fl": "30-second connection: به ۶ نفر خیالی (سرمایه‌گذار، معلم، برنامه‌نویس خارجی، مدیر مدرسه، خبرنگار، رقیب) در ۳۰ ثانیه خودت را معرفی کن و یک سؤال بپرس.", "rp": {"scene": "We are at an international ed-tech conference in Dubai during a coffee break. You are a stranger — an investor or a product manager from another country. I start the conversation. Find common ground, talk about our work, the conference and the industry, and end with an exchange of contact details. Make it natural, with small pauses I have to fill.", "role": "a stranger at an international conference"}, "qs": ["What brings you to the conference?", "What's the education market like in Iran?", "What's the biggest challenge in your industry?", "Do you have any plans to expand abroad?"], "ch": "یک گفتگوی شبکه‌سازی ۲ دقیقه‌ای با ChatGPT را خودت شروع و تمام کن و ضبط کن. معیار قبولی: شروع طبیعی، ۳ سؤال باز، معرفی ۳۰ ثانیه‌ای، پیدا کردن یک نقطهٔ مشترک، پایان با keep in touch، و حداقل ۳ ترکیب make/do درست.", "work": "پروفایل لینکدینت را بخوان و «درباره» را به شکل شفاهی ۳۰ ثانیه‌ای تمرین کن.", "must": ["What brings you here?", "That sounds fascinating.", "It was great talking to you.", "reach out (to)", "keep in touch"]});
S({"n": 45, "ph": 5, "t": "مصاحبهٔ کاری: معرفی و نقاط قوت", "en": "Job interview: Tell me about yourself & strengths", "goal": "به سؤال‌های کلاسیک مصاحبه (Tell me about yourself، نقاط قوت/ضعف، چرا این شغل) روان و ساختارمند جواب بدهی.", "v": [["candidate", "داوطلب", "We have three strong candidates."], ["qualified", "واجد شرایط", "I'm well qualified for this role."], ["transferable skills", "مهارت‌های قابل انتقال", "I have strong transferable skills from teaching."], ["passionate about", "علاقه‌مند شدید به", "I'm passionate about education."], ["track record", "سابقهٔ عملکرد", "I have a strong track record."], ["fit", "تناسب", "I think I'd be a good fit."], ["motivated", "باانگیزه", "I'm very motivated to learn."], ["hands-on", "عملی، دستی", "I have hands-on experience with AWS."]], "pv": [["stand out", "متمایز بودن", "What makes you stand out?"], ["step into (a role)", "وارد نقشی شدن", "I'm ready to step into a leadership role."], ["build up", "ساختن تدریجی", "I've built up a lot of experience."], ["carry out", "انجام دادن، اجرا کردن", "I carried out a full redesign."]], "ex": [["I'd describe myself as ...", "خودم را … توصیف می‌کنم", "I'd describe myself as a problem-solver."], ["What I bring to the table is ...", "چیزی که با خودم می‌آورم …", "What I bring to the table is ten years of experience."], ["I'm currently ... and I'm looking for ...", "در حال حاضر … و دنبال …", "I'm currently leading a small team and I'm looking for a bigger challenge."], ["For example, in my last role, ...", "مثلاً در نقش قبلی‌ام …", "For example, in my last role, I cut costs by 20%."], ["One area I'm working on is ...", "حوزه‌ای که روی آن کار می‌کنم …", "One area I'm working on is delegation."], ["That's a great question.", "سؤال خوبی است (زمان خریدن)", "That's a great question. Let me think."]], "g": {"t": "Present–Past–Future structure", "fa": "ساختار طلایی Tell me about yourself: حال (الان چه می‌کنم) ← گذشته (چطور به اینجا رسیدم) ← آینده (چرا این نقش). هر بخش با زمان مناسبش.", "ex": ["Currently, I'm the technical lead at a start-up.", "Before that, I worked as a developer for five years.", "I've built products used by over 100 schools.", "Now I'm looking for a role where I can…"], "drill": "پاسخ Tell me about yourself را در ۳ نسخه بگو: ۹۰ ثانیه، ۶۰ ثانیه، ۳۰ ثانیه."}, "li": {"t": "BBC — English at Work 02: Answering interview questions (4 min)", "u": "https://www.youtube.com/watch?v=sj-dX3fZmq0", "seg": "کل ویدیو (۴ دقیقه)", "dialog": true, "task": "پاسخ به سؤال‌های مصاحبه. نقش مصاحبه‌شونده را Shadow کن."}, "pr": {"t": "Confident falling intonation (no uptalk)", "fa": "اگر پایان جمله‌های خبری را بالا ببری (uptalk)، مطمئن به نظر نمی‌رسی. در مصاحبه، جمله‌ها را با صدای پایین‌رونده و قاطع تمام کن.", "items": ["I have ten years of experience. ↘", "I'm very good at problem-solving. ↘", "I led a team of five. ↘", "I'd be a great fit for this role. ↘"]}, "fl": "Interview rapid fire: ۸ سؤال کلاسیک (Why this company? Strengths? Weakness? Why leave? Where in 5 years? Salary? Questions for us? Biggest achievement?) هر کدام ۴۵ ثانیه.", "rp": {"scene": "This is a job interview for a Senior Software Engineer / Technical Lead role at an international ed-tech company (remote). You are the hiring manager. Start with 'Tell me about yourself', then ask about strengths, weaknesses, motivation and why I'm a good fit. Ask follow-ups when I'm vague. Be professional and slightly challenging. At the end, give me honest feedback as an interviewer.", "role": "a professional hiring manager"}, "qs": ["Tell me about yourself.", "What would you say is your biggest strength?", "What's one weakness you're working on?", "Why do you want this role?", "Why should we hire you?"], "ch": "پاسخ Tell me about yourself (۹۰ ثانیه) + Biggest strength with example (۶۰ ثانیه) را ضبط کن. معیار قبولی: ساختار حال–گذشته–آینده، یک عدد یا دستاورد مشخص، لحن پایین‌رونده و بدون uptalk.", "work": "پاسخ‌های نهایی این دو سؤال را آن‌قدر تکرار کن که بدون فکر ولی طبیعی گفته شوند (حفظ کلمه‌به‌کلمه نکن).", "must": ["I'd describe myself as ...", "What I bring to the table is ...", "For example, in my last role, ...", "track record", "stand out"]});
S({"n": 46, "ph": 5, "t": "مصاحبهٔ رفتاری (STAR)", "en": "Behavioural interview questions — the STAR method", "goal": "به سؤال‌های «Tell me about a time when…» با ساختار STAR پاسخ بدهی: موقعیت، وظیفه، اقدام، نتیجه.", "v": [["situation", "موقعیت", "The situation was quite difficult."], ["take the initiative", "پیش‌قدم شدن", "I took the initiative and called the client."], ["resilient", "تاب‌آور، مقاوم", "That year taught me to be resilient."], ["conflict", "تعارض، اختلاف", "There was a conflict in the team."], ["outcome", "نتیجه", "The outcome was very positive."], ["pressure", "فشار", "I work well under pressure."], ["prioritize", "اولویت‌بندی کردن", "I had to prioritize quickly."], ["as a result", "در نتیجه", "As a result, sales went up by 30%."]], "pv": [["step up", "مسئولیت را به عهده گرفتن (در شرایط سخت)", "When my manager left, I stepped up."], ["turn around", "وضعیت را برگرداندن (بهبود)", "We turned the project around in a month."], ["push through", "با وجود سختی ادامه دادن", "We pushed through and delivered on time."], ["follow through (on)", "تا آخر پیگیری و اجرا کردن", "I always follow through on my promises."]], "ex": [["The situation was that ...", "موقعیت این بود که …", "The situation was that we were losing our biggest client."], ["My role was to ...", "نقش من این بود که …", "My role was to fix the relationship."], ["What I did was ...", "کاری که کردم …", "What I did was set up a weekly call."], ["In the end, ...", "در نهایت …", "In the end, they renewed the contract."], ["What I learned from that was ...", "چیزی که از آن یاد گرفتم …", "What I learned from that was to listen first."], ["If I faced that again, I'd ...", "اگر دوباره پیش بیاید …", "If I faced that again, I'd ask for help earlier."]], "g": {"t": "Past narrative with 'I' focus + results in numbers", "fa": "در STAR، بخش Action با I (نه we) و فعل‌های قوی گذشته (led, built, reduced, convinced, organized) بیان می‌شود و Result با عدد.", "ex": ["I organized a meeting with both teams.", "I reduced loading time by 40%.", "I convinced the manager to delay the launch.", "As a result, we saved around 200 hours a year."], "drill": "۱۰ فعل قوی (led, built, reduced, increased, launched, convinced, negotiated, organized, redesigned, trained) را هر کدام در یک جملهٔ دستاورد با عدد به کار ببر."}, "li": {"t": "Angela Lee Duckworth — Grit: the power of passion and perseverance", "u": "https://www.ted.com/talks/angela_lee_duckworth_grit_the_power_of_passion_and_perseverance", "task": "کوتاه (۶ دقیقه) و روشن. ۶۰ ثانیه Shadow؛ یک مثال از grit در زندگی خودت بگو (۱ دقیقه).", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Linking glides /j/ and /w/", "fa": "وقتی دو مصوت کنار هم می‌آیند، انگلیسی‌زبان‌ها یک /j/ یا /w/ کوچک بینشان می‌گذارند تا روان شود: I am ← I-y-am، go on ← go-w-on.", "items": ["I am → I-y-am", "the end → the-y-end", "go on → go-w-on", "do it → do-w-it", "we are → we-y-are", "to ask → to-w-ask"]}, "fl": "STAR speed: ۴ موقعیت (تعارض با همکار، ضرب‌الاجل سخت، اشتباه خودت، مشتری ناراضی) — هر کدام را در ۹۰ ثانیه با STAR بگو.", "rp": {"scene": "Continue the job interview with behavioral questions only. Ask me 'Tell me about a time when…' questions: a conflict with a colleague, a tight deadline, a failure, convincing someone, leading without authority. If my answer is missing Situation, Task, Action or Result, ask me directly for that part ('And what was the result?').", "role": "a hiring manager asking behavioral questions"}, "qs": ["Tell me about a time you had a conflict with a colleague.", "Tell me about a time you failed.", "Describe a situation where you worked under pressure.", "Tell me about a time you convinced someone to change their mind."], "ch": "۲ داستان STAR (هر کدام ۹۰ ثانیه) ضبط کن. معیار قبولی: هر ۴ بخش STAR واضح، Action با I، حداقل یک عدد در Result و یک What I learned…", "work": "۵ داستان STAR از کارنامه‌ات بساز (کلیدواژه‌ها را یادداشت کن، نه متن کامل) — این «بانک داستان» تو برای مصاحبه‌هاست.", "must": ["The situation was that ...", "My role was to ...", "What I did was ...", "What I learned from that was ...", "as a result"]});
S({"n": 47, "ph": 5, "t": "زندگی روزمره: خدمات و شکایت", "en": "Everyday life: services, shopping and complaints", "goal": "در موقعیت‌های روزمره (رستوران، فروشگاه، هتل، خدمات) درخواست کنی، مشکل را بگویی و مؤدبانه شکایت کنی.", "v": [["refund", "بازپرداخت", "I'd like a refund, please."], ["receipt", "رسید", "Do you have the receipt?"], ["exchange", "تعویض", "Can I exchange it for a bigger size?"], ["faulty", "معیوب", "The charger is faulty."], ["bill", "صورت‌حساب", "Could we have the bill, please?"], ["complaint", "شکایت", "I'd like to make a complaint."], ["reservation", "رزرو", "I have a reservation under Karimi."], ["out of stock", "تمام شده (در انبار)", "Sorry, it's out of stock."]], "pv": [["take back", "پس دادن/گرفتن (کالا)", "I'd like to take this back."], ["put up with", "تحمل کردن", "I won't put up with this kind of service."], ["try on", "پرو کردن", "Can I try this on?"], ["shop around", "قیمت‌ها را مقایسه کردن", "I shopped around before buying it."]], "ex": [["I was wondering if you could help me.", "می‌توانید کمکم کنید؟ (مؤدبانه)", "Hi, I was wondering if you could help me."], ["I'm afraid there's a problem with ...", "متأسفانه با … مشکلی هست", "I'm afraid there's a problem with my order."], ["This isn't what I ordered.", "این چیزی نیست که سفارش دادم", "Excuse me, this isn't what I ordered."], ["Could I speak to the manager?", "می‌توانم با مدیر صحبت کنم؟", "Could I speak to the manager, please?"], ["I'd appreciate it if ...", "ممنون می‌شوم اگر …", "I'd appreciate it if you could fix it today."], ["Keep the change.", "بقیه‌اش مال شما", "Here you go. Keep the change."]], "g": {"t": "Dependent prepositions Persian speakers get wrong", "fa": "خیلی از فعل‌ها و صفت‌ها حرف اضافهٔ ثابت دارند و ترجمهٔ مستقیم از فارسی غلط درمی‌آید: «دربارهٔ چیزی بحث کردن» = discuss something (بدون about)، «برای من توضیح بده» = explain to me، «ازدواج با» = married to. در شکایت و خرید این‌ها مدام لازم می‌شوند. (I'd like / I'd rather هم برای درخواست مؤدبانه همین‌جا به کار می‌آیند.)", "ex": ["I'd like to complain about the delivery. (نه complain from)", "Could you explain to me why it's late? (نه explain me)", "I've been waiting for 40 minutes. / It depends on the price.", "Let's discuss the refund. (نه discuss about) / I'd rather pay by card."], "drill": "با هر کدام یک جملهٔ شکایت یا خرید بساز: complain about, apologize for, pay for, wait for, ask for, depend on, explain to, discuss (بدون about), arrive at/in, interested in, good at, responsible for."}, "li": {"t": "BBC — English at Work 26: Complaining (6 min)", "u": "https://www.youtube.com/watch?v=X7nDkvYSbfs", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "شکایت مؤدبانه. به حروف اضافه دقت کن (complain about، apologize for)."}, "pr": {"t": "Polite complaint tone", "fa": "شکایت مؤدبانه = صدای آرام، سرعت کم، لحن خنثی و محکم. بالا بردن صدا در انگلیسی خیلی زود «پرخاشگر» تلقی می‌شود.", "items": ["I'm AFraid there's a PROBlem with my ORder.", "I'd apPREciate it if you could SORT it OUT.", "This ISn't what I ORdered.", "Could I SPEAK to the MAnager, PLEASE?"]}, "fl": "Service marathon: ۶ موقعیت پشت سر هم (سفارش قهوه، پس دادن کالا، اعتراض به صورت‌حساب، رزرو میز، مشکل اتاق هتل، سفارش تاکسی) — هر کدام ۳۰ ثانیه.", "rp": {"scene": "Play several short everyday scenes: (1) a café where you get my order wrong, (2) a shop where I want to return faulty headphones without the box, (3) a hotel reception where my room is not ready and noisy. Be realistic: at first you are not very helpful, so I have to be polite but firm to get a solution.", "role": "various service staff: waiter, sales clerk, hotel receptionist"}, "qs": ["What can I get you?", "Do you have the receipt?", "I'm sorry, we don't usually give refunds.", "Is there anything else I can help you with?"], "ch": "یک شکایت ۹۰ ثانیه‌ای (مثلاً دربارهٔ یک خرید اینترنتی) ضبط کن. معیار قبولی: شروع مؤدبانه، توضیح مشکل، درخواست مشخص (refund/exchange)، بدون لحن تهاجمی، و حروف اضافهٔ درست (complain about، explain to، discuss بدون about).", "work": "در یک خرید یا سفارش امروز، مکالمه را هم‌زمان در ذهنت به انگلیسی تکرار کن.", "must": ["I'm afraid there's a problem with ...", "This isn't what I ordered.", "I'd appreciate it if ...", "refund", "put up with"]});
S({"n": 48, "ph": 5, "t": "سفر و مشکلات سفر", "en": "Travel situations and solving problems on the road", "goal": "در فرودگاه، هتل، تاکسی و موقعیت‌های غیرمنتظرهٔ سفر مشکل را حل کنی و اطلاعات بگیری.", "v": [["boarding pass", "کارت پرواز", "Here's my boarding pass."], ["delayed", "تأخیردار", "My flight has been delayed."], ["connecting flight", "پرواز اتصالی", "I'll miss my connecting flight."], ["luggage", "چمدان، بار", "My luggage didn't arrive."], ["check-in desk", "پیشخوان پذیرش (فرودگاه/هتل)", "Where's the check-in desk for Turkish Airlines?"], ["directions", "مسیر، آدرس", "Can you give me directions?"], ["nearby", "نزدیک، همین اطراف", "Is there a pharmacy nearby?"], ["itinerary", "برنامهٔ سفر", "Let me check my itinerary."]], "pv": [["check out", "تحویل اتاق و ترک هتل", "What time is check-out?"], ["get on / get off", "سوار/پیاده شدن", "Where do I get off?"], ["drop off", "پیاده کردن، تحویل دادن", "Could you drop me off at the station?"], ["look around", "گشتن و دیدن", "We just want to look around the old city."]], "ex": [["Excuse me, could you tell me how to get to ...?", "ببخشید، چطور به … بروم؟", "Excuse me, could you tell me how to get to the station?"], ["Is it within walking distance?", "پیاده می‌شود رفت؟", "Is it within walking distance?"], ["What are my options?", "چه گزینه‌هایی دارم؟", "My flight was canceled. What are my options?"], ["Could you put me on the next flight?", "مرا روی پرواز بعدی بگذارید؟", "Could you put me on the next flight?"], ["Is breakfast included?", "صبحانه شامل است؟", "Is breakfast included in the price?"], ["I'm just looking, thanks.", "فقط نگاه می‌کنم، ممنون", "I'm just looking, thanks."]], "g": {"t": "used to vs be used to vs get used to", "fa": "سه ساختار که فارسی‌زبان‌ها قاطی می‌کنند: used to + فعل ساده = عادت گذشته (جلسهٔ ۲)؛ be used to + ing یا اسم = به چیزی عادت داشتن (برایم عادی است)؛ get used to + ing یا اسم = کم‌کم عادت کردن. در سفر و زندگی در جای جدید پرکاربردند.", "ex": ["I used to travel a lot for work. (عادت گذشته)", "I'm not used to driving on the right. (برایم عادی نیست)", "Don't worry, you'll get used to the time difference.", "It took me a week to get used to the food."], "drill": "یک سفر یا تغییر بزرگ زندگی‌ات را تصور کن و ۸ جمله بگو: ۲ تا used to، ۳ تا be (not) used to، ۳ تا get used to. یادت باشد بعد از be/get used to فعل با ing می‌آید."}, "li": {"t": "BBC Real Easy English — Airports are stressful (6 min)", "u": "https://www.youtube.com/watch?v=0W6PymVdXVw", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "گفتگوی طبیعی دربارهٔ سفر و فرودگاه. واژه‌های سفر را یادداشت کن."}, "pr": {"t": "The English /r/ (not trilled)", "fa": "r فارسی لرزشی است؛ r انگلیسی زبان را به جایی نمی‌زند و فقط نوک زبان کمی عقب می‌رود و لب‌ها کمی گرد می‌شود. در انگلیسی آمریکایی (مدل این برنامه) r همه‌جا گفته می‌شود: car، work، better. در لهجهٔ بریتانیایی r بعد از مصوت گفته نمی‌شود (car = «کا») — فقط برای فهمیدن.", "items": ["right", "room", "really", "restaurant", "airport", "reservation", "delayed luggage (L vs R)", "rural (سخت!)"]}, "fl": "Travel disaster: ۲ دقیقه بدترین سفر (واقعی یا خیالی) را تعریف کن: پرواز لغو شد، چمدان گم شد، هتل رزرو نداشت…", "rp": {"scene": "Travel role-play in three parts: (1) at the airport check-in desk: my flight to Istanbul is canceled and I have an important meeting tomorrow; (2) at a hotel: they have no record of my reservation; (3) asking a local for directions to a restaurant. Create problems and make me find solutions.", "role": "airline staff, hotel receptionist and a local person"}, "qs": ["I'm sorry, the flight has been canceled.", "Do you have your booking reference?", "We're fully booked tonight, I'm afraid.", "Where exactly do you want to go?"], "ch": "۲ دقیقه ضبط کن: پروازت لغو شده؛ با کارمند فرودگاه صحبت کن و گزینه‌ها را بررسی کن و یک راه‌حل بگیر. معیار قبولی: ۲ سؤال غیرمستقیم، ۲ جمله با be/get used to، What are my options? و درخواست مشخص.", "work": "یک سفر آینده (واقعی یا رؤیایی) را انتخاب کن و برنامه‌اش را به انگلیسی شرح بده.", "must": ["Excuse me, could you tell me how to get to ...?", "What are my options?", "Could you put me on the next flight?", "delayed", "drop off"]});
S({"n": 49, "ph": 5, "t": "بحث دربارهٔ موضوعات روز و تکنولوژی", "en": "Discussing current topics and tech trends", "goal": "دربارهٔ موضوعات عمومی (تکنولوژی، آموزش، جامعه) عمیق‌تر از سطح Small Talk بحث کنی و استدلال بیاوری.", "v": [["trend", "روند", "It's a growing trend."], ["far-reaching", "گسترده (اثر)", "It'll have far-reaching consequences for schools."], ["controversial", "بحث‌برانگیز", "It's a controversial topic."], ["privacy", "حریم خصوصی", "Privacy is a big concern."], ["generation", "نسل", "The younger generation is different."], ["addicted", "معتاد", "Kids are addicted to their phones."], ["inevitable", "اجتناب‌ناپذیر", "Change is inevitable."], ["in the long term", "در بلندمدت", "In the long term, it's positive."]], "pv": [["keep up with", "همگام بودن با", "It's hard to keep up with AI news."], ["phase out", "به تدریج حذف کردن", "Paper exams will be phased out."], ["catch on", "فراگیر شدن", "Do you think it'll catch on?"], ["wipe out", "کاملاً از بین بردن", "Will AI wipe out some jobs completely?"]], "ex": [["There's no doubt that ...", "شکی نیست که …", "There's no doubt that AI is changing education."], ["It's a double-edged sword.", "شمشیر دولبه است", "Social media is a double-edged sword."], ["On the whole, ...", "در مجموع …", "On the whole, I think it's positive."], ["It remains to be seen whether ...", "باید دید که آیا …", "It remains to be seen whether it'll work."], ["The jury's still out on ...", "هنوز حکم قطعی دربارهٔ … نیست", "The jury's still out on remote learning."], ["To play devil's advocate, ...", "برای اینکه طرف مقابل را بگیرم …", "To play devil's advocate, isn't it good for kids?"]], "g": {"t": "Future predictions with degrees of certainty", "fa": "پیش‌بینی با درجهٔ اطمینان: will definitely / is bound to (قطعی)، will probably / is likely to (محتمل)، might / could (ممکن)، probably won't / is unlikely to (بعید).", "ex": ["AI is bound to change how we teach.", "Paper exams are likely to disappear.", "Robots might replace some teachers.", "It's unlikely that schools will close."], "drill": "۱۰ پیش‌بینی دربارهٔ ۱۰ سال آینده (آموزش، کار، ایران، تکنولوژی، شهرها) با ۵ درجهٔ اطمینان مختلف بگو."}, "li": {"t": "Cal Newport — Why you should quit social media", "u": "https://www.ted.com/talks/cal_newport_why_you_should_quit_social_media", "task": "استدلالی روشن و بحث‌برانگیز. ۶۰ ثانیه Shadow؛ سپس ۹۰ ثانیه با او مخالفت یا موافقت کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Words Persian speakers commonly mispronounce", "fa": "این کلمات تقریباً همیشه اشتباه تلفظ می‌شوند؛ هر کدام را در YouGlish گوش کن و ۵ بار تکرار کن.", "items": ["comfortable /ˈkʌmftərbəl/", "vegetable /ˈvedʒtəbəl/", "chaos /ˈkeɪɑːs/", "recipe /ˈresəpi/", "determine /dɪˈtɝːmɪn/", "genre /ˈʒɑːnrə/", "hierarchy /ˈhaɪərɑːrki/", "colonel /ˈkɝːnl/", "southern /ˈsʌðərn/", "clothes /kloʊðz/"]}, "fl": "Hot takes: ۶ موضوع بحث‌برانگیز — برای هر کدام ۴۵ ثانیه نظر + ۱۵ ثانیه devil's advocate علیه خودت.", "rp": {"scene": "Let's have a deep discussion, like two smart friends. Topics: AI in schools, social media and teenagers, the future of work, and privacy. Share your own views and disagree with me sometimes. Ask me for evidence and examples. Use natural expressions and push me to use predictions with different degrees of certainty.", "role": "a smart, opinionated friend"}, "qs": ["Should students be allowed to use ChatGPT for homework?", "Will AI create more jobs than it destroys?", "At what age should kids get a smartphone?", "Is online education as good as face-to-face?"], "ch": "۲ دقیقه دربارهٔ «آیندهٔ آموزش در ۱۰ سال آینده» ضبط کن. معیار قبولی: ۴ پیش‌بینی با درجهٔ اطمینان متفاوت، یک double-edged sword یا jury's still out، و یک استدلال مخالف که جوابش را بدهی.", "work": "یک خبر فناوری امروز را بخوان و در ۶۰ ثانیه به انگلیسی خلاصه و نقد کن.", "must": ["There's no doubt that ...", "It's a double-edged sword.", "It remains to be seen whether ...", "keep up with", "catch on"]});

S({"n": 51, "ph": 6, "t": "ارائهٔ کوتاه: ساختار و Signposting", "en": "Short presentations: structure and signposting", "goal": "یک ارائهٔ ۳ دقیقه‌ای با مقدمه، بدنهٔ ۳ بخشی و جمع‌بندی بدهی و شنونده همیشه بداند کجای ارائه است.", "v": [["outline", "طرح کلی", "Here's a quick outline."], ["overview", "نمای کلی", "Let me give you an overview."], ["slide", "اسلاید", "On this slide, you can see…"], ["figure", "عدد، رقم", "The figures are quite impressive."], ["plateau", "ثابت ماندن بعد از رشد", "Growth plateaued over the summer."], ["key takeaway", "نکتهٔ اصلی برای به خاطر سپردن", "The key takeaway is simple."], ["summarize", "خلاصه کردن", "Let me summarize."], ["audience", "مخاطبان", "Know your audience."]], "pv": [["move on to", "رفتن به (بخش بعد)", "Let's move on to the results."], ["go into (detail)", "وارد جزئیات شدن", "I won't go into too much detail."], ["sum up", "جمع‌بندی کردن", "To sum up, we grew by 50%."], ["run through", "سریع مرور کردن", "Let me quickly run through the agenda."]], "ex": [["Today I'm going to talk about ...", "امروز دربارهٔ … صحبت می‌کنم", "Today I'm going to talk about our growth this year."], ["I've divided my talk into three parts.", "صحبتم را به سه بخش تقسیم کرده‌ام", "I've divided my talk into three parts."], ["That brings me to ...", "این مرا به … می‌رساند", "That brings me to my second point."], ["Let's take a closer look at ...", "نگاه دقیق‌تری بیندازیم به …", "Let's take a closer look at the numbers."], ["As I mentioned earlier, ...", "همان‌طور که قبلاً گفتم …", "As I mentioned earlier, costs went down."], ["If there's one thing I'd like you to remember, it's ...", "اگر فقط یک چیز یادتان بماند …", "If there's one thing I'd like you to remember, it's this."]], "g": {"t": "Describing trends & numbers", "fa": "برای نمودارها: rise/increase/grow، fall/drop/decline، stay the same/level off + قیدها (sharply, slightly, steadily, dramatically) + by (میزان تغییر) / to (عدد نهایی).", "ex": ["Users increased sharply by 40%.", "Costs fell slightly to 2 billion rials.", "Sales remained stable in the summer.", "The number of schools doubled."], "drill": "یک نمودار فرضی رشد محصولت (۱۲ ماه) را ۹۰ ثانیه توصیف کن با حداقل ۶ فعل روند و ۴ قید."}, "li": {"t": "Nancy Duarte — The secret structure of great talks", "u": "https://www.ted.com/talks/nancy_duarte_the_secret_structure_of_great_talks", "task": "دربارهٔ ساختار ارائه‌های بزرگ (what is / what could be). ۶۰ ثانیه Shadow؛ ساختار را در ارائهٔ امروز به کار ببر.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Signpost stress & slowing down", "fa": "Signpostها را واضح، کمی آهسته‌تر و با مکث بعدشان بگو؛ این‌ها «تابلوهای راهنمای» شنونده‌اند. سرعت کلی ارائه را ۱۰–۱۵٪ آرام‌تر از مکالمه نگه دار.", "items": ["FIRST… (pause)", "That BRINGS me to… (pause)", "Let's take a CLOSER look… (pause)", "To SUM up… (pause)"]}, "fl": "Signpost skeleton: ۳ ارائهٔ ۶۰ ثانیه‌ای فقط با اسکلت (مقدمه + ۳ signpost + جمع‌بندی) دربارهٔ ۳ موضوع مختلف بده.", "rp": {"scene": "I am going to give you a 3-minute presentation about my company or product (growth, challenges, next steps). You are the audience: listen without interrupting, then give me detailed feedback on structure, signposting, clarity, language mistakes and delivery, and ask me two follow-up questions. Then ask me to give the presentation again, improved.", "role": "an attentive audience member and presentation coach"}, "qs": ["Could you give me a quick overview first?", "What was your key takeaway?", "Can you explain that graph again?", "What are your next steps?"], "ch": "یک ارائهٔ ۳ دقیقه‌ای دربارهٔ محصول/کارت ضبط کن. معیار قبولی: مقدمه با outline، حداقل ۵ signpost، ۳ جملهٔ توصیف روند با عدد، و جمع‌بندی با key takeaway.", "work": "ارائهٔ بعدی کاری‌ات را (حتی فارسی) با این ساختار آماده کن و نسخهٔ انگلیسی‌اش را هم تمرین کن.", "must": ["Today I'm going to talk about ...", "That brings me to ...", "Let's take a closer look at ...", "key takeaway", "sum up"]});
S({"n": 52, "ph": 6, "t": "پاسخ به سؤال‌ها (Q&A)", "en": "Handling questions and Q&A", "goal": "به سؤال‌های سخت، غیرمنتظره یا خصمانه با آرامش جواب بدهی؛ وقت بخری، سؤال را بازگو کنی و اگر جواب را نمی‌دانی، حرفه‌ای بگویی.", "v": [["fair question", "سؤال منصفانه", "That's a fair question."], ["off-topic", "خارج از موضوع", "That's a bit off-topic, but…"], ["dodge (a question)", "طفره رفتن (از سؤال)", "I'm not going to dodge the question."], ["confidential", "محرمانه", "I'm afraid that's confidential."], ["candid", "صریح و صادق", "Let me be candid with you."], ["hypothetically", "به‌طور فرضی", "Hypothetically speaking, yes, we could."], ["address", "پرداختن به (موضوع)", "Let me address that concern."], ["straightforward", "ساده، سرراست", "The answer is straightforward."]], "pv": [["circle back (to)", "بعداً برگشتن به (موضوع)", "Let me circle back to that at the end."], ["come back to", "برگشتن به", "I'll come back to that at the end."], ["touch on", "کمی اشاره کردن", "I touched on that earlier."], ["dig into", "عمیق بررسی کردن", "We can dig into that after the meeting."]], "ex": [["Good question — I'll be honest with you: ...", "سؤال خوبی است؛ صادقانه بگویم …", "Good question — I'll be honest with you: we don't know yet."], ["If I understand you correctly, you're asking ...", "اگر درست فهمیده باشم می‌پرسید …", "If I understand you correctly, you're asking about the cost."], ["I'm not sure off the top of my head, but ...", "الان دقیق نمی‌دانم، اما …", "I'm not sure off the top of my head, but I'll check."], ["Let me get back to you on that.", "بعداً جوابش را می‌دهم", "Let me get back to you on that by Friday."], ["Does that answer your question?", "جواب سؤالتان را داد؟", "Does that answer your question?"], ["That's outside the scope of today, but ...", "خارج از محدودهٔ امروز است، اما …", "That's outside the scope of today, but happy to discuss later."]], "g": {"t": "Cleft sentences for emphasis (What… is…, The thing is…)", "fa": "جمله‌های «شکافته» تأکید را روی بخش مهم می‌گذارند و به تو زمان فکر کردن می‌دهند: What we need is…، The reason is…، The thing is…، What I mean is…", "ex": ["What we need is more data.", "The reason we chose Iran first is the market size.", "The thing is, parents don't read emails.", "What I mean is that it's too early to say."], "drill": "۸ جملهٔ ساده را cleft کن: We need time. / I'm worried about the budget. / Teachers like the app. / The price is the problem. / I don't know. / We want to grow. / The design is slow. / You should test more."}, "li": {"t": "Dan Gilbert — The psychology of your future self", "u": "https://www.ted.com/talks/dan_gilbert_the_psychology_of_your_future_self", "task": "کوتاه، دقیق و شوخ. ۶۰ ثانیه Shadow؛ ۳ سؤال که خودت از او می‌پرسیدی بساز و جوابشان را حدس بزن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Graceful pausing instead of fillers", "fa": "به جای umm و err، مکث ساکت کن یا از عبارت‌های «زمان‌خر» استفاده کن. مکث ۱–۲ ثانیه‌ای فکورانه به نظر می‌رسد؛ umm پشت سر هم ناآماده.", "items": ["That's a great question… (pause)", "Let me think about that for a second.", "Well, … (pause) it depends.", "How can I put this… (pause)"]}, "fl": "Fillers-free minute: ۵ سؤال سخت از خودت بپرس و هر کدام را ۶۰ ثانیه جواب بده. هر umm/err یک امتیاز منفی — شمارش کن و در Error Log بنویس.", "rp": {"scene": "I've just finished a presentation about our product to potential investors. You are the investors: ask me tough questions one by one — about competition, revenue, risks, data privacy, why now, and one question I probably can't answer. Some questions should be long and confusing so I must clarify. Evaluate how well I handle each question.", "role": "a group of tough investors in a Q&A"}, "qs": ["Who are your main competitors and why are you better?", "What's your revenue model?", "What happens if a big company copies you?", "What are your numbers for next year?", "What keeps you up at night?"], "ch": "به ۳ سؤال سخت (یکی را که جوابش را نمی‌دانی) هر کدام ۶۰ ثانیه جواب بده و ضبط کن. معیار قبولی: بازگویی سؤال، حداقل ۲ cleft sentence، کمتر از ۳ filler در کل، و یک Let me get back to you on that حرفه‌ای.", "work": "۵ سؤال سختی که ممکن است دربارهٔ کارت از تو بپرسند را بنویس و جوابشان را بلند تمرین کن.", "must": ["If I understand you correctly, you're asking ...", "I'm not sure off the top of my head, but ...", "Let me get back to you on that.", "circle back (to)", "Does that answer your question?"]});
S({"n": 53, "ph": 6, "t": "مذاکرهٔ پیشرفته", "en": "Negotiating: salary, resources and deadlines", "goal": "در مذاکرهٔ جدی (حقوق، بودجه، زمان) موضعت را محکم بیان کنی، امتیاز بدهی و بگیری، و رابطه را حفظ کنی.", "v": [["leverage", "اهرم (فشار)", "We have leverage because we're the only supplier."], ["counter-offer", "پیشنهاد متقابل", "They made a counter-offer."], ["your bottom line", "حداقل قابل‌قبول (در مذاکره) — با «اصل مطلب» جلسهٔ ۱۹ فرق دارد", "What's your bottom line on price?"], ["package", "بستهٔ (حقوق و مزایا)", "The whole package is attractive."], ["non-negotiable", "غیرقابل‌مذاکره", "The deadline is non-negotiable."], ["market rate", "نرخ بازار", "That's below the market rate."], ["justify", "توجیه کردن", "Can you justify that price?"], ["terms", "شرایط (قرارداد)", "Let's agree on the terms."]], "pv": [["come down (on price)", "پایین آمدن (قیمت)", "Could you come down a little?"], ["hold firm", "ایستادگی کردن", "We need to hold firm on the price."], ["throw in", "مجانی اضافه کردن", "Could you throw in the training?"], ["settle on", "توافق کردن روی", "We settled on 20%."]], "ex": [["Based on my research, ...", "بر اساس تحقیقاتم …", "Based on my research, the market rate is higher."], ["I was hoping for something closer to ...", "امیدوار بودم به … نزدیک‌تر باشد", "I was hoping for something closer to 3,000."], ["Is there any flexibility on ...?", "روی … انعطافی هست؟", "Is there any flexibility on the start date?"], ["I could agree to that if ...", "اگر … می‌توانم قبول کنم", "I could agree to that if you cover the travel costs."], ["That's the best I can do.", "این بهترین پیشنهاد من است", "I'm sorry, that's the best I can do."], ["Let me think it over and get back to you.", "بگذار فکر کنم و خبرت کنم", "Let me think it over and get back to you tomorrow."]], "g": {"t": "Tentative language: would / could / was hoping / might be able to", "fa": "در مذاکره، زبان «فرضی» فضا را باز نگه می‌دارد: We would need…, I was hoping…, We might be able to…, Would you consider…? — این‌ها تعهد قطعی نیستند.", "ex": ["Would you consider a longer contract?", "We might be able to offer a small discount.", "I was hoping we could discuss the salary.", "That would be difficult for us."], "drill": "یک مذاکرهٔ حقوق را با ۸ جملهٔ tentative (هر کدام با ساختار متفاوت) با خودت انجام بده."}, "li": {"t": "BBC — English at Work 32: Negotiating a deal (6 min)", "u": "https://www.youtube.com/watch?v=o9KEaQCWqDg", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "مذاکرهٔ جدی‌تر. ببین پیشنهاد و پیشنهاد متقابل را چطور مطرح می‌کنند."}, "pr": {"t": "Firm tone & stressing numbers", "fa": "در مذاکره، اعداد را آهسته، واضح و با تکیه بگو. جملهٔ پیشنهاد را با لحن پایین‌رونده تمام کن — لحن بالارونده روی عدد یعنی «مطمئن نیستم».", "items": ["I was hoping for THREE thousand. ↘", "That's TWENty percent BElow the market rate. ↘", "The deadline is non-neGOtiable. ↘", "We can do FIFteen, not FIFty."]}, "fl": "Anchor & concede: ۳ مذاکره (حقوق، قیمت یک پروژه، مهلت) — در هر کدام ۶۰ ثانیه: پیشنهاد اولیه (anchor) + توجیه + یک امتیاز مشروط.", "rp": {"scene": "Salary negotiation: You are the HR manager of a company that has offered me a job. Your offer is 20% below what I want. You have some flexibility on salary but more on benefits (remote days, training budget, start date). Negotiate realistically. Don't give in easily; make me justify my request with evidence. At the end, summarize what we agreed.", "role": "an HR manager negotiating a job offer"}, "qs": ["So, what are your salary expectations?", "That's quite a bit higher than our budget.", "What if we offered more remote days instead?", "Is that your final number?"], "ch": "یک مذاکرهٔ ۲ دقیقه‌ای (حقوق یا قیمت پروژه) با ChatGPT انجام بده و ضبط کن. معیار قبولی: anchor با توجیه، ۳ جملهٔ tentative، یک امتیاز مشروط (I could agree if…) و جمع‌بندی توافق.", "work": "حداقل قابل‌قبول (bottom line) و پیشنهاد ایدئالت را برای مذاکرهٔ بعدی‌ات مشخص کن و جمله‌هایش را بلند تمرین کن.", "must": ["Based on my research, ...", "I was hoping for something closer to ...", "Is there any flexibility on ...?", "I could agree to that if ...", "throw in"]});
S({"n": 54, "ph": 6, "t": "گفتگوهای دشوار", "en": "Difficult conversations with colleagues", "goal": "یک موضوع حساس (رفتار بد، کم‌کاری، تعارض) را مستقیم اما محترمانه مطرح کنی، بدون حمله و بدون عقب‌نشینی.", "v": [["tension", "تنش", "There's been some tension in the team."], ["behavior", "رفتار", "I want to talk about some behavior."], ["jump to conclusions", "زود نتیجه‌گیری کردن", "I don't want to jump to conclusions."], ["intention", "نیت", "I'm sure it wasn't your intention."], ["tone", "لحن", "I didn't like the tone of that email."], ["respect", "احترام", "It's about respect."], ["resolve", "حل کردن", "I'd like to resolve this."], ["sensitive", "حساس", "It's a sensitive topic."]], "pv": [["own up to", "پذیرفتن (اشتباه)", "I want to own up to my part in this."], ["clear up", "برطرف کردن (سوءتفاهم)", "I'd like to clear this up."], ["blow up", "از کوره در رفتن", "He blew up in the meeting."], ["talk (something) through", "مفصل حرف زدن دربارهٔ", "Can we talk it through?"]], "ex": [["There's something I'd like to talk to you about.", "موضوعی هست که می‌خواهم دربارهٔ آن صحبت کنم", "Do you have a minute? There's something I'd like to talk to you about."], ["I've noticed that ...", "متوجه شده‌ام که …", "I've noticed that you've been late to our meetings."], ["When ..., I feel ...", "وقتی …، احساس … می‌کنم", "When you interrupt me, I feel ignored."], ["Help me understand ...", "کمکم کن بفهمم …", "Help me understand what happened."], ["I might be wrong, but ...", "شاید اشتباه کنم، اما …", "I might be wrong, but it seems you're unhappy."], ["How can we fix this together?", "چطور با هم درستش کنیم؟", "How can we fix this together?"]], "g": {"t": "'I' statements & describing behavior neutrally", "fa": "به جای You always… (حمله)، رفتار مشخص + اثر آن بر خودت: When X happened, I felt Y, because Z. از قیدهای مطلق (always, never) پرهیز کن.", "ex": ["You're always late. ✗ → I've noticed you've been late three times this week. ✓", "You don't care. ✗ → I feel my work isn't valued. ✓", "When the report was late, I felt stressed because the client was waiting.", "I'd really appreciate it if you could…"], "drill": "۶ جملهٔ حمله‌ای را به «I statement» تبدیل کن: You never listen / You're lazy / You ruined the meeting / You're rude / You don't respect me / You always change the plan."}, "li": {"t": "BBC — Office English, episode 8: Conflict (11 min)", "u": "https://www.youtube.com/watch?v=vvDYsMWkCog", "seg": "۵ دقیقهٔ اول (بقیه اختیاری)", "dialog": true, "task": "زبان تعارض و حل آن. جمله‌های آرام‌کننده را یادداشت کن."}, "pr": {"t": "Calm tone: lower pitch, slower pace", "fa": "در گفتگوی دشوار، صدا را کمی پایین‌تر و سرعت را آهسته‌تر کن و بین جمله‌ها مکث بگذار. صدای بالا و تند = تهاجم یا اضطراب.", "items": ["There's something… I'd like to talk to you about.", "I've noticed that… (pause)", "Help me understand… (pause) what happened.", "How can we fix this… together?"]}, "fl": "Script-free difficult talks: ۳ موقعیت (همکاری که کارش را انجام نمی‌دهد، دوستی که پولت را پس نداده، همسایهٔ پرسروصدا) — هر کدام ۶۰ ثانیه، آغاز گفتگو.", "rp": {"scene": "You are my colleague. For the last month, you've been missing deadlines, which makes my work late, and yesterday you criticized my work in front of the manager. I have to raise these issues. Be defensive at first ('It's not my fault', 'Everyone is late'), then gradually open up if I stay calm and respectful. We should end with a concrete agreement.", "role": "a defensive colleague"}, "qs": ["What's this about?", "Why are you blaming me?", "Well, you're not perfect either.", "OK… what do you suggest?"], "ch": "شروع یک گفتگوی دشوار واقعی (یا فرضی) را در ۹۰ ثانیه ضبط کن. معیار قبولی: شروع نرم، توصیف رفتار مشخص (نه شخصیت)، حداقل ۲ I statement، یک سؤال Help me understand و یک پیشنهاد مشترک.", "work": "یک گفتگوی دشوار معوقه در زندگی یا کارت را انتخاب کن و جملهٔ شروعش را آماده کن.", "must": ["There's something I'd like to talk to you about.", "I've noticed that ...", "Help me understand ...", "How can we fix this together?", "clear up"]});
S({"n": 55, "ph": 6, "t": "نه گفتن و مقاومت در برابر درخواست", "en": "Saying no and pushing back", "goal": "به درخواست‌های غیرواقعی نه بگویی (به مدیر، مشتری، همکار) بدون اینکه رابطه خراب شود، و جایگزین بدهی.", "v": [["capacity", "ظرفیت", "We don't have the capacity right now."], ["bandwidth", "ظرفیت ذهنی/زمانی (خودمانی)", "I don't have the bandwidth this week."], ["decline", "رد کردن (رسمی)", "I'm going to have to decline."], ["commitment", "تعهد", "I have other commitments."], ["overcommit", "بیش از توان قول دادن", "I don't want to overcommit and then let you down."], ["unrealistic", "غیرواقعی", "That timeline is unrealistic."], ["boundaries", "مرزها", "It's important to set boundaries."], ["stretched thin", "بیش از حد درگیر، تحت فشار", "The team is stretched thin right now."]], "pv": [["turn down", "رد کردن", "I had to turn down the offer."], ["spread yourself too thin", "خود را بیش از حد درگیر کردن", "I don't want to spread myself too thin."], ["push back (on)", "مقاومت/مخالفت کردن", "I need to push back on this deadline."], ["free up", "آزاد کردن (وقت)", "If we drop X, I can free up some time."]], "ex": [["I'd love to help, but ...", "دوست دارم کمک کنم، اما …", "I'd love to help, but I'm fully booked this week."], ["Unfortunately, I'm not able to ...", "متأسفانه نمی‌توانم …", "Unfortunately, I'm not able to take this on right now."], ["Can we revisit this next month?", "می‌شود ماه بعد دوباره بررسی‌اش کنیم؟", "I can't commit now. Can we revisit this next month?"], ["If I take this on, something else will have to give.", "اگر این را بپذیرم، کار دیگری باید کنار برود", "If I take this on, something else will have to give."], ["Which would you like me to prioritize?", "کدام را اولویت بدهم؟", "Which would you like me to prioritize: A or B?"], ["I don't think I'm the right person for this.", "فکر نمی‌کنم آدم مناسب این کار باشم", "Honestly, I don't think I'm the right person for this."]], "g": {"t": "'Too / enough / so … that' for explaining limits", "fa": "برای توضیح محدودیت: too + صفت (بیش از حد)، صفت + enough (کافی)، not enough + اسم، so + صفت + that (آن‌قدر … که).", "ex": ["The deadline is too tight for a proper test.", "We don't have enough people.", "The team isn't big enough to handle both projects.", "We're so busy that we can't start before June."], "drill": "۸ جمله دربارهٔ محدودیت‌های کاری‌ات با too / enough / not enough / so…that بساز."}, "li": {"t": "BBC — English at Work 16: Politely refusing something (4 min)", "u": "https://www.youtube.com/watch?v=WFDvDcozhYM", "seg": "کل ویدیو (۴ دقیقه)", "dialog": true, "task": "دقیقاً موضوع امروز: نه گفتن مؤدبانه. ۵ شکل «نه» را یادداشت و Shadow کن."}, "pr": {"t": "Saying 'no' warmly but clearly", "fa": "«نه» را با لحن گرم شروع کن (I'd LOVE to…)، روی but کمی مکث کن، و بخش «نه» را با لحن پایین‌رونده و قاطع بگو. هرگز با لحن سؤالی نه نگو.", "items": ["I'd LOVE to help… but I CAN'T this week. ↘", "UNfortunately, that's not POSsible. ↘", "What I CAN do is… ↗", "Something ELSE will have to GIVE. ↘"]}, "fl": "No x 10: ۱۰ درخواست (از کوچک تا بزرگ) را تصور کن و به هر کدام در ۱۵ ثانیه نه بگو + یک جایگزین.", "rp": {"scene": "You make a series of unreasonable requests: as my manager, you want a new feature by tomorrow; as a client, you want free extra work; as a colleague, you want me to cover your shift again; as a friend, you want to borrow a lot of money. Be persuasive and a little pushy. I must say no clearly, stay friendly and offer alternatives where possible.", "role": "a pushy manager, client, colleague and friend"}, "qs": ["Can you just do it by tomorrow? It's really important.", "It's only a small change — it shouldn't cost extra, right?", "Come on, you owe me one!", "Why can't you make an exception?"], "ch": "۳ «نه» ضبط کن (به مدیر، مشتری، همکار) هر کدام ۳۰–۴۰ ثانیه. معیار قبولی: شروع گرم، نهٔ روشن (نه مبهم)، دلیل کوتاه با too/enough و یک جایگزین در هر کدام.", "work": "این هفته حداقل یک بار به درخواستی که واقعاً وقتش را نداری، با این ساختار نه بگو (حتی فارسی).", "must": ["I'd love to help, but ...", "If I take this on, something else will have to give.", "Which would you like me to prioritize?", "push back (on)", "bandwidth"]});
S({"n": 56, "ph": 6, "t": "ادارهٔ جلسه", "en": "Leading and chairing a meeting", "goal": "یک جلسه را از شروع تا پایان رهبری کنی: هدف، دستور جلسه، مدیریت زمان و افراد، تصمیم‌گیری و جمع‌بندی اقدام‌ها.", "v": [["objective", "هدف", "The objective of today's meeting is…"], ["time-box", "زمان محدود تعیین کردن", "Let's time-box this to ten minutes."], ["contribute", "مشارکت کردن", "Everyone should contribute."], ["chair (a meeting)", "اداره کردن جلسه", "Who's chairing the meeting today?"], ["owner", "مسئول (کار)", "Who's the owner of this task?"], ["minutes", "صورت‌جلسه", "Who's taking the minutes?"], ["parking lot", "فهرست موضوعات معوق جلسه", "Good point — let's put it in the parking lot."], ["follow-up", "پیگیری", "I'll send a follow-up email."]], "pv": [["kick off", "شروع کردن", "Let's kick off the meeting."], ["run over", "از زمان تعیین‌شده گذشتن", "Sorry, we're running over."], ["hear from", "نظر کسی را شنیدن", "I'd like to hear from Sara."], ["take (something) offline", "بیرون از جلسه پیگیری کردن", "Let's take that offline."]], "ex": [["Thanks for coming, everyone. Let's get started.", "ممنون که آمدید، شروع کنیم", "Thanks for coming, everyone. Let's get started."], ["The main goal today is to ...", "هدف اصلی امروز …", "The main goal today is to decide on the launch date."], ["We've only got ten minutes left, so ...", "فقط ده دقیقه مانده، پس …", "We've only got ten minutes left, so let's decide."], ["Reza, what's your take on this?", "رضا، نظر تو چیست؟", "Reza, what's your take on this?"], ["So, to recap: ...", "خب، مرور کنیم: …", "So, to recap: we launch on May 10th."], ["Who's going to take care of that?", "چه کسی مسئول آن است؟", "OK, who's going to take care of that?"]], "g": {"t": "Reported speech for meeting recaps", "fa": "برای جمع‌بندی جلسه و نقل حرف دیگران: said (that) + زمان یک قدم به عقب (will ← would، can ← could، is ← was)؛ told + شخص (He told me…، نه He said me)؛ برای سؤال: asked if/whether… با ترتیب جملهٔ خبری؛ برای درخواست: asked + شخص + to.", "ex": ["Ali said (that) he would send the report by Monday.", "Sara asked whether we could move the launch.", "The client told us the price was too high. (نه said us)", "I asked Reza to update the timeline."], "drill": "آخرین جلسه‌ای که داشتی را در ۸ جمله گزارش کن: ۳ تا با said، ۲ تا با told + شخص، ۲ تا با asked if/whether و ۱ تا با asked … to."}, "li": {"t": "BBC — English at Work 20: Setting an agenda (4 min)", "u": "https://www.youtube.com/watch?v=9iO29NsoYWw", "seg": "کل ویدیو (۴ دقیقه)", "dialog": true, "task": "تعیین دستور جلسه و اداره کردن آن. نقش کسی که جلسه را اداره می‌کند را Shadow کن."}, "pr": {"t": "Directive intonation (clear & friendly)", "fa": "رهبر جلسه باید واضح اما دوستانه باشد: جمله‌های دستوری را با لحن پایین‌رونده ولی با لبخند در صدا بگو؛ نام افراد را با تکیه بگو.", "items": ["Let's get STARted. ↘", "REza, what's your TAKE on this? ↘", "Let's take that OFFline. ↘", "So, to reCAP… ↘"]}, "fl": "Chair in 3 minutes: یک جلسهٔ خیالی ۳ دقیقه‌ای را کامل با خودت اجرا کن: شروع، دستور، ۲ مداخله (کسی زیاد حرف می‌زند / کسی ساکت است)، تصمیم و جمع‌بندی.", "rp": {"scene": "I am chairing a project meeting. You play 3–4 participants: one talks too much and goes off-topic, one is silent, one disagrees with everything, and one keeps checking the time. The goal is to agree on the new release plan in 15 minutes. I must keep control, give everyone a voice, reach a decision and assign action items with owners and deadlines.", "role": "several difficult meeting participants"}, "qs": ["Sorry, can I just add one more thing about something else?", "I don't think this plan will work at all.", "How much longer is this going to take?", "(silent participant) Um… I don't know."], "ch": "یک جلسهٔ ۳ دقیقه‌ای را از شروع تا پایان رهبری کن (با ChatGPT یا در نقش همه) و ضبط کن. معیار قبولی: هدف روشن، مدیریت حداقل ۲ رفتار مشکل‌دار، ۳ action item با مسئول و مهلت، و جمع‌بندی پایانی با ۲ جملهٔ نقل‌قول غیرمستقیم (Ali said he would…).", "work": "جلسهٔ بعدی‌ات را با جملهٔ The main goal today is… شروع کن (در هر زبانی).", "must": ["The main goal today is to ...", "So, to recap: ...", "Who's going to take care of that?", "kick off", "take (something) offline"]});
S({"n": 57, "ph": 6, "t": "تماس با مشتری", "en": "Client calls: from kick-off to follow-up", "goal": "یک تماس کامل با مشتری را مدیریت کنی: رابطه‌سازی، شنیدن نیاز، پاسخ به نگرانی، تعهد به قدم بعدی.", "v": [["requirement", "نیاز، الزام", "What are your main requirements?"], ["touch base", "با هم در تماس بودن، خبر گرفتن", "Let's touch base again next Thursday."], ["satisfied", "راضی", "Are you satisfied with the service?"], ["renew", "تمدید کردن", "Are you planning to renew?"], ["onboarding", "آموزش و راه‌اندازی اولیه", "Onboarding takes about a week."], ["support", "پشتیبانی", "Our support team is available 24/7."], ["value", "ارزش", "We want to add value."], ["long-term", "بلندمدت", "We're looking for a long-term partnership."]], "pv": [["lock in", "قطعی کردن (قیمت/تاریخ)", "Let's lock in the start date today."], ["roll out", "به‌تدریج عرضه کردن", "We'll roll it out to all your schools in May."], ["loop (someone) in", "کسی را در جریان گذاشتن", "I'll loop in our support team."], ["iron out", "رفع کردن (جزئیات)", "Let's iron out the details."]], "ex": [["Thanks for making the time.", "ممنون که وقت گذاشتید", "Thanks for making the time today."], ["Before we start, could you tell me a bit about ...?", "قبل از شروع، کمی دربارهٔ … بگویید", "Before we start, could you tell me a bit about your school?"], ["What would success look like for you?", "موفقیت از نظر شما چه شکلی است؟", "What would success look like for you in six months?"], ["I completely understand your concern.", "نگرانی شما را کاملاً درک می‌کنم", "I completely understand your concern about price."], ["Just to confirm the next steps: ...", "برای تأیید قدم‌های بعدی", "Just to confirm the next steps: I'll send the proposal by Tuesday."], ["Please don't hesitate to reach out.", "بی‌تعارف تماس بگیرید", "If you have any questions, please don't hesitate to reach out."]], "g": {"t": "Formal vs informal register", "fa": "با مشتری، زبان کمی رسمی‌تر است: phrasal verbهای خیلی خودمانی کمتر، جملات کامل‌تر، و would/could بیشتر. مقایسه کن: Get back to me ↔ Please let me know at your earliest convenience.", "ex": ["Can you send it? → Would you be able to send it?", "Want to meet? → Would you be available for a meeting?", "We'll fix it. → We'll make sure this is resolved.", "Sorry about that. → We apologize for the inconvenience."], "drill": "۸ جملهٔ خودمانی را به رسمی و ۸ جملهٔ رسمی را به خودمانی تبدیل کن."}, "li": {"t": "BBC — English at Work 29: Making a cold call (7 min)", "u": "https://www.youtube.com/watch?v=7XXXo_7HlP8", "seg": "کل ویدیو (۷ دقیقه)", "dialog": true, "task": "تماس با مشتری جدید. شروع تماس، کشف نیاز و پایان را یادداشت کن."}, "pr": {"t": "Clear articulation on the phone", "fa": "در تماس، زبان بدن وجود ندارد: انتهای کلمات را کامل بگو، سرعت را کمی پایین بیاور، اعداد و اسم‌ها را تکرار کن، و «لبخند در صدا» داشته باش.", "items": ["Thanks for making the time. (smile)", "Just to confirm: TUESday, the FIFteenth.", "That's M-A-J-I-D.", "I'll send it by FIVE p.m. your time."]}, "fl": "Client call skeleton: ۳ تماس ۶۰ ثانیه‌ای (تماس اول با مشتری جدید، تماس پیگیری فروش، تماس با مشتری ناراضی) — فقط شروع و پایان را کامل بگو.", "rp": {"scene": "This is a discovery call with a potential client: the director of a chain of private schools in another country. I lead the call: build rapport, ask about their needs and current system, understand what success means for them, handle one concern (data security or cost) and agree on next steps. Be a realistic, busy client with specific needs.", "role": "the director of a chain of private schools"}, "qs": ["So, tell me what your platform does.", "We already use another system. Why should we switch?", "How long does it take to set up?", "What kind of support do you offer?"], "ch": "یک تماس ۳ دقیقه‌ای با مشتری را با ChatGPT انجام بده و ضبط کن. معیار قبولی: شروع با رابطه‌سازی، حداقل ۴ سؤال کشف نیاز، پاسخ به یک نگرانی و جمع‌بندی قدم‌های بعدی با تاریخ.", "work": "۵ سؤال «کشف نیاز» برای مشتری‌های واقعی محصولت به انگلیسی آماده کن.", "must": ["Thanks for making the time.", "What would success look like for you?", "Just to confirm the next steps: ...", "touch base", "loop (someone) in"]});
S({"n": 58, "ph": 6, "t": "صحبت بی‌مقدمه (Impromptu)", "en": "Impromptu speaking — thinking on your feet", "goal": "بدون آمادگی، دربارهٔ هر موضوعی ۱–۲ دقیقه ساختارمند حرف بزنی؛ مهارت نهایی برای «ترجمه نکردن در ذهن».", "v": [["spontaneous", "خودجوش", "I'm not very good at spontaneous speaking."], ["off the cuff", "بی‌مقدمه، فی‌البداهه", "I'll say a few words off the cuff."], ["structure", "ساختار", "Give your answer a clear structure."], ["ramble", "حاشیه رفتن، پراکنده‌گویی", "Sorry, I'm rambling — let me get to the point."], ["on the spot", "درجا، بی‌مقدمه", "He asked me on the spot, so I had no time to prepare."], ["gut feeling", "حس درونی", "My gut feeling says it's a bad idea."], ["conclude", "نتیجه گرفتن", "To conclude, …"], ["tricky", "دشوار، زیرکانه", "That's a tricky question."]], "pv": [["think on your feet", "سریع و درجا فکر کردن", "In interviews, you need to think on your feet."], ["come to mind", "به ذهن رسیدن", "The first thing that comes to mind is…"], ["draw a blank", "هیچ چیز یادم نیامد", "I completely drew a blank."], ["spring to mind", "ناگهان به ذهن رسیدن", "Nothing springs to mind right now."]], "ex": [["That's an interesting question. I'd say ...", "سؤال جالبی است. می‌گویم …", "That's an interesting question. I'd say yes, mostly."], ["There are two ways to look at it.", "از دو زاویه می‌شود نگاه کرد", "There are two ways to look at it."], ["The first thing that comes to mind is ...", "اولین چیزی که به ذهنم می‌رسد …", "The first thing that comes to mind is my father."], ["A good example of this is ...", "مثال خوبش …", "A good example of this is what happened last year."], ["So, all in all, ...", "خلاصه در مجموع …", "So, all in all, I think it's worth it."], ["I've never really thought about it before, but ...", "هیچ‌وقت فکرش را نکرده بودم، اما …", "I've never really thought about it before, but maybe…"]], "g": {"t": "Mixed review: flexible tense switching", "fa": "در صحبت بی‌مقدمه، معمولاً باید در یک جواب بین حال، گذشته و آینده جابه‌جا شوی: نظر فعل /* ======================= Durable storage: IndexedDB mirror of the state + recordings ======================= */
const IDB = (()=>{
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      if(!("indexedDB" in window)) return rej(new Error("no indexedDB"));
      const r = indexedDB.open("sp60",1);
      r.onupgradeneeded = ()=>{ const db=r.result; if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv"); if(!db.objectStoreNames.contains("rec")) db.createObjectStore("rec"); };
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn){
    const db = await open();
    return new Promise((res,rej)=>{ const t=db.transaction(store,mode); let out; const q=fn(t.objectStore(store)); if(q) q.onsuccess=()=>{ out=q.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  }
  return { get:(s,k)=>tx(s,"readonly",o=>o.get(k)), put:(s,k,v)=>tx(s,"readwrite",o=>o.put(v,k)), del:(s,k)=>tx(s,"readwrite",o=>o.delete(k)), keys:s=>tx(s,"readonly",o=>o.getAllKeys()) };
})();
const DAY = 86400000;
function reconcileState(){
  IDB.get("kv","state").then(raw=>{
    if(raw){ let o=null; try{ o=JSON.parse(raw); }catch(e){}
      if(o && (o._ts||0) > (ST._ts||0)){ ST=Object.assign(defaultState(), o); try{ localStorage.setItem(KEY, raw); }catch(e){} route(true); }
      else if((ST._ts||0) > ((o&&o._ts)||0)) IDB.put("kv","state",JSON.stringify(ST)).catch(()=>{});
    } else if(ST._ts) IDB.put("kv","state",JSON.stringify(ST)).catch(()=>{});
  }).catch(()=>{});
}
function requestPersist(){ try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist(); }); }catch(e){} }

function backupFileName(){ const d=new Date(); const p=x=>String(x).padStart(2,"0"); return `speaking60-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`; }

/* ======================= Pronunciation audio (device text-to-speech, works offline) ======================= */
const TTS = {
  voice:null, ok:("speechSynthesis" in window) && typeof SpeechSynthesisUtterance!=="undefined",
  init(){
    if(!this.ok){ document.documentElement.classList.add("no-tts"); return; }
    const pick=()=>{ const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
      const pref=["Samantha","Ava","Allison","Susan","Google US English","Microsoft Aria","Microsoft Jenny","Alex"];
      this.voice = pref.map(p=>vs.find(v=>v.name.includes(p))).find(Boolean) || vs.find(v=>v.localService) || vs[0] || null; };
    pick(); try{ speechSynthesis.addEventListener("voiceschanged", pick); }catch(e){ speechSynthesis.onvoiceschanged=pick; }
  },
  clean(t, lower){
    let s=String(t).split("→")[0];
    s=s.replace(/\/[^\s\/][^\/]*?\//g," ").replace(/[؀-ۿ‌]+/g," ").replace(/\(\s*\)/g," ").replace(/\((pause|slow|breath|sincere|sarcastic|surprised|sympathy|soft, slow)\)/gi," ");
    s=s.replace(/\s\/\s/g,", ").replace(/\s+vs\s+/g,", ").replace(/\.\.\.|…|[↘↗→|~]/g," ").replace(/[()]/g," ").replace(/\s+/g," ").trim().replace(/^[,.\s]+|[,\s]+$/g,"");
    if(!s || /[əɪæʌɑɔɜɝθðʃʒŋʊː]/.test(s) || !/[A-Za-z]/.test(s)) return null;
    if(lower) s=s.replace(/\b(?!I\b)[A-Za-z']+\b/g, w=>w.toLowerCase());
    return s;
  },
  btn(t, lower){ if(!this.ok) return ""; const c=this.clean(t, lower); return c?`<button class="say" type="button" data-say="${esc(c)}" aria-label="پخش تلفظ" title="پخش تلفظ">🔊</button>`:""; },
  speak(text){
    if(!this.ok) return; speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; if(this.voice) u.voice=this.voice; u.rate=ST.ttsRate||1;
    speechSynthesis.speak(u);
  }
};
const rateBar = () => TTS.ok ? `<div class="ttsbar small">🔊 سرعت تلفظ: <button class="btn small ${(ST.ttsRate||1)===1?"on":""}" data-rate="1">عادی</button><button class="btn small ${(ST.ttsRate||1)<1?"on":""}" data-rate="0.7">آهسته</button></div>` : "";

/* ======================= Voice recorder with automatic pause / longest-run analysis ======================= */
const REC = {
  active:null, urls:[],
  supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
  mime(){ const c=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"]; try{ return c.find(m=>MediaRecorder.isTypeSupported(m))||""; }catch(e){ return ""; } },
  analyze(levels, dt){
    if(!levels || levels.length < 20) return null;
    const sorted=[...levels].sort((a,b)=>a-b), q=p=>sorted[Math.min(sorted.length-1, Math.floor(p*sorted.length))];
    const floor=q(0.15), peak=q(0.95);
    if(peak < 0.004) return {silent:true};
    const thr=Math.max(floor + (peak-floor)*0.18, floor*1.8);
    const sp=levels.map(v=>v>thr);
    const fill=(arr,val,maxLen)=>{ let i=0; while(i<arr.length){ if(arr[i]===val){ let j=i; while(j<arr.length && arr[j]===val) j++; const inner=i>0 && j<arr.length; if(inner && (j-i)<=maxLen) for(let k=i;k<j;k++) arr[k]=!val; i=j; } else i++; } };
    fill(sp,false,Math.round(0.3/dt)); fill(sp,true,Math.round(0.15/dt));
    const f=sp.indexOf(true), l=sp.lastIndexOf(true); if(f<0) return {silent:true};
    let pauses3=0, longest=0, runStart=f, i=f;
    while(i<=l){
      if(!sp[i]){ let j=i; while(j<=l && !sp[j]) j++; const gap=(j-i)*dt;
        if(gap>=3) pauses3++;
        if(gap>=1){ longest=Math.max(longest,(i-runStart)*dt); runStart=j; }
        i=j; } else i++;
    }
    longest=Math.max(longest,(l+1-runStart)*dt);
    const talk=(l-f+1)*dt, speech=sp.slice(f,l+1).filter(Boolean).length*dt;
    return {pauses3, longest:Math.round(longest), talk:Math.round(talk), ratio:Math.round(100*speech/Math.max(talk,0.1))};
  },
  fmt(sec){ sec=Math.max(0,Math.round(sec)); return fa(Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")); },
  async start(box){
    if(this.active) this.stop();
    const key=box.dataset.rec, limit=+box.dataset.limit||120;

    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
    catch(e){ if(ctx) ctx.close(); box.querySelector(".recmsg").textContent="دسترسی به میکروفون داده نشد. در تنظیمات مرورگر اجازهٔ میکروفون را برای این سایت روشن کن."; return; }

/* ---- items: must (5) + support (5) + optional extra; repeats are labelled as review ---- */
const norm = x => x.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
const FIRST = {};
for(const s of ALL()){ if(s.review) continue; ["v","pv","ex"].forEach(t=>s[t].forEach(it=>{ const k=norm(it[0]); if(!(k in FIRST)) FIRST[k]=s.n; })); }
const TYPE_L = {v:"لغت", pv:"فعل چندکلمه‌ای", ex:"عبارت"};
function entries(s){ const out=[]; ["v","pv","ex"].forEach(t=>s[t].forEach((it,i)=>{ const f=FIRST[norm(it[0])]; out.push({type:t,i,it,key:itemKey(s.n,t,i),rec:(f&&f<s.n)?f:null}); })); return out; }
function split(s){
  const all=entries(s);
  const must=(s.must||[]).map(k=>all.find(e=>e.it[0]===k)).filter(Boolean);
  const taken=new Set(must.map(e=>e.key));
  const pool=["ex","pv","v"].flatMap(t=>all.filter(e=>e.type===t && !e.rec && !taken.has(e.key)));
  const support=pool.slice(0,5); support.forEach(e=>taken.add(e.key));
  const extra=all.filter(e=>!taken.has(e.key));
  return {must, support, extra, core:[...must,...support]};
}

function parseReport(t){

  const r={scores:kv(line("SCORES")), bands:kv(line("BANDS")), errors:[]};
  const met=kv(line("METRICS")); if(met){ r.wpm=met.wpm_avg!=null?met.wpm_avg:met.wpm; r.epm=met.errors_per_min_avg!=null?met.errors_per_min_avg:met.errors_per_min; r.bandF=met.band_fluency; }

  const re=/I said:\s*"([^"]+)"\s*\|\s*Correct:\s*"([^"]+)"(?:\s*\|\s*Type:\s*([A-Za-z\- ]+))?/gi; let m;
  while((m=re.exec(t))) r.errors.push({wrong:m[1].trim(), right:m[2].trim(), type:(m[3]||"").toLowerCase()});
  return r;
}
function saveReport(kind, n, text){
  const r=parseReport(text);
  if(!(r.scores||r.bands||r.wpm!=null||r.must!=null||r.cefr||r.errors.length)) return {ok:false};
  const rec={ts:Date.now()};
  ["scores","must","bands","cefr","quiz","wpm","epm"].forEach(k=>{ if(r[k]!=null) rec[k]=r[k]; });
  if(kind!=="session"){
    const m=ST.metrics[n]=ST.metrics[n]||{};

    const bf=(r.bands&&r.bands.fluency!=null)?r.bands.fluency:r.bandF;
    if(bf!=null && (kind!=="transcript" || m.band==null)) m.band=bf;
  }

  const have=new Set((ST.err||[]).map(e=>e.wrong.toLowerCase())); let added=0;
  r.errors.forEach(e=>{ const k=e.wrong.toLowerCase(); if(have.has(k)) return; ST.err.push({s:n, wrong:e.wrong, right:e.right, type:tmap(e.type), done:false}); have.add(k); added++; });

  return {ok:true, rec};
}
