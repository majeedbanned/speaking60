S({"n": 18, "ph": 2, "t": "تماس تصویری و جلسهٔ آنلاین", "en": "Video calls and online meetings", "goal": "مشکلات فنی تماس را مدیریت کنی، صفحه را به اشتراک بگذاری و یک جلسهٔ آنلاین را روان پیش ببری.", "v": [["mute", "بی‌صدا", "You're on mute."], ["share (my screen)", "اشتراک صفحه", "Let me share my screen."], ["connection", "اتصال", "My connection is unstable."], ["lag", "تأخیر (صدا/تصویر)", "There's a bit of a lag."], ["frozen", "ثابت شده (تصویر)", "Your screen is frozen."], ["echo", "اکو", "I'm getting an echo."], ["background noise", "صدای زمینه", "Sorry about the background noise."], ["recording", "ضبط", "Is this call being recorded?"]], "pv": [["drop out / drop off", "قطع شدن از تماس", "Sorry, I dropped out for a second."], ["turn on / off", "روشن/خاموش کردن", "Could you turn on your camera?"], ["log in", "وارد شدن", "I can't log in to the meeting."], ["cut out", "قطع و وصل شدن (صدا)", "You're cutting out."]], "ex": [["Can everyone hear me OK?", "همه صدای من را می‌شنوند؟", "Hi all — can everyone hear me OK?"], ["I think you're on mute.", "فکر کنم میکروفونت خاموش است", "Ali, I think you're on mute."], ["Can you see my screen?", "صفحه‌ام را می‌بینید؟", "Can you see my screen now?"], ["You froze for a second there.", "چند ثانیه تصویرت ثابت شد", "Sorry, you froze for a second there."], ["Let's give it a couple more minutes.", "چند دقیقه دیگر صبر کنیم", "Let's give it a couple more minutes for others to join."], ["I'll drop the link in the chat.", "لینک را در چت می‌گذارم", "I'll drop the link in the chat."]], "g": {"t": "Passive voice (present & past)", "fa": "وقتی «چه اتفاقی افتاد» مهم‌تر از «چه کسی» است. در کار و گزارش‌های فنی بسیار رایج است: be + p.p.", "ex": ["The meeting has been canceled.", "The link was sent this morning.", "Is this call being recorded?", "The files are stored in the cloud."], "drill": "۸ جملهٔ معلوم را مجهول کن و بلند بگو: They canceled the meeting / Someone recorded the call / We sent the invoice / They fixed the bug / IT updates the system every week / Someone has changed the password / They are testing the app / Nobody told me."}, "li": {"t": "BBC — Office English, episode 4: Calls and instant messages (11 min)", "u": "https://www.youtube.com/watch?v=umVkjRE73sE", "seg": "۵ دقیقهٔ اول (بقیه اختیاری)", "dialog": true, "task": "زبان تماس و پیام کاری. عبارات تماس آنلاین را یادداشت کن."}, "pr": {"t": "gonna / wanna / gotta — شناختن و استفادهٔ به‌جا", "fa": "در گفتار سریع going to → gonna، want to → wanna، got to → gotta. لازم نیست زیاد بگویی، اما باید بشنوی و بفهمی. در جلسه‌های نیمه‌رسمی gonna کاملاً عادی است.", "items": ["I'm gonna share my screen.", "Do you wanna go first?", "I've gotta go in 5 minutes.", "What are you gonna do?", "Lemme check."]}, "fl": "Tech trouble chain: ۱۰ مشکل رایج تماس تصویری را پشت سر هم بگو و برای هر کدام یک راه‌حل پیشنهاد بده (۲ دقیقه).", "rp": {"scene": "We are starting an online project meeting. Throughout the call, create technical problems: you are on mute, your video freezes, there's an echo, you can't see my screen, you drop out once. I have to manage these problems and still present a short update about my project with my screen shared.", "role": "a remote colleague with lots of technical problems"}, "qs": ["Can you hear me now?", "Sorry, what did you say about the timeline?", "Can you share the document again?", "Can we record this for people who couldn't join?"], "ch": "شروع یک جلسهٔ آنلاین را ضبط کن (۹۰ ثانیه): خوش‌آمد، چک صدا، اشتراک صفحه، مدیریت یک مشکل فنی، شروع موضوع. معیار قبولی: حداقل ۶ عبارت امروز و ۲ جملهٔ مجهول.", "work": "در تماس تصویری بعدی‌ات، همهٔ جمله‌های فنی را در ذهنت به انگلیسی ترجمه نکن — مستقیم عبارات امروز را به کار ببر (حتی زیر لب).", "must": ["Can everyone hear me OK?", "I think you're on mute.", "You froze for a second there.", "cut out", "share (my screen)"]});
S({"n": 19, "ph": 2, "t": "گزارش به مدیر", "en": "Reporting to your manager", "goal": "در یک ۱:۱ با مدیر، اول نتیجه را بگویی (Bottom line up front)، بعد جزئیات، ریسک‌ها و درخواست.", "v": [["bottom line", "اصل مطلب", "The bottom line is we need more time."], ["overall", "در مجموع", "Overall, things are going well."], ["risk", "ریسک", "There's a risk we'll miss the deadline."], ["budget", "بودجه", "We're still within budget."], ["resource", "منبع، نیرو", "We need more resources."], ["concern", "نگرانی", "My main concern is quality."], ["highlight", "نکتهٔ برجسته؛ برجسته کردن", "I'd like to highlight two things."], ["escalate", "ارجاع به سطح بالاتر", "I might need to escalate this."]], "pv": [["run by", "نظر کسی را پرسیدن", "Can I run something by you?"], ["bring (someone) up to speed", "کسی را در جریان گذاشتن", "Let me bring you up to speed."], ["sign off on", "تأیید نهایی کردن", "Can you sign off on the budget?"], ["flag up", "هشدار دادن، مطرح کردن", "I want to flag up a potential problem."]], "ex": [["The short version is ...", "نسخهٔ کوتاهش این است", "The short version is: we're on track."], ["There are two things I want to discuss.", "دو موضوع برای بحث دارم", "There are two things I want to discuss today."], ["On the positive side, ...", "از جنبهٔ مثبت …", "On the positive side, the client is happy."], ["The main risk is ...", "ریسک اصلی …", "The main risk is the new API."], ["What I need from you is ...", "چیزی که از شما لازم دارم …", "What I need from you is a decision on the budget."], ["I'll keep you posted.", "در جریانت می‌گذارم", "I'll keep you posted on the progress."]], "g": {"t": "Discourse markers for structure", "fa": "کلماتی که ساختار حرفت را نشان می‌دهند شنونده را راحت می‌کنند و به تو زمان فکر کردن می‌دهند: first of all, on top of that, however, as a result, in short.", "ex": ["First of all, the good news.", "On top of that, we signed two new schools.", "However, the app is still slow.", "In short, we need one more developer."], "drill": "یک گزارش ۶ جمله‌ای دربارهٔ هفته‌ات بگو که هر جمله با یک Discourse marker متفاوت شروع شود. ۳ بار با محتوای متفاوت."}, "li": {"t": "BBC — English at Work 40: Having an appraisal? (6 min)", "u": "https://www.youtube.com/watch?v=D6csERMDPQY", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "گفتگوی کارمند و مدیر دربارهٔ عملکرد — همان فضای ۱:۱. نقش کارمند را Shadow کن."}, "pr": {"t": "Contrastive stress — تکیهٔ تأکیدی", "fa": "برای اصلاح یا مقایسه، کلمهٔ کلیدی را قوی‌تر بگو. تغییر تکیه، معنی را عوض می‌کند.", "items": ["I said TUESday, not Thursday.", "WE didn't break it — the update did.", "It's DELAYED, not canceled.", "The DESIGN is ready; the CODE isn't."]}, "fl": "BLUF drill: ۵ موضوع کاری مختلف را هر کدام با یک جمله «اصل مطلب» شروع کن، سپس ۳ جملهٔ پشتیبان. هر کدام حداکثر ۴۰ ثانیه.", "rp": {"scene": "This is my weekly one-on-one meeting with you, my manager. I have to give you a status update on my main project, highlight one risk and ask you for something specific (more budget, a decision or another developer). You are busy and direct: if I don't get to the point in the first 20 seconds, interrupt with 'So what's the bottom line?'.", "role": "my direct, busy manager in a 1:1"}, "qs": ["So, how are things going overall?", "What's the bottom line?", "What's worrying you the most?", "What do you need from me?"], "ch": "یک گزارش ۲ دقیقه‌ای برای مدیر ضبط کن: جمع‌بندی (۱ جمله) + ۲ پیشرفت + ۱ ریسک + ۱ درخواست. معیار قبولی: ۲۰ ثانیهٔ اول اصل مطلب را بگوید و حداقل ۴ Discourse marker.", "work": "گزارش هفتگی واقعی‌ات را (حتی اگر به فارسی باید بدهی) اول به انگلیسی و به شکل BLUF تمرین کن.", "must": ["The short version is ...", "The main risk is ...", "What I need from you is ...", "bring (someone) up to speed", "I'll keep you posted."]});
S({"n": 20, "ph": 2, "review": true, "t": "مرور و ارزیابی فاز ۲", "en": "Review & Checkpoint 2"});
S({"n": 21, "ph": 3, "t": "بیان نظر", "en": "Giving your opinion", "goal": "نظرت را با قدرت‌های مختلف (قطعی، محتاط، خنثی) بدهی و برایش دلیل و مثال بیاوری.", "v": [["opinion", "نظر", "In my opinion, it's too expensive."], ["point of view", "دیدگاه", "From my point of view, it's risky."], ["convinced", "متقاعد", "I'm not convinced it will work."], ["definitely", "قطعاً", "I definitely think we should try."], ["argument", "استدلال", "That's a strong argument."], ["evidence", "شواهد", "Is there any evidence for that?"], ["overrated", "بیش از حد تعریف‌شده", "Honestly, I think remote work is overrated."], ["pros and cons", "مزایا و معایب", "Let's look at the pros and cons."]], "pv": [["come down to", "در اصل به … برمی‌گردد", "It all comes down to money."], ["stand for", "نماد چیزی بودن؛ طرفدار بودن", "What does our brand stand for?"], ["back up", "پشتیبانی کردن (با دلیل)", "Can you back that up with data?"], ["weigh up", "سبک‌سنگین کردن", "We need to weigh up the options."]], "ex": [["The way I see it, ...", "به نظر من (طبیعی و خودمانی)", "The way I see it, we don't have a choice."], ["I'd say ...", "می‌شود گفت …", "I'd say it's about 80% done."], ["I'm not sure, but I think ...", "مطمئن نیستم اما فکر می‌کنم", "I'm not sure, but I think he's right."], ["For example, / Take ... for example.", "مثلاً …", "Take our last project, for example."], ["That's why I think ...", "برای همین فکر می‌کنم …", "That's why I think we should wait."], ["It's a tough one.", "سؤال سختیه", "Hmm, it's a tough one. Let me think."]], "g": {"t": "Opinion structures + 'I don't think' (not 'I think … not')", "fa": "در انگلیسی منفی را روی think می‌گذارند: I don't think it's a good idea — نه I think it's not a good idea (غلط نیست اما غیرطبیعی است). ساختار PREP: Point–Reason–Example–Point.", "ex": ["I don't think we need another meeting.", "I'd say it's worth trying.", "Personally, I prefer working from home because…", "So yes, I think it's a good idea."], "drill": "دربارهٔ ۵ موضوع (کار از خانه، هوش مصنوعی، تهران، شبکه‌های اجتماعی، دانشگاه) هر کدام ۴۵ ثانیه با ساختار PREP نظر بده."}, "li": {"t": "Kathryn Schulz — On being wrong", "u": "https://www.ted.com/talks/kathryn_schulz_on_being_wrong", "task": "بسیار فصیح و سریع. ۴۵ ثانیه Shadow کن (دشوار است — اشکالی ندارد). نظرت را دربارهٔ ایدهٔ اصلی ۱ دقیقه بگو.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "/ɪ/ vs /iː/", "fa": "فارسی‌زبان‌ها معمولاً این دو را یکی می‌کنند. /ɪ/ کوتاه و شل (ship)، /iː/ کشیده و لبخندی (sheep). بعضی جفت‌ها معنای بسیار متفاوتی دارند!", "items": ["ship / sheep", "live / leave", "it / eat", "sit / seat", "fill / feel", "still / steal", "think / thing / team", "business"]}, "fl": "Opinion speed round: از ChatGPT یا از لیست زیر ۱۰ سؤال بردار؛ برای هر کدام ۳۰ ثانیه جواب بده: Is money important? Should kids use phones? Is AI dangerous? Best age to marry? Cities vs. villages? Coffee vs. tea? Remote vs. office? Books vs. videos? Should English be mandatory? Is failure useful?", "rp": {"scene": "You are the host of a friendly talk show. Ask me for my opinions on 5–6 topics (technology, work, education, lifestyle). After each answer, challenge me: ask for a reason, an example, or play devil's advocate with the opposite view, so I have to defend my opinion.", "role": "a talk show host who plays devil's advocate"}, "qs": ["Is working from home better than working in an office?", "Will AI replace most programrs?", "Should schools stop giving homework?", "Is it better to work for a startup or a big company?"], "ch": "۲ دقیقه دربارهٔ «آیا هوش مصنوعی آموزش را بهتر می‌کند؟» ضبط کن با ساختار PREP. معیار قبولی: نظر روشن، ۲ دلیل، ۱ مثال واقعی و جمع‌بندی. هیچ «I think … not».", "work": "امروز دربارهٔ یکی از تصمیم‌های کاری نظرت را اول به انگلیسی با PREP در ذهنت بساز.", "must": ["The way I see it, ...", "I'd say ...", "That's why I think ...", "come down to", "back up"]});
S({"n": 22, "ph": 3, "t": "موافقت و مخالفت مؤدبانه", "en": "Agreeing and disagreeing politely", "goal": "بدون ایجاد تنش، مخالفت کنی — مخصوصاً با مدیر یا مشتری — و در عین حال حرفت را بزنی.", "v": [["disagree", "مخالف بودن", "I have to disagree with you there."], ["partly", "تا حدی", "I partly agree."], ["valid", "معتبر، منطقی", "That's a valid point."], ["perspective", "دیدگاه", "I see it from a different perspective."], ["sticking point", "نقطهٔ اختلاف اصلی", "The price is still the main sticking point."], ["alternative", "جایگزین", "Can I suggest an alternative?"], ["compromise", "مصالحه", "Maybe there's a compromise."], ["respectfully", "با احترام", "Respectfully, I see it differently."]], "pv": [["go along with", "همراهی کردن، پذیرفتن", "I can go along with that."], ["back down", "کوتاه آمدن", "He refused to back down."], ["come around (to)", "کم‌کم قانع شدن", "I'm sure she'll come around to the idea."], ["talk (someone) into", "متقاعد کردن کسی", "She talked me into it."]], "ex": [["I see what you mean, but ...", "متوجه منظورت هستم، اما …", "I see what you mean, but it's too risky."], ["I agree up to a point.", "تا حدی موافقم", "I agree up to a point, but…"], ["I'm not sure I agree.", "مطمئن نیستم موافق باشم", "I'm not sure I agree with that."], ["Have you considered ...?", "… را هم در نظر گرفته‌ای؟", "Have you considered the cost?"], ["That's a fair point.", "حرف منصفانه‌ای است", "That's a fair point. I hadn't thought of that."], ["Let's agree to disagree.", "توافق کنیم که هم‌نظر نیستیم", "OK, let's agree to disagree."]], "g": {"t": "Softening language (hedging)", "fa": "در انگلیسی حرفه‌ای، مخالفت مستقیم تند است. با seem, a bit, slightly, might, not really, I wonder if… نرمش کن.", "ex": ["It seems a bit expensive. (به جای: It's expensive.)", "That might not be the best option.", "I'm not really sure that's true.", "I wonder if we should wait a little."], "drill": "این ۶ جملهٔ تند را نرم کن: That's wrong. / Your plan is bad. / It's too late. / We can't do that. / This design is ugly. / You're not listening."}, "li": {"t": "BBC — English at Work 10: Disagreeing (4 min)", "u": "https://www.youtube.com/watch?v=F5h3tLtgVrI", "seg": "کل ویدیو (۴ دقیقه)", "dialog": true, "task": "مخالفت مؤدبانه در یک دیالوگ واقعی. ۵ عبارت مخالفت را یادداشت و Shadow کن."}, "pr": {"t": "Intonation for polite disagreement", "fa": "Well… و Hmm… با صدای کشیده و پایین‌رونده، مخالفت را نرم می‌کند. پایین آوردن ولوم و آرام کردن سرعت در لحظهٔ مخالفت، تو را مطمئن و محترم نشان می‌دهد.", "items": ["We~ll… I see what you mean, but…", "Hmm, I'm not SURE about that.", "That's a FAIR point, HOWever…", "I agree UP to a POINT."]}, "fl": "Yes, and / Yes, but: ۱۰ جملهٔ نظر (از ChatGPT یا خودت) را یکی‌یکی جواب بده: ۵ تا با موافقت + گسترش (Yes, and…) و ۵ تا با مخالفت نرم.", "rp": {"scene": "You are my manager and you have a plan I disagree with: you want to add 5 new features before the launch in two weeks. I think it's unrealistic. Defend your plan with reasonable arguments. I must disagree politely, give reasons, and suggest an alternative. Only accept a compromise if I'm respectful and convincing. Later, switch topics and disagree with one of my opinions so I practice responding.", "role": "my manager who is attached to an unrealistic plan"}, "qs": ["Why don't you like my plan?", "What would you do instead?", "Don't you think the client will be disappointed?", "Can we find a middle ground?"], "ch": "یک مخالفت ۹۰ ثانیه‌ای با تصمیم فرضی مدیرت ضبط کن: قدردانی از ایده + مخالفت نرم + دلیل + جایگزین + پیشنهاد مصالحه. معیار قبولی: حداقل ۴ ابزار hedging و بدون هیچ جملهٔ تند مستقیم.", "work": "بار بعدی که با کسی مخالف بودی، اول به ساختار I see what you mean, but… فکر کن.", "must": ["I see what you mean, but ...", "I agree up to a point.", "Have you considered ...?", "That's a fair point.", "go along with"]});
S({"n": 23, "ph": 3, "t": "مقایسهٔ گزینه‌ها و توصیه", "en": "Comparing options and making recommendations", "goal": "دو یا چند گزینه را مقایسه کنی، ملاک‌ها را روشن کنی و یک توصیهٔ مستدل بدهی.", "v": [["option", "گزینه", "We have three options."], ["cost-effective", "مقرون‌به‌صرفه", "Option B is more cost-effective."], ["reliable", "قابل اعتماد", "This vendor is more reliable."], ["drawback", "عیب، ضعف", "The main drawback is the price."], ["advantage", "مزیت", "The big advantage is speed."], ["trade-off", "بده‌بستان، هزینه-فایده", "It's a trade-off between speed and quality."], ["in the long run", "در درازمدت", "In the long run, it's cheaper."], ["worth it", "ارزشش را دارد", "Is it worth it?"]], "pv": [["opt for", "انتخاب کردن", "We opted for the cheaper plan."], ["weigh in (on)", "نظر دادن (در بحث)", "Can everyone weigh in on this?"], ["go with", "انتخاب کردن", "Let's go with option B."], ["stick with", "ماندن روی (گزینهٔ فعلی)", "Let's stick with our current provider."]], "ex": [["On the one hand, ... on the other hand, ...", "از یک طرف … از طرف دیگر", "On the one hand it's fast; on the other hand it's expensive."], ["The main difference is ...", "تفاوت اصلی …", "The main difference is the support."], ["If I had to choose, I'd go with ...", "اگر مجبور بودم انتخاب کنم …", "If I had to choose, I'd go with option A."], ["It depends on what matters more: ...", "بستگی دارد چه چیزی مهم‌تر باشد", "It depends on what matters more: price or speed."], ["It's not as ... as ...", "به اندازهٔ … نیست", "It's not as flexible as the other one."], ["All things considered, ...", "با در نظر گرفتن همه چیز", "All things considered, B is the best choice."]], "g": {"t": "Comparatives & superlatives + modifiers", "fa": "ساختار مقایسه بدون تعدیل‌کننده کم‌عمق است. با much/far/a lot (خیلی)، slightly/a bit (کمی) و not as … as دقیق‌تر حرف بزن.", "ex": ["Option A is much cheaper than B.", "It's slightly slower, but far more reliable.", "It's not as easy as it looks.", "This is by far the best solution."], "drill": "دو چیز را در ۶ جفت مقایسه کن (دو گوشی، دو شهر، دو زبان برنامه‌نویسی، دو شغل، اتوبوس/مترو، React/Flutter) با modifiers مختلف."}, "li": {"t": "Barry Schwartz — The paradox of choice", "u": "https://www.ted.com/talks/barry_schwartz_the_paradox_of_choice", "task": "پر از مثال مقایسه‌ای. ۶۰ ثانیه Shadow و بعد با کلمات خودت ایده‌اش را ۱ دقیقه بگو.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Rhythm of comparatives — than /ðən/", "fa": "than همیشه ضعیف است: /ðən/. و -er پایانی schwa است. «better than» ← «بِدِر دِن». تکیه روی صفت، نه than.", "items": ["BETter than", "CHEAPer than", "much FASTer than", "not as GOOD as", "the BEST", "far more reLIable"]}, "fl": "Would you rather…?: ۱۰ جفت گزینه را در ۳ دقیقه مقایسه کن و انتخاب کن (کار با حقوق بالا یا کار جذاب؟ تهران یا شمال؟ آیفون یا اندروید؟…). هر کدام با یک دلیل و یک مقایسه.", "rp": {"scene": "We are choosing a new tool for our company (for example: a video-call platform for online classes). You present three imaginary options with prices and features. I must ask questions, compare them, rule some out and make a recommendation to you as the decision-maker. Push back on my recommendation at least once.", "role": "a decision-maker choosing between three vendors"}, "qs": ["What's the main difference between A and B?", "Which one would you rule out, and why?", "What's the biggest trade-off here?", "So, what's your final recommendation?"], "ch": "۲ دقیقه ضبط کن: دو گزینهٔ واقعی زندگی‌ات را مقایسه کن (دو شغل، دو ابزار، دو شهر) و توصیه بده. معیار قبولی: حداقل ۵ مقایسه با modifier، یک trade-off و جملهٔ All things considered…", "work": "یک تصمیم خرید یا ابزار کاری که این هفته داری را به انگلیسی مقایسه کن.", "must": ["If I had to choose, I'd go with ...", "It depends on what matters more: ...", "trade-off", "All things considered, ...", "in the long run"]});
S({"n": 24, "ph": 3, "t": "متقاعد کردن و ارائهٔ ایده", "en": "Persuading and pitching an idea", "goal": "یک ایده را طوری ارائه بدهی که شنونده «چرا» را بفهمد و قانع شود.", "v": [["benefit", "سود، فایده", "The main benefit is time."], ["convince", "قانع کردن", "How can I convince them?"], ["proposal", "پیشنهاد", "I have a proposal."], ["return on investment (ROI)", "بازگشت سرمایه", "What's the ROI?"], ["save", "صرفه‌جویی کردن", "It'll save us ten hours a week."], ["efficient", "کارآمد", "It's much more efficient."], ["compelling", "قانع‌کننده", "That's a compelling argument."], ["opportunity", "فرصت", "It's a great opportunity."]], "pv": [["pay off", "نتیجه دادن", "It'll pay off in the long run."], ["win (someone) over", "جلب کردن نظر کسی", "We need to win the principals over."], ["point to", "اشاره به (شواهد)", "The numbers point to a clear trend."], ["take off", "اوج گرفتن، موفق شدن", "The idea really took off."]], "ex": [["Imagine if ...", "تصور کن اگر …", "Imagine if teachers didn't have to do paperwork."], ["Here's the thing: ...", "موضوع این است:", "Here's the thing: we're losing clients."], ["What this means for you is ...", "یعنی برای شما …", "What this means for you is fewer calls."], ["The best part is ...", "بهترین بخشش …", "The best part is it's free for three months."], ["Think about it this way: ...", "این‌طوری فکر کن:", "Think about it this way: it's like a personal assistant."], ["What have we got to lose?", "چه چیزی از دست می‌دهیم؟", "Let's try it for a month. What have we got to lose?"]], "g": {"t": "First conditional for consequences", "fa": "If + حال ساده، will + فعل. برای نشان دادن نتیجهٔ واقعی (خوب یا بد) یک تصمیم. unless = if not.", "ex": ["If we automate this, we'll save ten hours a week.", "If we don't act now, we'll lose the client.", "Unless we fix it, users will leave.", "As long as we test it, it'll be fine."], "drill": "برای یک ایدهٔ واقعی (مثلاً یک feature جدید) ۸ جملهٔ شرطی بگو: ۴ نتیجهٔ مثبت (If we do it…) و ۴ نتیجهٔ منفی (If we don't…/Unless…)."}, "li": {"t": "Simon Sinek — How great leaders inspire action", "u": "https://www.ted.com/talks/simon_sinek_how_great_leaders_inspire_action", "task": "کلاسیک متقاعدسازی («Start with why»). ساختار Why–How–What را یادداشت کن. ۶۰ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Pausing for impact & pitch range", "fa": "قبل از نکتهٔ مهم مکث کن. صدای یکنواخت ملال‌آور است؛ در کلمات کلیدی بالا و پایین برو. فارسی‌زبان‌ها در انگلیسی معمولاً دامنهٔ صدایشان را کم می‌کنند.", "items": ["Here's the thing… (pause) we're losing clients.", "It'll save us… (pause) TEN hours a week.", "Imagine… (pause) no more paperwork."]}, "fl": "Elevator pitch x3: یک ایده (محصول، پروژه یا خودت) را در ۶۰، ۳۰ و ۱۵ ثانیه pitch کن. نسخهٔ ۱۵ ثانیه‌ای باید فقط یک Why و یک Benefit داشته باشد.", "rp": {"scene": "I want to convince you, the principal of a large school, to start using a new app for attendance and parent communication. You are sceptical: you worry about cost, teachers' resistance and data privacy. Raise objections one by one. Be won over only if I use benefits, examples and clear consequences.", "role": "a sceptical school principal"}, "qs": ["Why should we change? The current system works fine.", "How much will it cost us?", "What if teachers don't want to use it?", "What happens to our students' data?"], "ch": "یک Pitch ۲ دقیقه‌ای برای یک ایدهٔ واقعی‌ات ضبط کن (Why → How → What → Benefit → Call to action). معیار قبولی: ۳ جملهٔ شرطی، یک Imagine if…، و یک مکث تأکیدی آگاهانه.", "work": "ارزش محصول یا کار خودت را در ۳۰ ثانیه به انگلیسی آماده کن که هر جا لازم شد بگویی.", "must": ["Here's the thing: ...", "What this means for you is ...", "Imagine if ...", "pay off", "win (someone) over"]});
S({"n": 25, "ph": 3, "t": "فرضیه‌ها و «اگر…»", "en": "Hypotheticals — what if…?", "goal": "دربارهٔ موقعیت‌های فرضی و غیرواقعی روان حرف بزنی و ذهنت را برای سؤال‌های «What would you do if…» آماده کنی.", "v": [["hypothetical", "فرضی", "It's just a hypothetical question."], ["scenario", "سناریو", "In the worst-case scenario…"], ["imagine", "تصور کردن", "Imagine you had unlimited money."], ["out of the question", "اصلاً ممکن نیست، مطرح نیست", "Quitting right now is out of the question."], ["dream", "رؤیا", "My dream job would be…"], ["what-if", "سناریوی «اگر»، فرضیه", "Let's go through a few what-ifs."], ["far-fetched", "دور از ذهن، بعید", "It sounds far-fetched, but imagine it for a second."], ["on a whim", "هوسی، بدون برنامه", "I'd probably buy a ticket on a whim."]], "pv": [["take up", "شروع کردن (سرگرمی)", "I'd take up painting."], ["give away", "بخشیدن، مفت دادن", "I'd give half of it away."], ["settle down", "ساکن شدن، سروسامان گرفتن", "I'd settle down by the sea."], ["turn down", "رد کردن (پیشنهاد)", "Would you turn down a job in Canada?"]], "ex": [["If I were you, I'd ...", "اگر جای تو بودم …", "If I were you, I'd talk to him."], ["I'd probably ...", "احتمالاً …", "I'd probably travel for a year."], ["It would depend on ...", "بستگی دارد به …", "It would depend on the salary."], ["I've never really thought about it, but ...", "راستش هیچ‌وقت فکرش را نکرده‌ام، اما …", "I've never really thought about it, but maybe…"], ["In an ideal world, ...", "در دنیای ایدئال …", "In an ideal world, I'd work four days a week."], ["Worst case, ...", "در بدترین حالت …", "Worst case, we lose a month."]], "g": {"t": "Second conditional", "fa": "If + گذشتهٔ ساده، would + فعل. برای موقعیت‌های غیرواقعی یا بعید در حال یا آینده. با I/he/she هم were طبیعی‌تر است: If I were…", "ex": ["If I had more time, I'd learn to play the guitar.", "What would you do if you lost your job?", "If I were the CEO, I'd change the office hours.", "I wouldn't do it even if they paid me."], "drill": "به ۸ سؤال What would you do if… جواب بده: won the lottery / could live anywhere / were the president / could change one thing at work / had one extra hour a day / could speak any language / met your 10-year-old self / had to leave Iran tomorrow."}, "li": {"t": "Bill Gates — The next outbreak? We're not ready", "u": "https://www.ted.com/talks/bill_gates_the_next_outbreak_we_re_not_ready", "task": "سراسر سناریو و فرضیه (what if). جملات شرطی را یادداشت کن. ۶۰ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "I'd / would've / wouldn't — contractions in conditionals", "fa": "I would در گفتار تقریباً همیشه I'd است و در سرعت بالا به سختی شنیده می‌شود. would have → would've («وودِو»).", "items": ["I'd", "you'd", "we'd go", "it'd be", "wouldn't", "would've → 'woulda'", "If I were you, I'd…"]}, "fl": "What-if chain: یک سناریو بساز و زنجیره‌ای ادامه بده: If I quit my job, I'd… If I did that, I'd… (حداقل ۸ حلقه، ۲ دقیقه).", "rp": {"scene": "Let's play 'What would you do?'. Give me unusual, fun and work-related hypothetical situations one by one (e.g. 'Your biggest client asks you to do something unethical', 'You could hire any person in the world'). Ask follow-up 'why' questions and share your own imaginary answers. Correct my conditional structures.", "role": "a curious friend playing a hypothetical game"}, "qs": ["What would you do if you didn't have to work?", "If you could change one thing about your job, what would it be?", "If you were the education minister, what would you do first?", "What would you do if your app went viral overnight?"], "ch": "۲ دقیقه دربارهٔ «اگر شرکت خودم ۱۰ برابر بزرگ‌تر بود، چه کار می‌کردم» ضبط کن. معیار قبولی: حداقل ۸ جملهٔ شرط نوع دوم درست و یک In an ideal world…", "work": "امروز یک تصمیم کاری را انتخاب کن و بگو If I were my manager, I'd…", "must": ["If I were you, I'd ...", "It would depend on ...", "In an ideal world, ...", "out of the question", "turn down"]});
S({"n": 26, "ph": 3, "t": "پیشنهاد دادن و مشاوره", "en": "Giving advice and making suggestions", "goal": "به همکار یا دوست پیشنهاد بدهی بدون اینکه آمرانه یا بی‌اثر به نظر برسی.", "v": [["advice", "توصیه (غیرقابل‌شمارش)", "Can I give you some advice?"], ["suggestion", "پیشنهاد", "That's a great suggestion."], ["recommend", "توصیه کردن", "I'd recommend talking to HR."], ["vent", "درد دل کردن، خالی کردن خود", "Sorry, I just need to vent for a minute."], ["stressed out", "استرس‌زده", "I'm really stressed out."], ["overwhelmed", "تحت فشار زیاد", "I feel overwhelmed at work."], ["balance", "تعادل", "Work-life balance is important."], ["burnout", "فرسودگی شغلی", "I think you're close to burnout."]], "pv": [["cut down on", "کم کردن (مصرف)", "You should cut down on coffee."], ["take time off", "مرخصی گرفتن", "Why don't you take some time off?"], ["open up", "درد دل کردن", "Try to open up to your manager."], ["try out", "امتحان کردن", "Try out a new routine."]], "ex": [["Have you tried ...ing?", "… را امتحان کرده‌ای؟", "Have you tried turning off notifications?"], ["Why don't you ...?", "چرا … نمی‌کنی؟", "Why don't you talk to her directly?"], ["It might be worth ...ing", "شاید ارزش داشته باشد …", "It might be worth asking for help."], ["If I were in your shoes, ...", "اگر جای تو بودم …", "If I were in your shoes, I'd say no."], ["You could always ...", "همیشه می‌توانی …", "You could always try again next year."], ["What's worked for me is ...", "چیزی که برای من جواب داده …", "What's worked for me is a fixed schedule."]], "g": {"t": "should / ought to / had better / could", "fa": "should = توصیه عادی؛ could = پیشنهاد نرم (یک گزینه)؛ had better = هشدار جدی (وگرنه…)؛ ought to = مثل should کمی رسمی‌تر. suggest + ing یا suggest (that) you + فعل ساده — هرگز suggest you to.", "ex": ["You should get more sleep.", "You could ask for a raise.", "You'd better leave now or you'll miss the flight.", "I suggest talking to your manager. / I suggest you talk to him."], "drill": "به ۶ مشکل (بی‌خوابی، حقوق کم، همکار بدقلق، یادگیری زبان، استرس، عقب ماندن پروژه) هر کدام با ۳ ساختار متفاوت پیشنهاد بده."}, "li": {"t": "Nigel Marsh — How to make work-life balance work", "u": "https://www.ted.com/talks/nigel_marsh_how_to_make_work_life_balance_work", "task": "لهجهٔ استرالیایی/بریتانیایی و شوخ‌طبع. ۶۰ ثانیه Shadow کن؛ ۳ توصیه‌اش را با کلمات خودت بگو.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "/ʊ/ vs /uː/", "fa": "/ʊ/ کوتاه (full, look, good)، /uː/ کشیده (fool, Luke, food). فارسی‌زبان‌ها معمولاً هر دو را «او»ی کشیده می‌گویند.", "items": ["full / fool", "pull / pool", "look / Luke", "good / food", "should / shoe", "could / cool", "book", "would"]}, "fl": "Advice column: ۳ مشکل را از زبان یک شخص تصور کن و برای هر کدام ۶۰ ثانیه، مثل یک مشاور، پاسخ بده.", "rp": {"scene": "You are a colleague who is stressed and overwhelmed: too much work, a difficult manager and no time for family. Tell me your problems one by one and ask for my advice. React realistically — reject some of my suggestions ('I've already tried that') so I have to offer alternatives. Then switch: I tell you a problem of mine and you advise me.", "role": "a stressed-out colleague asking for advice"}, "qs": ["What should I do about my manager?", "I've tried everything. What else can I do?", "Is it worth quitting?", "What has worked for you?"], "ch": "یک پیام صوتی ۹۰ ثانیه‌ای برای دوستی ضبط کن که می‌خواهد مهاجرت کند یا شغلش را عوض کند. معیار قبولی: حداقل ۵ ساختار پیشنهاد متفاوت و یک تجربهٔ شخصی (What's worked for me…).", "work": "اگر امروز کسی از تو نظر یا کمک خواست، پاسخت را بعداً به انگلیسی بازسازی کن.", "must": ["Have you tried ...ing?", "It might be worth ...ing", "What's worked for me is ...", "If I were in your shoes, ...", "cut down on"]});
S({"n": 27, "ph": 3, "t": "مذاکرهٔ ساده و رسیدن به توافق", "en": "Handling objections and reaching agreement", "goal": "به اعتراض طرف مقابل گوش بدهی، آن را بپذیری، پاسخ بدهی و به یک توافق برسی.", "v": [["objection", "اعتراض، ایراد", "That's a common objection."], ["flexible", "انعطاف‌پذیر", "We can be flexible on the price."], ["condition", "شرط", "On one condition."], ["deal", "معامله، توافق", "It's a deal."], ["walk away", "کنار کشیدن (از معامله)", "If the price is too high, we'll walk away."], ["concession", "امتیاز (در مذاکره)", "We're willing to make a concession."], ["middle ground", "حد وسط", "Let's find some middle ground."], ["win-win", "برد-برد", "It's a win-win solution."]], "pv": [["meet (someone) halfway", "در میانهٔ راه به توافق رسیدن", "Can we meet halfway?"], ["work out", "به نتیجه رسیدن، حل کردن", "I'm sure we can work something out."], ["back out (of)", "عقب کشیدن (از توافق)", "They backed out of the deal."], ["hold out for", "ایستادگی کردن برای", "They're holding out for a better price."]], "ex": [["I understand where you're coming from.", "می‌فهمم از چه زاویه‌ای می‌گویی", "I understand where you're coming from, but…"], ["What if we ...?", "اگر … چطور؟", "What if we split the cost?"], ["Would you be willing to ...?", "حاضری …؟", "Would you be willing to sign for two years?"], ["That could work, as long as ...", "ممکن است جواب دهد به شرطی که …", "That could work, as long as the price stays the same."], ["I'm afraid that's a deal-breaker.", "متأسفانه این خط قرمز است", "I'm afraid that's a deal-breaker for us."], ["Let's shake on it.", "بزن قدش — قبول", "Great. Let's shake on it."]], "g": {"t": "Conditionals for bargaining: as long as / provided that / unless / what if", "fa": "در مذاکره، شرط‌ها ابزار اصلی‌اند. as long as و provided that = به شرط اینکه؛ unless = مگر اینکه؛ What if we… = پیشنهاد غیرمستقیم.", "ex": ["We can lower the price as long as you pay upfront.", "Provided that you sign today, we'll include training.", "We can't start unless we get the data.", "What if we did a trial first?"], "drill": "یک مذاکرهٔ فرضی (خرید ماشین دست دوم) را با ۸ جملهٔ شرطی متنوع با خودت انجام بده."}, "li": {"t": "BBC — English at Work 30: Negotiating (5 min)", "u": "https://www.youtube.com/watch?v=-HZrTUNJKCs", "seg": "کل ویدیو (۵ دقیقه)", "dialog": true, "task": "مذاکرهٔ ساده و بده‌بستان. جمله‌های شرطی (if / as long as) را پیدا کن."}, "pr": {"t": "T-flapping (American)", "fa": "در انگلیسی آمریکایی (مدل این برنامه)، t بین دو مصوت شبیه d سریع می‌شود: water ← «وادِر»، get it ← «گِدیت». اول بشنو و بعد کم‌کم خودت هم بگو؛ تلفظت طبیعی‌تر می‌شود.", "items": ["better", "water", "a lot of → a-lodda", "get it", "what if", "meet halfway", "put it on", "city"]}, "fl": "Objection ping-pong: ۸ اعتراض رایج (It's too expensive / We don't have time / We're happy with our current supplier…) را بگو و فوراً با I understand… + پاسخ جواب بده.", "rp": {"scene": "Negotiation: I am selling a yearly software subscription to your school. You like the product but you think it's too expensive, you want a longer free trial and you want extra training. Negotiate hard but fairly. We must reach a win-win deal using conditions. Don't accept my first offer.", "role": "a tough but fair school administrator buying software"}, "qs": ["Why is it so expensive compared to others?", "Can you give us a discount?", "What if we pay for two years?", "What happens if we're not happy?"], "ch": "یک مذاکرهٔ ۲ دقیقه‌ای با ChatGPT (یا با خودت در دو نقش) ضبط کن که به توافق ختم شود. معیار قبولی: حداقل ۳ ساختار شرطی، یک I understand where you're coming from و یک توافق مشخص.", "work": "یک مذاکرهٔ کوچک روزمره (قیمت، زمان، تقسیم کار) را بعداً به انگلیسی بازسازی کن.", "must": ["I understand where you're coming from.", "Would you be willing to ...?", "That could work, as long as ...", "meet (someone) halfway", "work out"]});
S({"n": 28, "ph": 3, "t": "طوفان فکری و ایده‌پردازی", "en": "Brainstorming and building on ideas", "goal": "در جلسهٔ ایده‌پردازی، ایده بدهی، ایدهٔ دیگران را گسترش بدهی و ایده‌ها را دسته‌بندی کنی.", "v": [["brainstorm", "طوفان فکری کردن", "Let's brainstorm some ideas."], ["creative", "خلاق", "That's a creative solution."], ["feasible", "شدنی، عملی", "Is it feasible with our budget?"], ["crazy idea", "ایدهٔ دیوانه‌وار", "This might be a crazy idea, but…"], ["approach", "رویکرد", "Let's try a different approach."], ["improve", "بهبود دادن", "How can we improve onboarding?"], ["innovative", "نوآورانه", "We need something more innovative."], ["prototype", "نمونهٔ اولیه", "Let's build a quick prototype."]], "pv": [["think up", "ایده ساختن، از خود درآوردن", "Who thought up this name?"], ["build on", "بر پایهٔ چیزی ساختن", "Let me build on Ali's idea."], ["throw out (an idea)", "ایده‌ای مطرح کردن (بی‌قید)", "Let me just throw something out there."], ["play around with", "ور رفتن، آزمایش کردن", "Let's play around with the design."]], "ex": [["What if we tried ...?", "اگر … را امتحان کنیم چه؟", "What if we tried a free version?"], ["How about ...ing?", "… چطور است؟", "How about adding a chatbot?"], ["Off the top of my head, ...", "همین‌طوری که به ذهنم می‌رسد …", "Off the top of my head, three ideas…"], ["I love that idea! And we could also ...", "عاشق این ایده‌ام! و می‌توانیم …", "I love that! And we could also add videos."], ["Let's not rule anything out yet.", "فعلاً چیزی را حذف نکنیم", "Let's not rule anything out yet."], ["Let's park that for now.", "فعلاً آن را کنار بگذاریم", "Good idea — let's park that for now."]], "g": {"t": "Suggestions: Let's / How about / What about / Why don't we / We could", "fa": "How about و What about + ing یا اسم؛ Why don't we + فعل ساده؛ Let's + فعل ساده؛ We could + فعل ساده (نرم‌ترین).", "ex": ["Let's try something different.", "How about using video lessons?", "Why don't we ask the teachers?", "We could run a small pilot first."], "drill": "برای مسئلهٔ «چطور والدین بیشتری از اپ استفاده کنند؟» در ۲ دقیقه ۱۰ ایده بده، هر بار با یکی از ۵ ساختار."}, "li": {"t": "BBC — English at Work 03: Making suggestions is easy (5 min)", "u": "https://www.youtube.com/watch?v=2zyca6fGo4A", "seg": "کل ویدیو (۵ دقیقه)", "dialog": true, "task": "پیشنهاد دادن در جلسه. ساختارهای پیشنهاد (How about…، Why don't we…) را بشمار."}, "pr": {"t": "List intonation (rise, rise, fall)", "fa": "در فهرست، آیتم‌ها با صدای بالارونده و آخرین آیتم با صدای پایین‌رونده گفته می‌شود — این به شنونده نشان می‌دهد لیست تمام شد.", "items": ["We could add videos ↗, quizzes ↗, and a chatbot ↘.", "Monday ↗, Tuesday ↗, or Wednesday ↘?", "It's faster ↗, cheaper ↗, and easier to use ↘."]}, "fl": "Idea sprint: ۳ مسئله انتخاب کن. برای هر کدام ۶۰ ثانیه وقت داری حداقل ۶ ایده بگویی (کیفیت مهم نیست، فقط سرعت و روانی).", "rp": {"scene": "We are in a brainstorming session for a school-management app: how can we make students actually enjoy using it? You throw out ideas too. I must suggest ideas, build on yours ('Yes, and…'), park weak ideas politely and, at the end, help group the ideas and choose the top three.", "role": "an enthusiastic product manager in a brainstorm"}, "qs": ["What's your craziest idea?", "How could we build on that?", "Which ideas are the most feasible?", "If we could only do one thing, what would it be?"], "ch": "۲ دقیقه ضبط کن: برای «کاهش ترافیک تهران» یا «بهبود یک ویژگی محصولت» حداقل ۸ ایده بده و بعد ۲ تا را انتخاب و توجیه کن. معیار قبولی: ۵ ساختار پیشنهاد متفاوت و لحن فهرستی درست.", "work": "در جلسهٔ بعدی ایده‌پردازی، ایده‌هایت را اول در ذهنت با How about… بساز.", "must": ["What if we tried ...?", "How about ...ing?", "Off the top of my head, ...", "build on", "Let's park that for now."]});
S({"n": 29, "ph": 3, "t": "بازخورد دادن و گرفتن", "en": "Giving and receiving feedback", "goal": "بازخورد سازنده بدهی (مشخص، مبتنی بر رفتار، با راه‌حل) و به بازخورد منفی حرفه‌ای واکنش نشان بدهی.", "v": [["feedback", "بازخورد", "Can I give you some feedback?"], ["constructive", "سازنده", "It's constructive feedback."], ["sugarcoat", "ماست‌مالی کردن، بزک کردن حقیقت", "I won't sugarcoat it — the demo didn't go well."], ["actionable", "قابل اجرا، عملی (بازخورد)", "Can you give me something more actionable?"], ["strength", "نقطهٔ قوت", "Your biggest strength is communication."], ["weakness", "نقطهٔ ضعف", "What's my main weakness?"], ["impressed", "تحت تأثیر مثبت", "I was really impressed with your demo."], ["blunt", "رک (گاهی تند)", "Sorry to be blunt, but it was too long."]], "pv": [["gloss over", "سرسری رد شدن از", "Please don't gloss over the problems."], ["brush up on", "تقویت کردن (مهارتی که ضعیف شده)", "I need to brush up on my presentation skills."], ["take (something) on board", "پذیرفتن و در نظر گرفتن", "I'll take that on board."], ["pick up on", "متوجه شدن (جزئیات)", "Did you pick up on any problems?"]], "ex": [["One thing that worked really well was ...", "یکی از چیزهایی که عالی بود …", "One thing that worked really well was your intro."], ["One thing you could work on is ...", "چیزی که می‌توانی رویش کار کنی …", "One thing you could work on is timing."], ["Next time, maybe try ...", "دفعهٔ بعد شاید …", "Next time, maybe try fewer slides."], ["That's fair. / Thanks, that's really helpful.", "پذیرش بازخورد", "That's fair. I'll work on it."], ["Could you give me an example?", "می‌توانی مثال بزنی؟", "Could you give me an example of when I did that?"], ["I see your point, but let me explain ...", "متوجهم، اما بگذار توضیح بدهم", "I see your point, but let me explain what happened."]], "g": {"t": "Past modals: should have / could have / might have", "fa": "برای بازخورد به گذشته: should have + p.p. = باید می‌کردی (نکردی)؛ could have = می‌توانستی؛ might have = شاید. در گفتار: should've → «شودِو».", "ex": ["You should have told me earlier.", "We could have tested it more.", "It might have been better to wait.", "I shouldn't have sent it so quickly."], "drill": "۵ اتفاق بد کاری را تصور کن و برای هر کدام ۲ جمله با should have / could have بگو (یکی برای خودت، یکی بازخورد به دیگری)."}, "li": {"t": "BBC — English at Work 14: Giving feedback (4 min)", "u": "https://www.youtube.com/watch?v=UKz1Fsw_e8c", "seg": "کل ویدیو (۴ دقیقه)", "dialog": true, "task": "بازخورد دادن در یک دیالوگ. ببین بازخورد منفی را چطور نرم می‌کنند."}, "pr": {"t": "Word stress in -tion / -ity / -ic", "fa": "قانون مفید: تکیه دقیقاً قبل از -tion، -ity، -ic است. این قانون صدها کلمه را درست می‌کند.", "items": ["inforMAtion", "presenTAtion", "aBILity", "responsiBILity", "speCIFic", "ecoNOMic", "auTOMatic", "commuNIcation"]}, "fl": "Feedback sandwich x4: ۴ موقعیت (ارائهٔ همکار، کد یک برنامه‌نویس، غذای یک دوست، طراحی یک سایت) — برای هر کدام ۴۵ ثانیه بازخورد: مثبت + قابل‌بهبود + پیشنهاد.", "rp": {"scene": "Part 1: You are my team member who just gave a presentation to a client. It was OK but too long, with too many technical details. I have to give you constructive feedback. React a bit defensively. Part 2: You are my manager giving me critical feedback on my communication (I don't update the team enough). I must respond professionally, ask for examples and agree on next steps.", "role": "a defensive team member, then my manager"}, "qs": ["So, how did you think it went?", "What exactly was wrong with it?", "What should I do differently next time?", "How can I improve my communication?"], "ch": "یک بازخورد ۹۰ ثانیه‌ای به یک همکار فرضی ضبط کن + ۳۰ ثانیه پاسخ به یک بازخورد منفی به خودت. معیار قبولی: مشخص بودن رفتار، یک پیشنهاد عملی، ۲ past modal و لحن غیرتهاجمی.", "work": "این هفته یک بازخورد مثبت مشخص به یک همکار بده (هر زبانی) و ساختارش را به انگلیسی تمرین کن.", "must": ["One thing that worked really well was ...", "One thing you could work on is ...", "Next time, maybe try ...", "take (something) on board", "constructive"]});
S({"n": 30, "ph": 3, "review": true, "t": "مرور و ارزیابی فاز ۳ (نیمهٔ راه)", "en": "Review & Checkpoint 3 — halfway"});
S({"n": 31, "ph": 4, "t": "توضیح یک باگ یا مشکل فنی", "en": "Explaining a bug or technical issue", "goal": "یک مشکل فنی را با ترتیب «علائم ← بازتولید ← علت احتمالی ← راه‌حل» برای همکار فنی توضیح بدهی.", "v": [["bug", "باگ", "We found a bug in the login flow."], ["reproduce", "بازتولید کردن", "I can't reproduce the issue."], ["crash", "کرش کردن", "The app crashes on startup."], ["error message", "پیغام خطا", "What does the error message say?"], ["root cause", "علت ریشه‌ای", "We haven't found the root cause yet."], ["intermittent", "متناوب، گاه‌به‌گاه", "It's an intermittent issue."], ["log", "لاگ", "Let me check the logs."], ["fix", "رفع کردن؛ اصلاح", "The fix is ready for review."]], "pv": [["narrow down", "محدود کردن (دامنهٔ مشکل)", "We've narrowed it down to the cache."], ["rule out", "کنار گذاشتن (احتمال)", "We can rule out the database."], ["track down", "پیدا کردن (با جستجو)", "I finally tracked down the bug."], ["roll back", "برگرداندن نسخه", "Let's roll back to the previous version."]], "ex": [["Steps to reproduce: first ..., then ...", "مراحل بازتولید", "Steps to reproduce: first log in, then open the report."], ["It only happens when ...", "فقط وقتی … اتفاق می‌افتد", "It only happens when the file is larger than 10 MB."], ["As far as I can tell, ...", "تا جایی که می‌توانم بگویم …", "As far as I can tell, it's a timeout."], ["My best guess is that ...", "بهترین حدس من …", "My best guess is that the token expires."], ["It works on my machine, but ...", "روی سیستم من کار می‌کند، اما …", "It works on my machine, but not in production."], ["I'm looking into it.", "دارم بررسی‌اش می‌کنم", "I'm looking into it and I'll update you in an hour."]], "g": {"t": "Modals of deduction: must / might / can't (present)", "fa": "برای حدس زدن علت: must be = تقریباً مطمئنم؛ might/could be = شاید؛ can't be = غیرممکن است. در عیب‌یابی دائم استفاده می‌شوند.", "ex": ["It must be a caching problem.", "It might be the new update.", "It can't be the network — everything else works.", "The server could be overloaded."], "drill": "برای ۶ مشکل (اینترنت قطع است، اپ کند است، ایمیل نرسید، لپ‌تاپ روشن نمی‌شود، کاربر نمی‌تواند وارد شود، گزارش خالی است) با must / might / can't حدس بزن."}, "li": {"t": "Tim Harford — Trial, error and the God complex", "u": "https://www.ted.com/talks/tim_harford_trial_error_and_the_god_complex", "task": "دربارهٔ آزمون و خطا در حل مسئله. لهجهٔ بریتانیایی واضح. ۶۰ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Tech words Persian speakers often mispronounce", "fa": "کلماتی که در محیط فنی ایران معمولاً اشتباه گفته می‌شوند. هر کدام را در YouGlish گوش کن.", "items": ["cache /kæʃ/ (مثل cash)", "queue /kjuː/", "suite /swiːt/", "width /wɪdθ/", "height /haɪt/", "data /ˈdeɪtə/", "deploy /dɪˈplɔɪ/", "schema /ˈskiːmə/", "integer /ˈɪntɪdʒər/", "Linux /ˈlɪnəks/"]}, "fl": "Bug report out loud: ۳ باگ واقعی (یا فرضی) را هر کدام در ۶۰ ثانیه گزارش بده: What – Steps – Expected vs Actual – Guess.", "rp": {"scene": "You are a senior developer on my team. I report a bug: some users can't upload files in our mobile app, but only on Android and only sometimes. Ask detailed technical questions: steps to reproduce, logs, versions, what I've ruled out. Challenge my guesses and help me plan the next debugging steps.", "role": "a senior developer helping me debug"}, "qs": ["When did this start happening?", "Can you reproduce it reliably?", "What have you ruled out so far?", "What's your best guess about the root cause?"], "ch": "یک باگ واقعی از کار خودت را در ۲ دقیقه ضبط کن. معیار قبولی: ساختار ۴ مرحله‌ای، حداقل ۳ حدس با must/might/can't، و تلفظ درست حداقل ۳ واژهٔ فنی از لیست.", "work": "امروز گزارش یک باگ یا Issue را اول به انگلیسی بلند بگو، بعد بنویس.", "must": ["It only happens when ...", "My best guess is that ...", "I'm looking into it.", "rule out", "root cause"]});
S({"n": 32, "ph": 4, "t": "توصیف یک سیستم یا معماری", "en": "Describing a system or architecture", "goal": "یک سیستم را از کلی به جزئی توضیح بدهی: اجزا، نقش هر جزء و ارتباط بین آن‌ها.", "v": [["component", "جزء، مؤلفه", "The system has three main components."], ["handle", "رسیدگی کردن، مدیریت کردن", "This service handles payments."], ["connect to", "وصل شدن به", "The app connects to the API."], ["store", "ذخیره کردن", "We store the files in the cloud."], ["scalable", "مقیاس‌پذیر", "The new design is more scalable."], ["layer", "لایه", "There's a caching layer in front of it."], ["endpoint", "نقطهٔ پایانی API", "The app calls the /grades endpoint."], ["bottleneck", "گلوگاه", "The database is the bottleneck."]], "pv": [["break it down", "ساده و جزء به جزء توضیح دادن", "Let me break it down for you."], ["hook up to", "وصل کردن به", "We hooked it up to the SMS service."], ["scale up", "مقیاس را بزرگ کردن", "We need to scale up before September."], ["fall over", "از کار افتادن (سیستم)", "The server fell over under load."]], "ex": [["At a high level, ...", "در سطح کلی …", "At a high level, it's a web app with a mobile client."], ["It's made up of ...", "از … تشکیل شده", "It's made up of four services."], ["This part is responsible for ...", "این بخش مسئول … است", "This part is responsible for notifications."], ["It sits between ... and ...", "بین … و … قرار دارد", "The gateway sits between the app and the services."], ["The data flows from ... to ...", "داده از … به … می‌رود", "The data flows from the app to the main database."], ["Does that make sense so far?", "تا اینجا واضح است؟", "Does that make sense so far?"]], "g": {"t": "Passive voice for systems (present, can be, is being)", "fa": "در توصیف سیستم، فرایند مهم است نه آدم: data is stored, requests are sent, it can be scaled. مجهول با مودال: can/should/must + be + p.p.", "ex": ["Each request is sent to the gateway.", "The files are stored in S3.", "It can be scaled horizontally.", "The data is being migrated right now."], "drill": "سیستم «ارسال پیامک به والدین» (یا سیستم کاری خودت) را با ۸ جملهٔ مجهول توصیف کن."}, "li": {"t": "Sugata Mitra — Build a school in the cloud (Indian accent)", "u": "https://www.ted.com/talks/sugata_mitra_build_a_school_in_the_cloud", "seg": "۰:۰۰ تا ۳:۰۰", "task": "لهجهٔ هندی — لهجه‌ای که در جلسه‌های فنی بین‌المللی زیاد می‌شنوی. او یک سیستم آموزشی را توصیف می‌کند. ۶۰ ثانیه Shadow کن."}, "pr": {"t": "Compound noun stress", "fa": "در اسم‌های مرکب تکیه روی جزء اول است: DAtabase, LOGin page. اما در صفت + اسم تکیه روی اسم: a big DATAbase.", "items": ["DAtabase", "LOGin page", "ERror message", "PASSword reset", "USer interface", "BACKend service", "SOFTware engineer", "PHONE number"]}, "fl": "Whiteboard without a board: یک سیستم (اپ تاکسی، سیستم بانکی، اپ مدرسه) را انتخاب کن و ۲ دقیقه از کلی به جزئی توضیح بده، انگار روی تخته رسم می‌کنی.", "rp": {"scene": "You are a new developer joining our company. Ask me to explain the architecture of our main product (for example a school-management platform with a web panel, a mobile app, an API and a chat server). Ask 'why' questions about design decisions, and ask what happens when something fails.", "role": "a curious new developer joining the team"}, "qs": ["Can you give me the big picture?", "How does the mobile app talk to the backend?", "Where is the data stored?", "What's the biggest bottleneck right now?", "What would you redesign if you could?"], "ch": "معماری یک سیستم واقعی کارت را در ۲ دقیقه ضبط کن. معیار قبولی: از کلی به جزئی، حداقل ۵ جملهٔ مجهول، ۴ عبارت امروز و یک Does that make sense so far?", "work": "معماری پروژهٔ فعلی‌ات را در ۶۰ ثانیه به انگلیسی آماده کن (برای مصاحبه یا همکار جدید).", "must": ["At a high level, ...", "It's made up of ...", "This part is responsible for ...", "bottleneck", "scale up"]});
S({"n": 33, "ph": 4, "t": "توضیح یک فرایند قدم‌به‌قدم", "en": "Explaining a process step by step", "goal": "یک فرایند (فنی یا روزمره) را با ترتیب روشن، کلمات ترتیب و بدون جا انداختن مرحله توضیح بدهی.", "v": [["step", "مرحله", "The first step is to create an account."], ["process", "فرایند", "The process takes about ten minutes."], ["make sure", "مطمئن شدن", "Make sure you save your work."], ["optional", "اختیاری", "This step is optional."], ["required", "الزامی", "A password is required."], ["select", "انتخاب کردن", "Select the class from the list."], ["confirm", "تأیید کردن", "Click 'Confirm' to finish."], ["once", "به محض اینکه", "Once it's installed, restart the app."]], "pv": [["fill in / fill out", "پر کردن (فرم)", "Fill in the form with your details."], ["sign up", "ثبت‌نام کردن", "First, you need to sign up."], ["click on", "کلیک کردن روی", "Click on the blue button."], ["carry on", "ادامه دادن", "Then carry on to the next step."]], "ex": [["The first thing you need to do is ...", "اولین کاری که باید بکنی …", "The first thing you need to do is log in."], ["After that, ... / Once that's done, ...", "بعد از آن / وقتی تمام شد", "Once that's done, you'll see the dashboard."], ["Before you ..., make sure ...", "قبل از … مطمئن شو …", "Before you upload, make sure the file is a PDF."], ["If it doesn't work, try ...", "اگر کار نکرد …", "If it doesn't work, try refreshing the page."], ["The last step is ...", "آخرین مرحله …", "The last step is to click 'Publish'."], ["And that's it! / You're all set.", "همین! / آماده‌ای", "And that's it — you're all set."]], "g": {"t": "Sequencing + time clauses (when / once / as soon as / after / before)", "fa": "در بندهای زمانی آینده، بعد از when/once/as soon as از زمان حال استفاده کن نه will: Once it finishes… (نه once it will finish).", "ex": ["When you open the app, you'll see a menu.", "As soon as it's approved, you'll get an SMS.", "After you've uploaded the file, click Save.", "Before you start, check your connection."], "drill": "۳ فرایند را هر کدام در ۶ مرحله توضیح بده: درست کردن چای، ثبت نمره در سیستم، دیپلوی یک نسخهٔ جدید. در هر کدام حداقل ۳ بند زمانی."}, "li": {"t": "Tom Wujec — Build a tower, build a team", "u": "https://www.ted.com/talks/tom_wujec_build_a_tower_build_a_team", "task": "یک فرایند (Marshmallow challenge) را توضیح می‌دهد. مراحل را با کلمات خودت بازگو کن. ۶۰ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Linking sequencers into smooth chunks", "fa": "کلمات ترتیب را جدا و خشک نگو؛ به جمله بچسبان: first of all ← «فِرستِوال»، and then ← «اِندِن»، after that ← «آفتِرِدات».", "items": ["first of all", "and then", "after that", "once that's done", "as soon as it's ready", "at the end of it"]}, "fl": "Teach it in 90 seconds: ۳ کار که خوب بلدی (یک دستور غذا، یک ترفند نرم‌افزاری، یک مهارت) را هر کدام در ۹۰ ثانیه آموزش بده.", "rp": {"scene": "You are a school teacher who is not good with technology. I have to explain to you, step by step on the phone, how to enter students' grades in our online system and send a report to parents. You get confused easily, skip steps and ask 'What do I click now?'. I must be patient and clear.", "role": "a non-technical teacher on the phone"}, "qs": ["Sorry, where do I click?", "What's the next step?", "It says 'error'. What do I do?", "How do I know it worked?"], "ch": "یک فرایند واقعی کاری (مثلاً ثبت‌نام در محصولت یا دیپلوی) را در ۲ دقیقه ضبط کن. معیار قبولی: حداقل ۶ مرحله، ۵ کلمهٔ ترتیب مختلف، ۲ بند زمانی بدون will و جملهٔ پایانی.", "work": "یک راهنمای ۶۰ ثانیه‌ای شفاهی از یک قابلیت محصولت به انگلیسی آماده کن.", "must": ["The first thing you need to do is ...", "After that, ... / Once that's done, ...", "Before you ..., make sure ...", "fill in / fill out", "And that's it! / You're all set."]});
S({"n": 34, "ph": 4, "t": "گزارش حادثه (Incident / Postmortem)", "en": "Incident report and postmortem", "goal": "یک حادثهٔ فنی را از نظر زمانی دقیق تعریف کنی: چه شد، چرا، چه کردیم و چه درسی گرفتیم — بدون مقصرتراشی.", "v": [["incident", "حادثه، رخداد", "We had a major incident last night."], ["outage", "قطعی سرویس", "The outage lasted two hours."], ["downtime", "زمان از کارافتادگی", "There was 30 minutes of downtime."], ["affected", "تحت تأثیر قرار گرفته", "About 5,000 users were affected."], ["mitigate", "کاهش دادن (اثر)", "We mitigated it by restarting the service."], ["timeline", "خط زمانی", "Here's the timeline of events."], ["lesson learned", "درس گرفته‌شده", "The main lesson learned is…"], ["prevent", "جلوگیری کردن", "How can we prevent this in future?"]], "pv": [["go down", "از کار افتادن", "The website went down at 2 a.m."], ["kick in", "شروع به کار کردن (خودکار)", "The backup server didn't kick in."], ["bring back up", "دوباره بالا آوردن", "We brought the server back up at 4."], ["get to the bottom of", "تا ته ماجرا را درآوردن", "We need to get to the bottom of this."]], "ex": [["At around 2 a.m., ...", "حدود ساعت ۲ بامداد …", "At around 2 a.m., the alerts started."], ["We were alerted when ...", "وقتی … مطلع شدیم", "We were alerted when users started complaining."], ["It turned out that ...", "معلوم شد که …", "It turned out that the disk was full."], ["By the time we ..., ...", "تا وقتی ما …، …", "By the time we noticed, it had been down for an hour."], ["To prevent this from happening again, ...", "برای جلوگیری از تکرار …", "To prevent this from happening again, we've added monitoring."], ["Nobody's to blame, but ...", "کسی مقصر نیست، اما …", "Nobody's to blame, but the process failed."]], "g": {"t": "Narrative tenses: past simple + past continuous + past perfect", "fa": "past continuous = پس‌زمینه (در حال انجام بود)؛ past simple = اتفاق اصلی؛ past perfect (had + p.p.) = اتفاقی که قبل از آن رخ داده بود.", "ex": ["We were deploying the update when the site went down.", "It turned out someone had changed the config.", "By the time we arrived, the backup had already failed.", "While I was checking the logs, Ali called."], "drill": "یک حادثه (فنی یا روزمره) را با ۸ جمله تعریف کن: ۳ past continuous، ۳ past simple، ۲ past perfect."}, "li": {"t": "Amy Edmondson — How to turn a group of strangers into a team", "u": "https://www.ted.com/talks/amy_edmondson_how_to_turn_a_group_of_strangers_into_a_team", "task": "با داستان نجات معدنچیان شیلی — یک حادثهٔ واقعی. ترتیب اتفاقات را یادداشت و بازگو کن. ۶۰ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Consonant clusters in past forms", "fa": "خوشه‌های صامت پایانی را کامل بگو و «اِ» اضافه نکن: crashed /kræʃt/، fixed /fɪkst/. در گفتار سریع، صامت وسط گاهی حذف می‌شود (next day → nex day).", "items": ["crashed", "fixed it", "restarted", "alerts", "asked", "next day → nex' day", "last night → las' night", "it had been"]}, "fl": "Timeline narration: ساعت به ساعت یک روز پرحادثه (واقعی یا خیالی) را ۲ دقیقه با زمان‌های دقیق (At 9:15… By 10…) بگو.", "rp": {"scene": "This is a postmortem meeting. Last night our system was down for two hours during the exam period and thousands of students couldn't submit answers. I am the engineer who handled it. You are the CTO: ask for the timeline, the root cause, what we did, the impact and what we will change. Keep it blameless but demanding.", "role": "the CTO running a blameless postmortem"}, "qs": ["Walk me through the timeline.", "When exactly did we notice?", "What was the root cause?", "How many users were affected?", "What are we changing so it doesn't happen again?"], "ch": "گزارش شفاهی ۲ دقیقه‌ای یک حادثه (فنی یا زندگی) ضبط کن. معیار قبولی: خط زمانی دقیق، هر سه زمان روایی، It turned out that…، و یک اقدام پیشگیرانه.", "work": "آخرین مشکل جدی کاری‌ات را به شکل Postmortem به انگلیسی مرور کن.", "must": ["It turned out that ...", "By the time we ..., ...", "To prevent this from happening again, ...", "go down", "get to the bottom of"]});
S({"n": 35, "ph": 4, "t": "تخمین زمان و محدوده‌بندی کار", "en": "Estimating and scoping work", "goal": "تخمین بدهی بدون قول غیرواقعی: عدد + فرض‌ها + ریسک‌ها + بازه.", "v": [["estimate", "تخمین؛ تخمین زدن", "My rough estimate is two weeks."], ["roughly", "تقریباً", "It'll take roughly three days."], ["assumption", "فرض", "This is based on a few assumptions."], ["scope", "محدوده (کار)", "That's outside the scope."], ["effort", "میزان کار", "How much effort is it?"], ["depend on", "بستگی داشتن به", "It depends on the design."], ["buffer", "حاشیهٔ اطمینان (زمانی)", "I've added a two-day buffer."], ["ballpark figure", "عدد تقریبی", "Can you give me a ballpark figure?"]], "pv": [["add up", "جمع شدن", "All these small tasks add up."], ["factor in", "لحاظ کردن", "Did you factor in testing?"], ["cut back", "کاهش دادن (محدوده)", "We could cut back on features."], ["drag on", "کش آمدن", "The project dragged on for months."]], "ex": [["Off the top of my head, I'd say ...", "همین‌طوری بگویم …", "Off the top of my head, I'd say a week."], ["Somewhere between ... and ...", "چیزی بین … و …", "Somewhere between five and eight days."], ["That's assuming ...", "با این فرض که …", "That's assuming we get the designs on time."], ["I'd rather not commit to a date until ...", "ترجیح می‌دهم تا … تاریخ قطعی ندهم", "I'd rather not commit to a date until I've seen the code."], ["Worst case, ... Best case, ...", "بدترین حالت … بهترین حالت …", "Best case, Friday. Worst case, next Wednesday."], ["Give me a day to look into it.", "یک روز فرصت بده بررسی کنم", "Give me a day to look into it and I'll get back to you."]], "g": {"t": "Future perfect & future continuous", "fa": "will have + p.p. = تا زمانی در آینده تمام شده است؛ will be + ing = در لحظه‌ای در آینده در حال انجام است. برای تخمین و برنامه‌ریزی عالی‌اند.", "ex": ["By Friday, we'll have finished the backend.", "We'll be testing all next week.", "By the end of the month, we'll have onboarded ten schools.", "This time next week, I'll be presenting it to the client."], "drill": "برنامهٔ ۴ هفتهٔ آینده‌ات (یا یک پروژه) را با ۴ جملهٔ By…, we'll have… و ۴ جملهٔ This time next…, I'll be… بگو."}, "li": {"t": "Tim Harford — How messy problems can inspire creativity", "u": "https://www.ted.com/talks/tim_harford_how_messy_problems_can_inspire_creativity", "task": "داستان‌محور. ۶۰ ثانیه Shadow کن؛ ایدهٔ اصلی را در ۳ جمله بگو.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Numbers, ranges & percentages", "fa": "اعداد را واضح و با تکیهٔ درست بگو. بازه: from five to eight / between five and eight. درصد: fifteen percent (تکیه روی CENT). اعشار: two point five.", "items": ["fifTEEN vs FIFty percent", "two point five", "a hundred and twenty", "one and a half", "roughly thirty", "three to five days", "twenty twenty-seven", "half an hour"]}, "fl": "Estimate everything: ۱۰ چیز روزمره را تخمین بزن (مدت رسیدن به محل کار، قیمت یک لپ‌تاپ، تعداد دانش‌آموزان یک مدرسه…) هر کدام با بازه و یک فرض.", "rp": {"scene": "You are a product manager who wants a new feature (online exam proctoring with the camera) 'as soon as possible'. You want a firm date. I must ask clarifying questions about scope, give an estimate with assumptions and ranges, explain the risks and suggest cutting scope for a faster first version. Push me hard for a single date.", "role": "a pushy product manager who wants a firm date"}, "qs": ["How long will it take?", "Can't you just give me a date?", "What if we remove some features?", "What could make it take longer?"], "ch": "یک تخمین ۹۰ ثانیه‌ای برای یک کار واقعی ضبط کن. معیار قبولی: بازهٔ زمانی، حداقل ۲ فرض (That's assuming…)، یک ریسک، و ۲ جمله با future perfect/continuous.", "work": "کار بعدی‌ای که باید تخمین بزنی را اول به انگلیسی با بازه و فرض بگو.", "must": ["Somewhere between ... and ...", "That's assuming ...", "I'd rather not commit to a date until ...", "factor in", "ballpark figure"]});
S({"n": 36, "ph": 4, "t": "توضیح فنی برای آدم غیرفنی", "en": "Explaining technical things to non-technical people", "goal": "یک مفهوم فنی را بدون اصطلاح تخصصی و با تشبیه ساده توضیح بدهی.", "v": [["simply put", "به زبان ساده", "Simply put, it's a digital filing cabinet."], ["jargon", "اصطلاحات تخصصی", "Sorry, that's a lot of jargon."], ["analogy", "تشبیه، قیاس", "Let me use an analogy."], ["user-facing", "سمت کاربر، قابل مشاهده برای کاربر", "It's a user-facing change, so we'll tell the schools."], ["secure", "امن", "Your data is secure."], ["automatically", "به‌طور خودکار", "It updates automatically."], ["behind the scenes", "پشت صحنه", "Behind the scenes, it sends a request."], ["in plain English", "به زبان ساده", "Can you say that in plain English?"]], "pv": [["boil down to", "خلاصه شدن به", "It boils down to speed."], ["lock (someone) out", "بیرون ماندن از حساب (قفل شدن)", "Three wrong passwords will lock you out."], ["log out", "خارج شدن", "Always log out on shared computers."], ["put (something) simply", "ساده گفتن", "To put it simply, it's faster."]], "ex": [["Think of it like ...", "مثل … در نظرش بگیر", "Think of it like a library for your files."], ["It's a bit like ...", "یک کمی شبیه … است", "It's a bit like a post office."], ["In other words, ...", "به عبارت دیگر …", "In other words, it remembers you."], ["The important thing for you is ...", "چیزی که برای شما مهم است …", "The important thing for you is that it's safe."], ["Without getting too technical, ...", "بدون اینکه خیلی فنی شویم …", "Without getting too technical, it's a security update."], ["Does that help?", "کمکی کرد؟ روشن شد؟", "Does that help, or should I explain it differently?"]], "g": {"t": "Real present conditionals for explanations (zero conditional)", "fa": "برای قانون‌ها و رفتار سیستم: If/When + حال ساده، حال ساده. این ساختار برای توضیح اینکه «چه می‌شود اگر…» ساده و قابل‌فهم است.", "ex": ["If you forget your password, you get a code by SMS.", "When a teacher enters a grade, parents see it immediately.", "If the internet goes down, the app saves your work.", "When you close the tab, you're logged out."], "drill": "۸ جملهٔ zero conditional دربارهٔ رفتار یک اپ یا وسیله (گوشی، ATM، اپ مدرسه) بساز."}, "li": {"t": "Rory Sutherland — Perspective is everything", "u": "https://www.ted.com/talks/rory_sutherland_perspective_is_everything", "task": "شوخ، پرمثال و بریتانیایی. ببین چطور ایدهٔ پیچیده را با مثال ساده می‌کند. ۴۵ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Silent letters", "fa": "حروفی که نوشته می‌شوند اما گفته نمی‌شوند. خواندن بر اساس املا خطای رایج است.", "items": ["debt", "receipt", "Wednesday", "business", "comfortable", "colleague", "suite", "island", "listen", "walk"]}, "fl": "Explain like I'm 10: ۵ مفهوم را هر کدام در ۴۵ ثانیه برای یک بچهٔ ۱۰ ساله توضیح بده: cloud, password, API, AI, internet.", "rp": {"scene": "You are a school principal (non-technical) and you've heard scary things about 'the cloud', 'hacking' and 'AI'. Ask me simple but tricky questions about how our platform stores data, whether it's secure and what AI does with it. If I use jargon, say 'Sorry, what does that mean?'. Tell me when my explanation is clear.", "role": "a non-technical school principal"}, "qs": ["What exactly is 'the cloud'?", "Can hackers see our students' grades?", "What happens if the internet goes down?", "How does the AI part work?"], "ch": "یک مفهوم فنی از کارت را در ۹۰ ثانیه برای یک مدیر غیرفنی توضیح بده و ضبط کن. معیار قبولی: حداقل یک تشبیه، صفر اصطلاح تخصصی توضیح‌داده‌نشده، ۲ zero conditional و Does that help? در پایان.", "work": "یک قابلیت محصولت را در یک جمله با تشبیه (Think of it like…) آماده کن.", "must": ["Think of it like ...", "In other words, ...", "Without getting too technical, ...", "behind the scenes", "boil down to"]});
S({"n": 37, "ph": 4, "t": "بحث فنی و سبک‌سنگین کردن راه‌حل‌ها", "en": "Technical discussions: trade-offs and code review", "goal": "در بحث فنی (Code review، انتخاب تکنولوژی) مزایا و معایب را مطرح کنی و محترمانه روی نظرت بایستی.", "v": [["over-engineered", "پیچیده‌تر از لازم", "Honestly, this feels a bit over-engineered."], ["maintainable", "قابل نگهداری", "This code is more maintainable."], ["readable", "خوانا", "Can we make it more readable?"], ["overkill", "زیادی، بیش از حد لازم", "Microservices are overkill for us."], ["edge case", "حالت مرزی", "What about edge cases?"], ["performance", "کارایی", "It might hurt performance."], ["technical debt", "بدهی فنی", "We're adding technical debt."], ["consistent", "یکدست، سازگار", "Let's keep the naming consistent."]], "pv": [["clean up", "تمیز کردن (کد)", "Let's clean up this function."], ["split up", "تقسیم کردن", "We could split it up into two files."], ["pull out", "جدا کردن (به تابع جدا)", "Maybe pull this out into a helper."], ["hold off (on)", "فعلاً دست نگه داشتن", "Let's hold off on refactoring."]], "ex": [["Have you thought about ...?", "به … فکر کرده‌ای؟", "Have you thought about using a queue?"], ["The downside is ...", "عیبش این است که …", "The downside is it's harder to test."], ["I'd lean toward ...", "من بیشتر به … متمایلم", "I'd lean toward the simpler option."], ["It's a judgment call.", "بستگی به قضاوت دارد", "Honestly, it's a judgment call."], ["Just a nit: ...", "یک نکتهٔ خیلی جزئی", "Just a nit: this variable name is unclear."], ["Not a blocker, but ...", "مانع نیست، اما …", "Not a blocker, but we should add a test."]], "g": {"t": "Cause and effect language", "fa": "برای استدلال فنی: because of / due to + اسم؛ because / since / as + جمله؛ so / therefore / as a result برای نتیجه؛ which means … برای پیامد.", "ex": ["Due to the high traffic, the API is slow.", "Since we don't have tests, it's risky.", "It's more complex, so it'll take longer to maintain.", "We cache the results, which means fewer database calls."], "drill": "۸ جملهٔ علت و معلولی دربارهٔ تصمیم‌های فنی بساز، هر بار با یک رابط متفاوت."}, "li": {"t": "Adam Grant — The surprising habits of original thinkers", "u": "https://www.ted.com/talks/adam_grant_the_surprising_habits_of_original_thinkers", "task": "استدلال و شواهد پشت سر هم. ۶۰ ثانیه Shadow؛ یک استدلالش را نقد کن (۱ دقیقه).", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Stress shift: noun vs verb", "fa": "بعضی کلمات در نقش اسم تکیه اول و در نقش فعل تکیه دوم دارند.", "items": ["a REcord / to reCORD", "a PREsent / to preSENT", "an INcrease / to inCREASE", "a CONtract / to conTRACT", "an OBject / to obJECT", "a PROgress / to proGRESS", "an UPdate / to upDATE", "an IMport / to imPORT"]}, "fl": "Two sides: ۴ بحث فنی (Monolith vs microservices، React Native vs native، SQL vs NoSQL، build vs buy) — برای هر کدام ۳۰ ثانیه طرفداری و ۳۰ ثانیه مخالفت.", "rp": {"scene": "Code review / technical discussion: I submitted a solution that adds a new database table. You are a senior engineer who prefers a different approach (using existing collections). Discuss the trade-offs: performance, maintainability, time and technical debt. Be polite but firm. We should end with a decision or a compromise.", "role": "a senior engineer who prefers another approach"}, "qs": ["Why did you choose this approach?", "What are the downsides?", "How would this scale?", "What would you do if we had twice the time?"], "ch": "۲ دقیقه ضبط کن: یک تصمیم فنی واقعی را توضیح بده، یک جایگزین را مطرح کن، trade-off را بگو و نتیجه بگیر. معیار قبولی: ۴ رابط علت و معلول، I'd lean toward… و یک عبارت نرم (Not a blocker, but…).", "work": "در Code review یا بحث فنی بعدی، یک کامنت را اول به انگلیسی بلند بگو.", "must": ["Have you thought about ...?", "The downside is ...", "I'd lean toward ...", "Not a blocker, but ...", "edge case"]});
S({"n": 38, "ph": 4, "t": "عیب‌یابی در تماس (Troubleshooting)", "en": "Troubleshooting with someone on a call", "goal": "کسی را در تماس برای حل مشکل راهنمایی کنی: سؤال تشخیصی، دستورالعمل روشن و تأیید نتیجه.", "v": [["troubleshoot", "عیب‌یابی کردن", "Let's troubleshoot this together."], ["restart", "راه‌اندازی مجدد", "Have you tried restarting it?"], ["settings", "تنظیمات", "Go to Settings."], ["refresh", "تازه‌سازی", "Try refreshing the page."], ["version", "نسخه", "Which version are you using?"], ["screenshot", "اسکرین‌شات", "Could you send me a screenshot?"], ["tap", "ضربه زدن (روی صفحه)", "Tap the menu icon."], ["pop up", "ظاهر شدن (پنجره)", "What pops up on the screen?"]], "pv": [["switch off / switch on", "خاموش/روشن کردن", "Switch it off and on again."], ["clear out", "پاک کردن (حافظه)", "Clear out the cache."], ["scroll down", "پایین رفتن (صفحه)", "Scroll down to the bottom."], ["go back", "برگشتن", "Go back to the previous screen."]], "ex": [["What do you see on your screen right now?", "الان روی صفحه چه می‌بینی؟", "OK, what do you see on your screen right now?"], ["Let's try something.", "بیا یک چیزی امتحان کنیم", "OK, let's try something."], ["Could you read me the error?", "خطا را برایم بخوان", "Could you read me the error message?"], ["Did that work?", "جواب داد؟", "Did that work?"], ["Bear with me a second.", "یک لحظه تحمل کن", "Bear with me a second — I'm checking."], ["Let's take it one step at a time.", "قدم‌به‌قدم پیش برویم", "Don't worry. Let's take it one step at a time."]], "g": {"t": "Question tags for checking", "fa": "برای تأیید گرفتن در تماس: جملهٔ مثبت + tag منفی و برعکس. You've restarted it, haven't you? لحن پایین‌رونده = تأیید می‌خواهم؛ بالارونده = واقعاً سؤال است.", "ex": ["You're using Android, aren't you?", "You haven't changed the password, have you?", "It worked yesterday, didn't it?", "That's the right button, isn't it?"], "drill": "۱۰ جمله با question tag بساز (ترکیب زمان‌ها و مثبت/منفی)."}, "li": {"t": "BBC — English at Work 44: Dealing with IT support (6 min)", "u": "https://www.youtube.com/watch?v=7CCaA8lfJkU", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "دقیقاً موضوع امروز: یک تماس پشتیبانی فنی. نقش پشتیبان را Shadow کن."}, "pr": {"t": "Spelling letters & codes (NATO alphabet)", "fa": "در تماس فنی زیاد پیش می‌آید که کد یا ایمیل هجی کنی. جفت‌های مشکل: E/I، G/J، A/R، B/V، M/N. برای وضوح از الفبای ناتو استفاده کن: A as in Alpha.", "items": ["E /iː/ vs I /aɪ/", "G /dʒiː/ vs J /dʒeɪ/", "A /eɪ/ vs R /ɑːr/", "B as in Bravo", "V as in Victor", "M as in Mike / N as in November", "underscore, dash, dot, slash"]}, "fl": "Phone support x3: سه مشکل (وای‌فای وصل نمی‌شود، اپ وارد نمی‌شود، پرینتر چاپ نمی‌کند) — هر کدام را ۶۰ ثانیه تنها با صدا راهنمایی کن.", "rp": {"scene": "You are a parent calling support because you can't see your child's grades in our mobile app. You're not technical, you're a bit frustrated and you describe things vaguely. I must ask diagnostic questions, guide you step by step (update the app, log out and in, check the student code) and confirm it's fixed. Make one of my instructions fail the first time.", "role": "a frustrated, non-technical parent calling support"}, "qs": ["I've done everything and it still doesn't work!", "Where is the Settings button?", "It says something in red. What does it mean?", "Will I lose my data if I log out?"], "ch": "یک تماس پشتیبانی ۲ دقیقه‌ای ضبط کن (نقش خودت). معیار قبولی: حداقل ۴ سؤال تشخیصی، ۲ question tag، هجی یک کد با الفبای ناتو، و تأیید نهایی (Did that work?).", "work": "کد کاربری یا ایمیل کاری‌ات را با الفبای ناتو روان هجی کن.", "must": ["What do you see on your screen right now?", "Did that work?", "Bear with me a second.", "Let's take it one step at a time.", "go back"]});
S({"n": 39, "ph": 4, "t": "دمو و معرفی یک قابلیت", "en": "Giving a demo / walkthrough of a feature", "goal": "یک قابلیت را زنده نمایش بدهی: مسئله ← قابلیت ← نمایش ← ارزش ← سؤال‌ها.", "v": [["demo", "نمایش، دمو", "Let me give you a quick demo."], ["feature", "قابلیت", "This is our newest feature."], ["walk through", "قدم‌به‌قدم نشان دادن", "I'll walk you through it."], ["dashboard", "داشبورد", "This is the main dashboard."], ["user-friendly", "کاربرپسند", "It's very user-friendly."], ["customize", "سفارشی کردن", "You can customize the report."], ["real-time", "بلادرنگ", "You see the data in real time."], ["intuitive", "آسان‌فهم، شهودی", "The interface is very intuitive."]], "pv": [["show around", "نشان دادن جاهای مختلف", "Let me show you around the app."], ["zoom in", "بزرگ‌نمایی کردن", "Let me zoom in so you can see."], ["click through", "کلیک‌کنان جلو رفتن", "Let me click through the main screens."], ["fire up", "باز کردن، راه انداختن (برنامه)", "Let me fire up the app."]], "ex": [["What you're looking at here is ...", "چیزی که الان می‌بینید …", "What you're looking at here is the teacher view."], ["Let me show you how it works.", "بگذارید نشان بدهم چطور کار می‌کند", "Let me show you how it works."], ["As you can see, ...", "همان‌طور که می‌بینید …", "As you can see, the report is ready."], ["Here's where it gets interesting.", "اینجا جالب می‌شود", "Here's where it gets interesting."], ["Notice how ...", "دقت کنید که چطور …", "Notice how it updates instantly."], ["Any questions so far?", "تا اینجا سؤالی هست؟", "Any questions so far?"]], "g": {"t": "Countable vs uncountable (much / many, less / fewer, a piece of)", "fa": "بعضی اسم‌ها شمردنی نیستند و s جمع نمی‌گیرند — و پرکاربردترینشان دقیقاً در کار فنی‌اند: information, advice, feedback, data, software, equipment, research, progress, work, knowledge. پس informations و feedbacks غلط است. با شمردنی‌ها many/fewer/a few، با غیرشمردنی‌ها much/less/a little.", "ex": ["We got a lot of feedback from teachers. (نه feedbacks)", "Can I give you some advice? / a piece of advice", "There are fewer bugs and less downtime now.", "How much data do you store? / How many users do you have?"], "drill": "یک دموی ۶۰ ثانیه‌ای از محصولت بده و این‌ها را به کار ببر: information, feedback, data, software, progress, a few, a little, fewer, less, much, many. بعد ضبط را گوش کن و هر s اضافه روی اسم غیرشمردنی را پیدا کن."}, "li": {"t": "Chris Anderson — TED's secret to great public speaking", "u": "https://www.ted.com/talks/chris_anderson_ted_s_secret_to_great_public_speaking", "task": "دربارهٔ انتقال یک ایده. ۴ نکته‌اش را یادداشت کن و در دموی امروز به کار ببر. ۶۰ ثانیه Shadow.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Energy & pitch in a demo", "fa": "دموی یکنواخت خسته‌کننده است. کلمات هیجانی (interesting, instantly, notice) را با صدای بالاتر و مکث قبل از «لحظهٔ جالب» بگو. سرعت را در نکات کلیدی کم کن.", "items": ["Here's where it gets INteresting…", "Notice how it updates… INstantly.", "And THAT'S it!", "As you can SEE…"]}, "fl": "Narrated screen: ۳ دقیقه صفحهٔ کامپیوترت را کار کن و هر کاری می‌کنی را بلند روایت کن (Now I'm opening… I'm going to…).", "rp": {"scene": "You are a potential customer (a school administrator) watching an online demo of our school-management platform. I will describe what I'm showing (imagine the screen). Ask practical questions ('Can parents see this?', 'Does it work on phones?'), interrupt once with a concern, and at the end ask about price and next steps.", "role": "a potential customer watching a product demo"}, "qs": ["What problem does this solve for us?", "Can you show me that again?", "Does this work on mobile?", "What happens if a teacher makes a mistake?", "What are the next steps?"], "ch": "یک دموی ۲ دقیقه‌ای از یک قابلیت محصولت (یا یک اپ معروف) ضبط کن. معیار قبولی: ساختار مسئله → قابلیت → نمایش → ارزش، ۵ عبارت امروز، یک Any questions so far?، و information / feedback / data بدون s جمع.", "work": "دموی ۶۰ ثانیه‌ای مهم‌ترین قابلیت محصولت را آماده و ۳ بار تمرین کن.", "must": ["What you're looking at here is ...", "Let me show you how it works.", "Here's where it gets interesting.", "walk through", "Any questions so far?"]});
S({"n": 40, "ph": 4, "review": true, "t": "مرور و ارزیابی فاز ۴", "en": "Review & Checkpoint 4"});
S({"n": 41, "ph": 5, "t": "قصه‌گویی: ساختار یک ماجرای جذاب", "en": "Storytelling: telling a great anecdote", "goal": "یک ماجرای شخصی را با ساختار «زمینه ← مشکل ← اوج ← پایان ← نکته» جذاب تعریف کنی.", "v": [["anecdote", "خاطرهٔ کوتاه", "Let me tell you a funny anecdote."], ["hilarious", "خیلی خنده‌دار", "It was absolutely hilarious."], ["embarrassing", "خجالت‌آور", "It was so embarrassing."], ["unforgettable", "فراموش‌نشدنی", "It was an unforgettable day."], ["at first", "در ابتدا", "At first, I didn't notice."], ["all of a sudden", "یک‌دفعه", "All of a sudden, the lights went out."], ["in the end", "در آخر", "In the end, everything was fine."], ["twist", "پیچش داستان", "And then there was a twist."]], "pv": [["set off", "راه افتادن (سفر)", "We set off early in the morning."], ["pull over", "کنار زدن (ماشین)", "The police pulled us over."], ["burst out (laughing)", "ناگهان زیر خنده زدن", "Everyone burst out laughing."], ["make up", "ساختن (داستان)؛ آشتی کردن", "I'm not making this up!"]], "ex": [["This one time, ...", "یک بار … (شروع خودمانی)", "This one time, I got locked out of my own office."], ["So there I was, ...", "خلاصه من آنجا بودم …", "So there I was, in a suit, in the rain."], ["To make things worse, ...", "بدتر از همه …", "To make things worse, my phone died."], ["I couldn't believe my eyes.", "باورم نمی‌شد", "I couldn't believe my eyes."], ["You should have seen his face!", "باید قیافه‌اش را می‌دیدی!", "You should have seen his face!"], ["Looking back, ...", "حالا که فکرش را می‌کنم …", "Looking back, it was actually funny."]], "g": {"t": "Narrative tenses in stories + 'was going to'", "fa": "در قصه: past continuous برای صحنه‌سازی، past simple برای اتفاقات، past perfect برای عقب‌برگشت، و was going to برای برنامه‌ای که به هم خورد.", "ex": ["It was raining and everyone was rushing home.", "I was going to call you, but my phone died.", "I realized I had left my keys inside.", "We were just leaving when the phone rang."], "drill": "یک خاطرهٔ واقعی را با این ج
