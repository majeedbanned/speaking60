<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شصت جلسه تا روانی</title>
<meta name="description" content="برنامهٔ ۶۰ جلسه‌ای قدم‌به‌قدم برای Speaking انگلیسی در محیط کار">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D6B62">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speaking60">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

@font-face{font-family:"Vazirmatn"; src:url("fonts/vazirmatn-var.woff2") format("woff2"); font-weight:100 900; font-display:swap}
@font-face{font-family:"Source Sans 3"; src:url("fonts/source-sans-3-var.woff2") format("woff2"); font-weight:200 900; font-style:normal; font-display:swap}
@font-face{font-family:"Source Sans 3"; src:url("fonts/source-sans-3-var-italic.woff2") format("woff2"); font-weight:200 900; font-style:italic; font-display:swap}
@font-face{font-family:"JetBrains Mono"; src:url("fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; font-display:swap}

:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#14201C; --muted:#56675F; --line:#D3DDD8;
  --accent:#0D6B62; --accent-ink:#FFFFFF; --accent-soft:#D6ECE7;
  --rec:#B83227; --rec-soft:#F7E0DC; --amber:#94600A; --amber-soft:#F4E8CF; --good:#2B7A3A; --good-soft:#DCEFDC;
  --fa:"Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  --en:"Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1412; --surface:#141C1A; --surface-2:#1B2522; --ink:#E3EBE8; --muted:#98AAA3; --line:#2A3632;
    --accent:#4DBFB1; --accent-ink:#05201C; --accent-soft:#15322D;
    --rec:#EF7A6E; --rec-soft:#3A1F1C; --amber:#E3AE45; --amber-soft:#322817; --good:#6CC47A; --good-soft:#1B3020;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1412; --surface:#141C1A; --surface-2:#1B2522; --ink:#E3EBE8; --muted:#98AAA3; --line:#2A3632;
  --accent:#4DBFB1; --accent-ink:#05201C; --accent-soft:#15322D;
  --rec:#EF7A6E; --rec-soft:#3A1F1C; --amber:#E3AE45; --amber-soft:#322817; --good:#6CC47A; --good-soft:#1B3020;
}
*{box-sizing:border-box}
body{direction:rtl; background:var(--bg); color:var(--ink); font-family:var(--fa); font-size:15px; line-height:1.85; margin:0}
.wrap{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:0 64px}
a{color:var(--accent)}
.en{font-family:var(--en); direction:ltr; unicode-bidi:isolate; text-align:left}
span.en{display:inline}
h1,h2,h3,h4{text-wrap:balance; line-height:1.4; margin:0}
button{font-family:inherit; font-size:14px; cursor:pointer}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* header */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.top .bar{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; margin-inline-end:auto}
.wave{display:inline-flex; gap:2px; align-items:center; height:22px}
.wave i{display:block; width:3px; border-radius:2px; background:var(--accent)}
nav.tabs{display:flex; gap:4px; flex-wrap:wrap}
nav.tabs a{padding:6px 12px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:500; font-size:14px}
nav.tabs a.on{background:var(--accent); color:var(--accent-ink)}
nav.tabs a:hover:not(.on){background:var(--surface-2); color:var(--ink)}

/* layout */
.layout{display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; margin-top:24px}
aside.list{position:sticky; top:84px; align-self:start; max-height:calc(100vh - 100px); overflow:auto; padding-inline-end:4px}
.ph-group{margin-bottom:14px}
.ph-group h4{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.02em; margin-bottom:4px}
.ph-group a{display:flex; gap:8px; align-items:center; padding:3px 8px; border-radius:6px; text-decoration:none; color:var(--ink); font-size:13px; line-height:1.6}
.ph-group a:hover{background:var(--surface-2)}
.ph-group a.cur{background:var(--accent-soft); font-weight:700}
.ph-group a .num{font-variant-numeric:tabular-nums; min-width:22px; color:var(--muted); font-size:12px}
.ph-group a .tick{margin-inline-start:auto; font-size:12px; color:var(--good)}
.ph-group a.rv{color:var(--amber); font-weight:600}
.mobile-pick{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.list{display:none}
  .mobile-pick{display:flex; gap:8px; margin-top:16px}
  .mobile-pick select{flex:1; min-width:0}
}

/* generic */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block; padding:1px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted)}
.pill.acc{background:var(--accent-soft); color:var(--accent)}
.pill.amb{background:var(--amber-soft); color:var(--amber)}
.pill.rec{background:var(--rec-soft); color:var(--rec)}
.pill.good{background:var(--good-soft); color:var(--good)}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 14px; border-radius:8px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
input[type=text], input[type=number], select, textarea{font-family:inherit; font-size:14px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px}
textarea{width:100%; min-height:90px}
input[type=checkbox]{accent-color:var(--accent); width:17px; height:17px; vertical-align:middle}
.tbl{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:start; vertical-align:top}
th{font-size:12px; color:var(--muted); font-weight:700}
td .en{font-size:15px}

/* session */
.s-head{display:grid; gap:8px; margin-bottom:18px}
.s-head .kick{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.s-head h1{font-size:28px; font-weight:800}
.s-head .ent{font-size:18px; color:var(--muted)}
.goal{background:var(--accent-soft); border-radius:var(--r); padding:10px 14px; font-weight:500}
.plan-chips{display:flex; flex-wrap:wrap; gap:6px}
.plan-chips span{font-size:12px; padding:2px 9px; border:1px solid var(--line); border-radius:6px; color:var(--muted); background:var(--surface)}
.steps{display:grid; gap:16px}
.step{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.step > .sh{display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.step > .sh .n{width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:13px; flex:none}
.step > .sh h2{font-size:16px; font-weight:700}
.step > .sh .t{margin-inline-start:auto; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.step > .sb{padding:14px 18px; display:grid; gap:12px}
.step.challenge{border-color:var(--rec)}
.step.challenge > .sh{background:var(--rec-soft)}
.step.challenge > .sh .n{background:var(--rec); color:#fff}
.step.gpt > .sh .n{background:var(--ink); color:var(--bg)}
.how{font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:8px; padding:8px 12px}
.how ol, .how ul{margin:4px 0; padding-inline-start:20px}
.items{display:grid; gap:0}
.item{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); align-items:start}
.item:last-child{border-bottom:0}
.star{border:0; background:none; font-size:18px; line-height:1; color:var(--line); padding:2px 4px}
.star.on{color:var(--amber)}
.item .w{font-family:var(--en); direction:ltr; unicode-bidi:isolate; font-weight:700; font-size:16px}
.item .fa{color:var(--muted); font-size:13.5px}
.item .ex{font-family:var(--en); direction:ltr; text-align:left; font-style:italic; color:var(--ink); opacity:.85; font-size:14.5px}
.item .top{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
.cols3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}
@media (max-width:1100px){ .cols3{grid-template-columns:minmax(0,1fr)} }
.sub{font-size:13px; font-weight:700; color:var(--accent); margin-bottom:2px}
.gram-ex{display:grid; gap:4px; padding-inline-start:0; margin:0; list-style:none}
.gram-ex li{font-family:var(--en); direction:ltr; text-align:left; padding:4px 10px; border-left:3px solid var(--accent); background:var(--surface-2); border-radius:0 6px 6px 0}
.drill{border:1px dashed var(--accent); border-radius:8px; padding:8px 12px}
.pron{display:flex; flex-wrap:wrap; gap:6px}
.pron > *{font-family:var(--en); direction:ltr; padding:3px 10px; border-radius:6px; background:var(--surface-2); font-size:14px; text-decoration:none; color:var(--ink)}
.pron a{border:1px solid var(--line)}
.pron a:hover{border-color:var(--accent)}
.pron a::after{content:" ↗"; font-size:11px; color:var(--accent)}
.prompt{display:grid; gap:8px}
.prompt pre{font-family:var(--mono); font-size:12.5px; line-height:1.6; direction:ltr; text-align:left; white-space:pre-wrap; word-break:break-word; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:14px; margin:0; max-height:420px; overflow:auto}
.copy{justify-self:start}
.srs-block{display:grid; gap:10px}
.srs-src{border:1px solid var(--line); border-radius:8px; padding:8px 12px}
.srs-src .lbl{font-size:12px; color:var(--muted); margin-bottom:4px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-family:var(--en); direction:ltr; font-size:14px; padding:2px 10px; border-radius:6px; background:var(--surface-2); border:1px solid transparent; cursor:pointer; color:var(--ink)}
.chip.on{border-color:var(--amber); background:var(--amber-soft)}
.chip[title]{cursor:help}
.navrow{display:flex; justify-content:space-between; gap:10px; margin-top:22px; flex-wrap:wrap}
.check-line{display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:8px; background:var(--surface-2); font-weight:600}
.focusbox{border:1px solid var(--amber); background:var(--amber-soft); border-radius:8px; padding:10px 14px}
.focusbox h4{color:var(--amber); font-size:14px; margin-bottom:4px}

/* guide & long text */
.doc{display:grid; gap:18px; max-width:860px}
.doc h1{font-size:30px; font-weight:800}
.doc h2{font-size:20px; font-weight:800; margin-bottom:6px}
.doc p{margin:0}
.doc ul, .doc ol{margin:4px 0; padding-inline-start:22px}
.lead{font-size:17px}
.hero{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:20px; align-items:stretch; margin-top:24px}
@media (max-width:800px){ .hero{grid-template-columns:minmax(0,1fr)} }
.next{background:var(--ink); color:var(--bg); border-radius:var(--r); padding:20px; display:grid; gap:10px; align-content:start}
.next .big{font-size:24px; font-weight:800}
.next a.btn{justify-self:start; background:var(--accent); color:var(--accent-ink); border:0; text-decoration:none; font-weight:700}
.progress-bar{height:8px; border-radius:99px; background:color-mix(in srgb, var(--bg) 25%, transparent); overflow:hidden}
.progress-bar i{display:block; height:100%; background:var(--accent)}
.phase-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
@media (max-width:800px){ .phase-grid{grid-template-columns:minmax(0,1fr)} }
.phase-grid .card{padding:14px 16px}
.phase-grid .card h3{font-size:15px}
.kpi{font-variant-numeric:tabular-nums}
.ok{color:var(--good); font-weight:700}
.bad{color:var(--rec); font-weight:700}
.cando td:last-child{white-space:nowrap}
.cando select{padding:2px 6px}
.note{border-inline-start:3px solid var(--amber); padding-inline-start:12px}
@media (prefers-reduced-motion: no-preference){ .wave i{animation:w 1.4s ease-in-out infinite alternate} .wave i:nth-child(2){animation-delay:.2s} .wave i:nth-child(3){animation-delay:.4s} .wave i:nth-child(4){animation-delay:.6s} }
@keyframes w{from{transform:scaleY(.5)}to{transform:scaleY(1)}}

/* daily mobile mode */
.plan-chips{display:none}
details.step{scroll-margin-top:70px}
details.step > summary{list-style:none; cursor:pointer}
details.step > summary::-webkit-details-marker{display:none}
details.step:not([open]) > summary{border-bottom:0}
details.step.isdone > summary{background:var(--good-soft)}
details.step.isdone > summary .n{background:var(--good); color:#fff}
.stepbtn{justify-self:start; padding:10px 18px; font-weight:700}
.howd > summary{cursor:pointer; font-size:13px; color:var(--accent); font-weight:600}
.howd[open] > summary{margin-bottom:6px}
.today-bar{display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); margin-top:16px; margin-bottom:6px}
.progress-bar.thin{height:6px; background:var(--surface-2); margin-bottom:14px}
.s-head{gap:6px; margin-bottom:14px}
.s-head h1{font-size:24px}
.s-head .ent{font-size:15px}
.reveal{margin-top:8px; padding:10px 12px; border-radius:8px; background:var(--surface-2); display:grid; gap:4px}
.reveal .ex{font-style:italic; opacity:.85}
.chip.sel{outline:2px solid var(--accent)}
.chip.known{opacity:.45}
.biglist .ph-group a{font-size:15px; padding:8px 10px}
.biglist .ph-group h4{font-size:13px; margin-top:10px}
.morelist{display:grid; gap:10px}
.morecard{display:grid; gap:2px; text-decoration:none; color:var(--ink)}
@media (max-width:900px){
  header.top{backdrop-filter:none; background:var(--bg)}
  .brand{font-size:15px}
  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:6; justify-content:space-around; gap:0; background:var(--surface); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs a{flex:1; text-align:center; padding:8px 4px}
  .wrap{padding-block:0 96px}
  .step > .sh{padding:12px 14px}
  .step > .sb{padding:12px 14px}
}

.s-head .kick{display:none}

input::placeholder, textarea::placeholder{color:var(--muted); opacity:.55}
.tags{display:flex; gap:6px; margin-top:3px; flex-wrap:wrap}
.tag{font-size:11px; padding:0 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); line-height:1.8}
.tag.rec{background:var(--amber-soft); color:var(--amber)}
.humanbox{border:1px solid var(--accent); background:var(--accent-soft); border-radius:8px; padding:10px 14px; margin-bottom:6px}
.humanbox h4{color:var(--accent); font-size:14px; margin-bottom:4px}
.kit{display:grid; gap:6px; margin-top:4px}
.pgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.pgrid label{display:grid; gap:4px; font-size:13px}
.pgrid input{width:100%}
.pgrid .row{grid-column:1/-1}
@media (max-width:700px){ .pgrid{grid-template-columns:minmax(0,1fr)} }
.phlist{display:grid; gap:4px; padding-inline-start:20px; margin:6px 0 0}
.phlist .btn{padding:1px 8px; font-size:12px}
section.card h2{margin-bottom:4px}
.sb > .sub{margin-top:6px}

/* pronunciation audio, recorder, banners */
.say{border:0; background:none; padding:0 4px; margin:0 2px; font-size:15px; line-height:1; cursor:pointer; vertical-align:middle}
html.no-tts .say{display:none}
.pron .pitem{display:inline-flex; align-items:center; gap:4px}
.pron .pitem a{border:0; padding:0; background:none; color:var(--accent)}
.ttsbar{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.ttsbar .btn{padding:2px 10px}
.ttsbar .btn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.rec{border:1px dashed var(--line); border-radius:8px; padding:8px 10px; display:grid; gap:6px; margin-top:6px}
.recbtn{background:var(--rec); color:#fff; border-color:var(--rec); font-weight:700}
.rec .meter{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.rec .meter i{display:block; height:100%; width:0; background:var(--rec)}
.rec audio{width:100%; height:38px}
.rec .cmp{color:var(--good)}
.banner{border:1px solid var(--amber); background:var(--amber-soft); border-radius:8px; padding:10px 14px; margin-top:10px; display:grid; gap:4px; font-size:14px}
.banner .btn{justify-self:start}
.btn.small{padding:2px 10px; font-size:13px}
.morelist .card{display:grid; gap:4px}

/* ChatGPT round-trip */
.report{border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; gap:6px; background:var(--surface)}
.report textarea{min-height:110px; font-size:13px}
.prompt .row{gap:8px}
.mini-steps{margin:0; padding-inline-start:20px; display:grid; gap:2px}
a.btn{text-decoration:none; display:inline-flex; align-items:center}
.mini-steps, .how ol{list-style-type:persian}

</style>
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><span class="wave" aria-hidden="true"><i style="height:10px"></i><i style="height:20px"></i><i style="height:14px"></i><i style="height:22px"></i></span>شصت جلسه تا روانی</div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<div class="wrap" id="app"></div>
<script>
const SESSIONS = [];
function S(o){ SESSIONS[o.n] = o; }
S({"n": 1, "ph": 1, "t": "معرفی خودت و شغلت", "en": "Introducing yourself and your job", "goal": "در ۶۰ ثانیه، بدون مکث طولانی، خودت، نقشت و کاری که این روزها انجام می‌دهی را معرفی کنی.", "v": [["role", "نقش، سِمت", "My role is mostly technical."], ["responsible for", "مسئولِ (کاری)", "I'm responsible for the backend."], ["in charge of", "سرپرستِ، عهده‌دارِ", "She's in charge of sales."], ["background", "سابقه، پیشینه", "I have a background in computer science."], ["client", "مشتری سازمانی", "Most of our clients are schools."], ["field", "حوزهٔ کاری", "I've been in this field for ten years."], ["currently", "در حال حاضر", "I'm currently working on a mobile app."], ["mostly", "عمدتاً", "I mostly work from home."]], "pv": [["work on", "روی چیزی کار کردن", "I'm working on a new feature."], ["deal with", "رسیدگی کردن، سروکار داشتن", "I deal with a lot of customer requests."], ["set up", "راه‌اندازی کردن", "I set up the company in 2018."], ["end up", "در نهایت سر از جایی درآوردن", "I studied physics but ended up in software."]], "ex": [["What do you do (for a living)?", "سؤال طبیعیِ «شغلت چیه؟»", "— What do you do? — I'm a software developer."], ["I work in / at / for ...", "in = حوزه، at = محل، for = شرکت", "I work in ed-tech, for a small startup."], ["Basically, ...", "برای ساده کردن توضیح", "Basically, I build tools for schools."], ["The main part of my job is ...", "بخش اصلی کارم …", "The main part of my job is solving problems."], ["It's a bit hard to explain, but ...", "وقتی توضیح سخت است", "It's a bit hard to explain, but I connect systems."], ["What about you?", "برگرداندن سؤال", "That's what I do. What about you?"]], "g": {"t": "Present Simple vs Present Continuous", "fa": "Present Simple برای چیزهای ثابت و همیشگی (نقش، عادت، واقعیت). Present Continuous برای کارهای موقتیِ «این روزها». در معرفی شغلی هر دو را کنار هم لازم داری.", "ex": ["I manage a team of developers. (همیشگی)", "This month I'm working on a payment system. (موقت)", "We usually release on Sundays, but this week we're releasing on Tuesday."], "drill": "۱۰ جمله دربارهٔ کار خودت بگو، ننویس: ۵ تا با Simple (همیشگی) و ۵ تا با Continuous (این روزها). اگر بیشتر از ۵ ثانیه مکث کردی، جمله را ساده‌تر کن."}, "li": {"t": "BBC — English at Work 04: Introduce yourself and make some friends (4 min)", "u": "https://www.youtube.com/watch?v=1AmS9h8g3E4", "seg": "کل ویدیو (۴ دقیقه)", "dialog": true, "task": "یک دیالوگ واقعی محیط کار دربارهٔ آشنایی. نقش یکی از شخصیت‌ها را Shadow کن."}, "pr": {"t": "Word stress — تکیهٔ کلمه", "fa": "فارسی‌زبان‌ها معمولاً تکیه را روی هجای آخر می‌گذارند. در انگلیسی جای تکیه ثابت نیست و اگر اشتباه باشد، کلمه سخت‌تر فهمیده می‌شود. هجای بزرگ‌شده را بلندتر، کشیده‌تر و با صدای بالاتر بگو.", "items": ["deVELop", "COMpany", "MANager", "engiNEER", "exPERience", "reSPONsible", "techNOLogy", "CUStomer"]}, "fl": "Self-intro ladder (روش ۴/۳/۲): معرفی خودت را ۳ بار پشت سر هم بگو: اول در ۹۰ ثانیه، بعد ۶۰ ثانیه، بعد ۴۵ ثانیه. محتوا ثابت است؛ فقط سریع‌تر و روان‌تر می‌شود.", "rp": {"scene": "We are at a tech networking event and we have just met. Ask about my job, my company, my background and what I'm working on these days. At some point, mention that you work in a completely different industry and ask me to explain my job simply.", "role": "a friendly professional at a networking event"}, "qs": ["So, what do you do?", "How did you end up in this field?", "What does a typical day look like for you?", "What are you working on these days?", "What do you like most about your job?"], "ch": "یک معرفی ۶۰ ثانیه‌ای ضبط کن: اسم، نقش، مسئولیت‌ها، پروژهٔ فعلی و یک نکتهٔ جالب. معیار قبولی: حداقل ۴ عبارت از امروز، هیچ مکثی بیش از ۳ ثانیه، و Simple و Continuous درست به کار رفته باشند.", "work": "امشب کارهای امروزت را در ذهنت به انگلیسی مرور کن: «Today I worked on… I dealt with…».", "must": ["What do you do (for a living)?", "The main part of my job is ...", "responsible for", "work on", "end up"]});
S({"n": 2, "ph": 1, "t": "روال روزانه و عادت‌های کاری", "en": "Daily routine and work habits", "goal": "روز کاری‌ات را از صبح تا شب با جزئیات و با قیدهای تکرار، طبیعی توضیح بدهی.", "v": [["routine", "روال، برنامهٔ ثابت", "My morning routine is pretty simple."], ["commute", "رفت‌وآمد به محل کار", "My commute takes about 40 minutes."], ["schedule", "برنامهٔ زمانی", "I have a busy schedule on Mondays."], ["task", "کار، وظیفه", "I start with the most difficult task."], ["priority", "اولویت", "My top priority today is the release."], ["productive", "پربازده", "I'm most productive in the morning."], ["distraction", "عامل حواس‌پرتی", "My phone is my biggest distraction."], ["break", "استراحت کوتاه", "I take a short break every hour."]], "pv": [["get up", "از خواب بلند شدن", "I usually get up at 6:30."], ["check in", "خبر گرفتن، اعلام حضور", "I check in with the team at 9."], ["catch up on", "عقب‌افتادگی را جبران کردن", "I catch up on emails after lunch."], ["wind down", "آرام شدن در پایان روز", "I read a bit to wind down."]], "ex": [["First thing in the morning, ...", "اولین کار صبح", "First thing in the morning, I check my messages."], ["It depends on the day.", "بستگی به روز دارد", "It depends on the day, but usually…"], ["Most days, ...", "بیشتر روزها", "Most days, I work until six."], ["I try to ... but it doesn't always work.", "سعی می‌کنم … اما همیشه نمی‌شود", "I try to avoid meetings in the morning, but it doesn't always work."], ["By the time I ..., I've already ...", "تا وقتی که … قبلش …", "By the time I get to work, I've already read the news."], ["That's pretty much it.", "جمع‌بندی خودمانی: همین دیگه", "Then I have dinner and go to bed. That's pretty much it."]], "g": {"t": "Adverbs of frequency + used to", "fa": "قیدهای تکرار (always, usually, often, sometimes, rarely, never) معمولاً قبل از فعل اصلی و بعد از be می‌آیند. used to برای عادت‌های گذشته که دیگر وجود ندارند.", "ex": ["I usually start work at 8.", "I'm rarely late.", "I used to work in an office, but now I work remotely.", "I didn't use to drink coffee."], "drill": "برای هر قید تکرار یک جمله دربارهٔ خودت بگو (۶ جمله)، بعد ۴ جمله با used to دربارهٔ تفاوت زندگی ۵ سال پیش و الان."}, "li": {"t": "Tim Urban — Inside the mind of a master procrastinator", "u": "https://www.ted.com/talks/tim_urban_inside_the_mind_of_a_master_procrastinator", "task": "خنده‌دار و پر از زبان محاوره است. ۶۰ ثانیهٔ اول را Shadow کن و به لحن طنزش دقت کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "/w/ در برابر /v/", "fa": "رایج‌ترین خطای فارسی‌زبان‌ها: گفتن «vork» به جای work. برای /w/ لب‌ها را گرد کن (مثل «او») و دندان‌ها لب را لمس نکنند؛ برای /v/ دندان بالا روی لب پایین است.", "items": ["work", "week", "well", "we were", "very", "video", "wave", "wind down", "vowel", "awkward"]}, "fl": "Narrate your day: ۲ دقیقه بدون توقف، روز دیروزت را ساعت به ساعت بگو. قانون: اگر کلمه‌ای را بلد نبودی، دورش بزن و ادامه بده؛ نایست.", "rp": {"scene": "You are a new colleague who wants to understand how I organize my day and how I stay productive. Compare my routine with yours and ask for tips.", "role": "a new colleague who just joined my team"}, "qs": ["What does your morning look like?", "When are you most productive?", "What's your biggest distraction at work?", "How is your routine different from five years ago?", "What do you do to wind down after work?"], "ch": "۹۰ ثانیه روز کاری معمولت را ضبط کن. معیار قبولی: حداقل ۴ قید تکرار، ۲ جمله با used to، و work/week با /w/ درست تلفظ شده باشند.", "work": "فردا صبح موقع شروع کار، سه اولویت روزت را بلند به انگلیسی بگو: «My top priority today is…».", "must": ["First thing in the morning, ...", "It depends on the day.", "catch up on", "I try to ... but it doesn't always work.", "productive"]});
S({"n": 3, "ph": 1, "t": "Small Talk در محیط کار", "en": "Small talk at work", "goal": "یک گفتگوی کوتاه و دوستانه را شروع کنی، ادامه بدهی و مؤدبانه تمام کنی.", "v": [["a long weekend", "آخر هفتهٔ طولانی (با تعطیلی)", "Are you doing anything for the long weekend?"], ["hectic", "پرمشغله، شلوغ", "It's been a hectic week."], ["exhausted", "خیلی خسته", "I'm exhausted after that meeting."], ["get some rest", "کمی استراحت کردن", "I just stayed home and got some rest."], ["swamped", "سرم خیلی شلوغ است", "I'm swamped this week — can we talk on Monday?"], ["lately", "اخیراً", "What have you been up to lately?"], ["stuck in traffic", "در ترافیک گیر افتادن", "Sorry I'm late — I got stuck in traffic."], ["actually", "راستش، در واقع", "Actually, I stayed home."]], "pv": [["catch up", "از حال هم باخبر شدن", "We should catch up sometime."], ["come up", "پیش آمدن (کار ناگهانی)", "Something came up, so I left early."], ["head off", "راه افتادن، رفتن", "I'd better head off now."], ["run into", "اتفاقی کسی را دیدن", "I ran into Sara at the café."]], "ex": [["How's it going?", "حالت چطوره؟ (خودمانی)", "— How's it going? — Not bad, you?"], ["What have you been up to?", "این روزها چه کار می‌کنی؟", "What have you been up to lately?"], ["Can't complain.", "بد نیست، راضی‌ام", "— How are things? — Can't complain."], ["Same here.", "من هم همین‌طور", "— I'm so tired. — Same here."], ["Oh, really? How come?", "واقعاً؟ چرا؟ (ادامهٔ گفتگو)", "Oh, really? How come?"], ["Anyway, I'll let you get back to work.", "پایان مؤدبانهٔ گفتگو", "Anyway, I'll let you get back to work. See you later!"]], "g": {"t": "Present Perfect Continuous for 'lately'", "fa": "برای کارهایی که از مدتی پیش شروع شده و هنوز ادامه دارد یا تازه تمام شده: have/has been + ing. در Small Talk خیلی پرکاربرد است.", "ex": ["What have you been up to?", "I've been working a lot lately.", "It's been raining all week.", "I've been meaning to call you."], "drill": "۸ جمله دربارهٔ کارهایی که «این روزها» انجام می‌دهی با have been + ing بگو (ورزش، کار، سریال، یادگیری…)."}, "li": {"t": "BBC Real Easy English — Talking about the office (5 min)", "u": "https://www.youtube.com/watch?v=O6h8qq5rBi0", "seg": "کل ویدیو (۵ دقیقه)", "dialog": true, "task": "گفتگوی طبیعی و دوستانه دربارهٔ محیط کار؛ دقیقاً لحن Small Talk. به واکنش‌های کوتاه (Really?، Right) دقت کن."}, "pr": {"t": "Schwa /ə/ — مهم‌ترین صدای انگلیسی", "fa": "بیشتر هجاهای بدون تکیه در انگلیسی به یک «اِ»ی خیلی کوتاه و شل تبدیل می‌شوند. اگر همهٔ هجاها را کامل بگویی، لهجه‌ات «کتابی» می‌شود.", "items": ["about → əBOUT", "today → təDAY", "problem → PROBləm", "support → səPORT", "second → SECənd", "weekend", "banana", "comfortable → KUMF-tər-bəl"]}, "fl": "Question chain: ۱ دقیقه فقط سؤال Small Talk بپرس (پشت سر هم، بدون تکرار). هدف: حداقل ۱۲ سؤال مختلف.", "rp": {"scene": "It's Monday morning and we meet in the office kitchen while making coffee. Start with small talk: the weekend, the week ahead, traffic, a TV series. After 3–4 minutes, I have to end the conversation politely because I have a meeting.", "role": "a friendly colleague from another department"}, "qs": ["How was your weekend?", "What have you been up to lately?", "Any plans for the holidays?", "Have you watched anything good recently?", "How's work been this week?"], "ch": "یک Small Talk کامل ۲ دقیقه‌ای با ChatGPT انجام بده که خودت شروعش کنی و خودت مؤدبانه تمامش کنی. معیار قبولی: حداقل ۳ سؤال پیگیری (Follow-up) پرسیده باشی و حداقل ۲ بار have been + ing گفته باشی.", "work": "امروز حداقل یک Small Talk واقعی (حتی فارسی) را بعدش در ذهنت به انگلیسی بازسازی کن.", "must": ["What have you been up to?", "Anyway, I'll let you get back to work.", "swamped", "catch up", "Oh, really? How come?"]});
S({"n": 4, "ph": 1, "t": "پرسیدن سؤال خوب و ادامه‌دادن گفتگو", "en": "Asking good questions and keeping a conversation going", "goal": "به جای جواب‌های کوتاه، گفتگو را با سؤال‌های باز و واکنش‌های طبیعی زنده نگه داری.", "v": [["curious", "کنجکاو", "I'm curious — how did you start?"], ["fascinating", "خیلی جالب، گیرا", "That's fascinating — how did you get into it?"], ["follow-up question", "سؤال پیگیری", "Always ask a follow-up question."], ["take (on something)", "نظر، برداشت (خودمانی)", "What's your take on remote work?"], ["experience", "تجربه", "Tell me about your experience."], ["elaborate (on)", "بیشتر توضیح دادن", "Could you elaborate on that a little?"], ["for instance", "برای مثال", "For instance, what would you do first?"], ["in a nutshell", "به‌طور خلاصه", "So, in a nutshell, what happened?"]], "pv": [["go on", "ادامه دادن", "Sorry, go on."], ["bring up", "مطرح کردن (موضوع)", "You brought up a good point."], ["find out", "فهمیدن، کشف کردن", "How did you find out about it?"], ["talk about", "دربارهٔ چیزی حرف زدن", "What would you like to talk about?"]], "ex": [["What was that like?", "چه حسی داشت؟ چطور بود؟", "You moved to Canada? What was that like?"], ["How did that happen?", "چطور شد؟", "You changed careers? How did that happen?"], ["That makes sense.", "منطقی است", "Oh, that makes sense."], ["No way! / Seriously?", "واکنش تعجب (خودمانی)", "No way! Seriously?"], ["Tell me more about ...", "بیشتر بگو دربارهٔ …", "Tell me more about your project."], ["Speaking of ...", "حالا که حرفش شد …", "Speaking of travel, have you been to Turkey?"]], "g": {"t": "Question forms (Wh- questions, subject questions)", "fa": "در سؤال، فعل کمکی قبل از فاعل می‌آید (What do you…?). اما وقتی Who/What خودش فاعل است، کمکی نمی‌خواهد: Who called? نه Who did call?", "ex": ["Where do you work?", "What made you choose this job?", "Who told you that?", "How long have you been doing this?"], "drill": "۱۰ سؤال باز (با How/Why/What) دربارهٔ کار یک همکار فرضی بپرس، سپس ۵ سؤالی که Who/What فاعل است."}, "li": {"t": "Julian Treasure — 5 ways to listen better", "u": "https://www.ted.com/talks/julian_treasure_5_ways_to_listen_better", "task": "گوینده بسیار شمرده حرف می‌زند؛ عالی برای Shadowing ریتم و مکث. ۶۰ ثانیه را Shadow کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Intonation in questions", "fa": "سؤال‌های Wh- معمولاً با صدای پایین‌رونده تمام می‌شوند؛ سؤال‌های بله/خیر با صدای بالارونده. فارسی‌زبان‌ها اغلب همه را بالا می‌برند.", "items": ["Where do you WORK? ↘", "What do you THINK? ↘", "Do you like it? ↗", "Is it FAR? ↗", "How did that HAPpen? ↘", "Are you SURE? ↗"]}, "fl": "Five-follow-up drill: یک جملهٔ ساده بگو (مثلاً I went to Shiraz last month.) و بعد ۵ سؤال پیگیری از خودت بپرس و جواب بده. ۳ دور با ۳ جملهٔ مختلف.", "rp": {"scene": "You are a quiet person who gives short answers. My job is to keep the conversation going with good questions and reactions. Only give longer answers when I ask a real open question. After 5 minutes, switch: you ask the questions and I must give long answers.", "role": "a shy new colleague who gives short answers"}, "qs": ["Tell me something interesting that happened to you recently.", "What's something you're curious about these days?", "What's the best advice anyone gave you?", "What question do people ask you too often?"], "ch": "۳ دقیقه گفتگو که فقط تو سؤال می‌پرسی و واکنش نشان می‌دهی. معیار قبولی: حداقل ۸ سؤال باز، ۴ واکنش طبیعی (That makes sense، No way…) و هیچ سؤال بله/خیر پشت سر هم.", "work": "در اولین جلسهٔ امروز فقط گوش بده و در ذهنت ۳ سؤال پیگیری به انگلیسی بساز.", "must": ["What was that like?", "That makes sense.", "elaborate (on)", "Tell me more about ...", "find out"]});
S({"n": 5, "ph": 1, "t": "توضیح چیزی که کلمه‌اش را بلد نیستی", "en": "Describing things when you don't know the word (circumlocution)", "goal": "وقتی کلمه‌ای یادت نمی‌آید، گیر نکنی و با توصیف، مکالمه را ادامه بدهی — مهم‌ترین مهارت برای کم کردن ترجمهٔ ذهنی.", "v": [["device", "دستگاه، وسیله", "It's a small device you plug in."], ["tool", "ابزار", "It's a tool for measuring things."], ["shape", "شکل", "It's round, sort of like a ball."], ["material", "جنس", "It's made of plastic."], ["used for", "برای … استفاده می‌شود", "It's used for cutting paper."], ["similar to", "مشابهِ", "It's similar to a laptop, but smaller."], ["the opposite of", "عکسِ، متضادِ", "It's the opposite of generous."], ["whatever it's called", "هر چی اسمش هست", "That thing — whatever it's called."]], "pv": [["plug in", "به برق زدن", "You plug it in to charge it."], ["point out", "اشاره کردن", "Let me point out the difference."], ["figure out", "فهمیدن، سر درآوردن", "I can't figure out the word."], ["look up", "جستجو کردن (در دیکشنری)", "Let me look it up later."]], "ex": [["It's a kind of ...", "نوعی … است", "It's a kind of software for schools."], ["It's something you use to ...", "چیزی که برای … استفاده می‌کنی", "It's something you use to open bottles."], ["It's the person who ...", "آن شخصی که …", "It's the person who fixes pipes."], ["What's the word for ...?", "کلمه‌اش چیه برای …؟", "What's the word for the thing on a shirt?"], ["I can't think of the word, but ...", "کلمه‌اش یادم نمی‌آید اما …", "I can't think of the word, but it means very tired."], ["You know what I mean?", "متوجهی چی می‌گم؟", "It's kind of blue-green, you know what I mean?"]], "g": {"t": "Relative clauses (who / which / that / where)", "fa": "برای توصیف بدون دانستن کلمه، بهترین ابزار: who برای آدم، which/that برای چیز، where برای مکان، when برای زمان.", "ex": ["It's a person who helps you with legal problems. (lawyer)", "It's a place where you can borrow books. (library)", "It's a thing that keeps food cold. (fridge)", "It's the time when everyone goes home."], "drill": "برای ۱۰ کلمهٔ زیر بدون گفتن خود کلمه، تعریف بساز: dentist, airport, stapler, deadline, landlord, charger, receipt, pharmacy, colleague, weekend."}, "li": {"t": "Joe Smith — How to use a paper towel (4 min)", "u": "https://www.ted.com/talks/joe_smith_how_to_use_a_paper_towel", "task": "توضیح یک چیز ساده با زبان ساده و پرانرژی. کل تاک را گوش کن؛ ۴۵ ثانیه را Shadow کن؛ بعد روش را با کلمات خودت توضیح بده.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "s-clusters بدون «اِ»ی اضافه", "fa": "فارسی‌زبان‌ها قبل از خوشه‌های s یک «اِ» اضافه می‌کنند: «اِسکول»، «اِستیودنت». صدای s را مستقیم شروع کن؛ مثل صدای مار «سسس» و بلافاصله حرف بعدی.", "items": ["school", "student", "study", "speak", "strategy", "spring", "screen", "sprint", "stress", "small"]}, "fl": "Taboo game: ۱۰ کلمه انتخاب کن (از وسایل اطرافت) و هر کدام را در ۲۰ ثانیه بدون گفتن خود کلمه توصیف کن. تایمر بگذار.", "rp": {"scene": "Play a 'guess the word' game. First, you describe everyday and work-related things without saying the word and I guess. Then I describe 8 things (you choose them and tell me the words secretly in a hint like 'Describe: a stapler') and you guess. Push me to keep talking when I get stuck.", "role": "a fun language partner running a word-guessing game"}, "qs": ["Describe a tool you use every day without saying its name.", "Describe your job to a 7-year-old.", "Describe a Persian food to someone who has never tried it.", "Describe a feeling that doesn't have an exact English word."], "ch": "۵ چیز که انگلیسی‌شان را نمی‌دانی (از وسایل خانه یا کار) انتخاب کن و هر کدام را ۲۰ ثانیه توصیف کن و ضبط کن. معیار قبولی: هیچ‌جا به فارسی نرفتی و متوقف نشدی.", "work": "هر بار امروز کلمه‌ای یادت نیامد، به جای جستجو، اول با It's a kind of… توصیفش کن؛ بعد جستجو کن.", "must": ["It's a kind of ...", "It's something you use to ...", "I can't think of the word, but ...", "figure out", "similar to"]});
S({"n": 6, "ph": 1, "t": "تعریف کردن اتفاقات گذشته", "en": "Talking about past events (what happened)", "goal": "یک اتفاق گذشته را با ترتیب درست، فعل‌های گذشتهٔ درست و کلمات ربط طبیعی تعریف کنی.", "v": [["out of nowhere", "یک‌دفعه، بی‌مقدمه", "Out of nowhere, the server just stopped."], ["suddenly", "ناگهان", "Suddenly, the power went out."], ["eventually", "در نهایت (بعد از مدتی)", "Eventually, we found a solution."], ["afterwards", "بعد از آن", "Afterwards, we went for dinner."], ["surprised", "متعجب", "I was really surprised."], ["the other day", "چند روز پیش", "I ran into an old colleague the other day."], ["memorable", "به‌یادماندنی", "It was a memorable trip."], ["on the way", "در راه", "On the way home, I got a call."]], "pv": [["turn out", "معلوم شدن، از آب درآمدن", "It turned out to be a great day."], ["show up", "پیدا شدن، حاضر شدن", "He didn't show up."], ["go out", "بیرون رفتن (تفریح)", "We went out for dinner."], ["get back", "برگشتن", "We got back really late."]], "ex": [["So, what happened was ...", "شروع تعریف ماجرا", "So, what happened was, my laptop died."], ["The funny thing is ...", "جالبیش اینه که …", "The funny thing is, nobody noticed."], ["Long story short, ...", "خلاصه‌اش اینه که …", "Long story short, we missed the flight."], ["It was one of those days.", "از اون روزها بود", "It was one of those days — everything went wrong."], ["Anyway, ...", "خلاصه (برگشت به داستان)", "Anyway, we finally got home."], ["You won't believe what happened.", "باورت نمی‌شه چی شد", "You won't believe what happened yesterday."]], "g": {"t": "Past Simple + irregular verbs", "fa": "هستهٔ تعریف کردن ماجرا. خطای رایج در Speaking: گفتن فعل حال به جای گذشته زیر فشار (I go به جای I went). ۲۰ فعل بی‌قاعدهٔ پرکاربرد باید «خودکار» شوند.", "ex": ["I went, saw, took, got, made, came, left, told, thought, found", "We didn't know what to do.", "Did you see it?", "I left early, missed the bus and got to work late."], "drill": "این ۲۰ فعل را در ۶۰ ثانیه به گذشته بگو و با هر کدام یک جملهٔ کوتاه بساز: go, see, take, get, make, come, leave, tell, think, find, buy, bring, feel, forget, give, know, meet, pay, send, spend."}, "li": {"t": "Ric Elias — 3 things I learned while my plane crashed (5 min)", "u": "https://www.ted.com/talks/ric_elias_3_things_i_learned_while_my_plane_crashed", "task": "یک روایت کوتاه و احساسی با زمان گذشته. همه فعل‌های گذشته‌ای که می‌شنوی را یادداشت کن؛ ۶۰ ثانیهٔ اول را Shadow کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "-ed endings: /t/ /d/ /ɪd/", "fa": "-ed سه تلفظ دارد و هیچ‌وقت «اِد» کامل نیست مگر بعد از t/d. بعد از صداهای بی‌واک (k, p, s, sh, ch) می‌شود /t/.", "items": ["worked /t/", "fixed /t/", "asked /t/", "called /d/", "planned /d/", "needed /ɪd/", "started /ɪd/", "decided /ɪd/"]}, "fl": "Story in 3 speeds: یک اتفاق دیروز را ۳ بار بگو: ۹۰، ۶۰ و ۴۵ ثانیه. بار سوم باید فقط با Long story short شروع شود.", "rp": {"scene": "We are friends meeting for coffee on Saturday. Ask me about my week and push me to tell you one story in detail: what happened, when, who was there, how I felt and how it ended. Then tell me a short story of your own and ask me questions about it.", "role": "a close friend meeting me for coffee"}, "qs": ["What did you do last weekend?", "Tell me about a day when everything went wrong.", "What's the last trip you took?", "Tell me about a time you were really surprised."], "ch": "یک ماجرای واقعی ۲ دقیقه‌ای ضبط کن (شروع، اتفاق اصلی، پایان). معیار قبولی: حداقل ۱۰ فعل گذشتهٔ درست، ۳ کلمهٔ ربط (then, suddenly, eventually…) و یک Long story short.", "work": "امروز یکی از اتفاقات جلسه یا کارت را برای خودت به زمان گذشته تعریف کن.", "must": ["So, what happened was ...", "Long story short, ...", "turn out", "eventually", "The funny thing is ..."]});
S({"n": 7, "ph": 1, "t": "تجربه‌ها و دستاوردها", "en": "Experiences and achievements", "goal": "دربارهٔ تجربه‌ها و دستاوردهایت بدون قاطی کردن Present Perfect و Past Simple صحبت کنی.", "v": [["achievement", "دستاورد", "My biggest achievement was launching the app."], ["challenge", "چالش", "It was a real challenge."], ["manage to", "موفق شدن به (با زحمت)", "We managed to finish on time."], ["launch", "راه‌اندازی/عرضه کردن", "We launched the product last year."], ["skill", "مهارت", "I've learned a lot of new skills."], ["proud of", "افتخار کردن به", "I'm really proud of my team."], ["so far", "تا الان", "So far, we have 100 schools."], ["self-taught", "خودآموخته", "I'm mostly a self-taught developer."]], "pv": [["take on", "پذیرفتن (مسئولیت)", "I've taken on more responsibility."], ["pick up", "یاد گرفتن (غیررسمی)", "I picked up some Spanish in Spain."], ["grow up", "بزرگ شدن", "I grew up in Tehran."], ["give up", "دست کشیدن، رها کردن", "I've never given up on English."]], "ex": [["I've been lucky enough to ...", "این شانس را داشتم که …", "I've been lucky enough to work with great people."], ["One thing I'm proud of is ...", "یکی از چیزهایی که بهش افتخار می‌کنم …", "One thing I'm proud of is our mobile app."], ["It was a steep learning curve.", "یادگیری‌اش سخت و سریع بود", "The first year was a steep learning curve."], ["I've never ... before.", "تا حالا هرگز … نکرده‌ام", "I've never given a talk in English before."], ["Have you ever ...?", "تا حالا …؟", "Have you ever run your own business?"], ["As far as I remember, ...", "تا جایی که یادم هست", "As far as I remember, it was 2019."]], "g": {"t": "Present Perfect vs Past Simple", "fa": "Present Perfect = تجربه یا نتیجه بدون زمان مشخص (تا الان). Past Simple = زمان مشخص گذشته (yesterday, in 2020, last year). قانون طلایی: اگر زمان مشخص گفتی، Past Simple.", "ex": ["I've worked with many schools. / I worked with that school in 2021.", "Have you ever been to London? — Yes, I went there in 2019.", "We've launched three products so far.", "I haven't finished yet."], "drill": "۵ تجربه‌ات را با I've … بگو و برای هر کدام با Past Simple جزئیات (کِی، کجا، چطور) اضافه کن. مثال: I've given a presentation in English. I gave it in 2022, in Dubai."}, "li": {"t": "Chris Hadfield — What I learned from going blind in space", "u": "https://www.ted.com/talks/chris_hadfield_what_i_learned_from_going_blind_in_space", "task": "ترکیبی از تجربه و روایت. به جاهایی که Present Perfect استفاده می‌کند دقت کن. ۶۰ ثانیه را Shadow کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "th: /θ/ و /ð/", "fa": "فارسی‌زبان‌ها th را «ت/د» یا «س/ز» می‌گویند. نوک زبان را کمی بین دندان‌ها بگذار و هوا را رد کن. /θ/ بی‌صدا (think)، /ð/ باصدا (this).", "items": ["think", "three", "thanks", "month", "the", "this", "other", "although", "with", "together"]}, "fl": "Have you ever…? rapid fire: در ۲ دقیقه ۱۰ سؤال Have you ever… از خودت بپرس و فوراً جواب بده (با یک جملهٔ Past Simple برای جزئیات).", "rp": {"scene": "This is an informal first conversation with a potential business partner. Ask me about my career, my biggest achievements and challenges, and what I've learned so far. Occasionally ask 'When was that?' to force me to switch between present perfect and past simple.", "role": "a potential business partner"}, "qs": ["What's the biggest achievement in your career so far?", "Have you ever had to learn something really fast?", "What's the hardest challenge you've faced at work?", "What skills have you picked up in the last few years?"], "ch": "۲ دقیقه دربارهٔ «مسیر شغلی‌ام تا امروز» ضبط کن. معیار قبولی: حداقل ۵ جمله با Present Perfect و ۵ جمله با Past Simple، بدون اشتباه در جایی که زمان مشخص گفته‌ای.", "work": "سه دستاورد کاری‌ات را طوری آماده کن که اگر کسی پرسید، بدون فکر بگویی.", "must": ["One thing I'm proud of is ...", "It was a steep learning curve.", "manage to", "take on", "so far"]});
S({"n": 8, "ph": 1, "t": "برنامه‌ها و قرارها", "en": "Plans, arrangements and schedules", "goal": "برای آینده، برنامه‌ها، پیش‌بینی‌ها و تصمیم‌های لحظه‌ای را با ساختار درست بیان کنی.", "v": [["clash (with)", "تداخل داشتن (زمانی)", "The meeting clashes with my dentist appointment."], ["arrange", "هماهنگ کردن", "I've arranged a meeting with the client."], ["available", "در دسترس، آزاد", "Are you available on Tuesday?"], ["reschedule", "زمان را تغییر دادن", "Can we reschedule to Thursday?"], ["deadline", "مهلت", "The deadline is next Friday."], ["appointment", "قرار (رسمی، پزشک…)", "I have a dentist appointment at 4."], ["tentatively", "به‌طور موقت و غیرقطعی", "Let's tentatively say Tuesday at 10."], ["goal", "هدف", "My goal this year is to improve my English."]], "pv": [["come up with", "ایده/راه‌حل پیدا کردن", "We need to come up with a plan."], ["put off", "به تعویق انداختن", "Let's not put it off again."], ["look forward to", "مشتاق بودن برای", "I'm looking forward to the trip."], ["move forward", "پیش رفتن", "Let's move forward with option A."]], "ex": [["What are you up to this weekend?", "آخر هفته چه برنامه‌ای داری؟", "What are you up to this weekend?"], ["I'm thinking of ...", "دارم به … فکر می‌کنم", "I'm thinking of taking a few days off."], ["Does ... work for you?", "… برایت مناسب است؟", "Does Tuesday at 10 work for you?"], ["I'll get back to you.", "خبرت می‌کنم", "Let me check and I'll get back to you."], ["If all goes well, ...", "اگر همه چیز خوب پیش برود", "If all goes well, we'll launch in May."], ["I'm afraid I can't make it.", "متأسفانه نمی‌توانم بیایم", "I'm afraid I can't make it on Monday."]], "g": {"t": "Future forms: will / going to / Present Continuous", "fa": "going to = تصمیمی که قبلاً گرفته‌ای. Present Continuous = قرار هماهنگ‌شده (با زمان و نفر). will = تصمیم همان لحظه، پیشنهاد، پیش‌بینی.", "ex": ["I'm going to learn Spanish next year. (قصد)", "I'm meeting the client at 3. (قرار قطعی)", "— The printer's broken. — I'll call IT. (تصمیم لحظه‌ای)", "I think it'll rain tomorrow. (پیش‌بینی)"], "drill": "۳ قصد (going to)، ۳ قرار (Present Continuous) و ۳ تصمیم لحظه‌ای (I'll…) برای هفتهٔ آینده‌ات بگو."}, "li": {"t": "Derek Sivers — Keep your goals to yourself (3 min)", "u": "https://www.ted.com/talks/derek_sivers_keep_your_goals_to_yourself", "task": "کوتاه و سریع؛ چالش خوبی برای Shadowing. کل تاک را ۲ بار گوش کن، ۴۵ ثانیه را Shadow کن.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Contractions — شکل مخفف", "fa": "در گفتار طبیعی تقریباً همیشه مخفف می‌گویند. گفتن I will به جای I'll رسمی و کُند به نظر می‌رسد.", "items": ["I'll", "we're", "it's", "they've", "won't", "shouldn't", "I'd", "that's", "there's", "let's"]}, "fl": "Calendar talk: تقویم هفتهٔ آینده‌ات را (واقعی یا فرضی) باز کن و ۲ دقیقه بدون توقف توضیحش بده: روز به روز.", "rp": {"scene": "You are a colleague trying to schedule a 1-hour meeting with me next week. You are busy on most of the days I suggest, so we have to negotiate a time. Then ask about my plans for the weekend and my goals for this year.", "role": "a busy colleague trying to find a meeting time"}, "qs": ["What are you doing this weekend?", "What are your plans for the next few months?", "What are you going to do differently this year?", "Where do you think you'll be in five years?"], "ch": "یک پیام صوتی ۶۰ ثانیه‌ای برای همکار فرضی ضبط کن که جلسه را از سه‌شنبه به پنجشنبه منتقل می‌کنی، دلیل می‌آوری و زمان جدید پیشنهاد می‌دهی. معیار قبولی: هر سه شکل آینده حداقل یک بار، و یک عبارت مؤدبانهٔ رد (I'm afraid…).", "work": "برنامهٔ فردایت را امشب بلند به انگلیسی بگو.", "must": ["Does ... work for you?", "I'll get back to you.", "I'm afraid I can't make it.", "reschedule", "put off"]});
S({"n": 9, "ph": 1, "t": "تماس تلفنی — پایه", "en": "Phone calls: the basics", "goal": "تماس بگیری، خودت را معرفی کنی، دلیل تماس را بگویی، پیغام بگذاری و وقتی نمی‌فهمی درخواست تکرار کنی.", "v": [["voicemail", "پیغام‌گیر صوتی، پیغام صوتی", "I left you a voicemail this morning."], ["message", "پیغام", "Can I leave a message?"], ["line", "خط تلفن", "The line is really bad."], ["extension", "داخلی", "My extension is 204."], ["regarding", "دربارهٔ (رسمی)", "I'm calling regarding your email."], ["spell", "هجی کردن", "Could you spell that, please?"], ["reach (someone)", "تماس گرفتن با کسی، در دسترس بودن", "What's the best number to reach you on?"], ["urgent", "فوری", "It's quite urgent."]], "pv": [["hold on", "صبر کن (پشت خط)", "Hold on a second, please."], ["put through", "وصل کردن (به کسی)", "Could you put me through to the manager?"], ["hang up", "قطع کردن تلفن", "Don't hang up!"], ["speak up", "بلندتر حرف زدن", "Could you speak up a bit?"]], "ex": [["Hi, this is ... from ...", "سلام، … هستم از …", "Hi, this is Majid from Parsamooz."], ["I'm calling about ...", "تماس می‌گیرم دربارهٔ …", "I'm calling about our meeting next week."], ["Is this a good time to talk?", "الان وقت داری صحبت کنیم؟", "Hi Sarah, is this a good time to talk?"], ["Sorry, you're breaking up.", "صدات قطع و وصل می‌شه", "Sorry, you're breaking up. Can you repeat that?"], ["Let me just repeat that to make sure ...", "تکرار برای اطمینان", "Let me just repeat that to make sure I got it."], ["Thanks for calling. Talk to you soon.", "پایان تماس", "Thanks for calling. Talk to you soon. Bye!"]], "g": {"t": "Polite requests: Could you / Would you mind + -ing", "fa": "در تلفن که چهره نیست، مؤدب بودن فقط با زبان منتقل می‌شود. Could you + فعل ساده؛ Would you mind + ing (جواب مثبتش No, not at all است!).", "ex": ["Could you repeat that, please?", "Could you spell your last name?", "Would you mind speaking a bit more slowly?", "Would you mind sending me an email about it?"], "drill": "۸ درخواست تلفنی بساز: ۴ تا با Could you… و ۴ تا با Would you mind…ing. بعد به هر کدام یک جواب طبیعی بده."}, "li": {"t": "BBC — English at Work 15: Talking on the phone (5 min)", "u": "https://www.youtube.com/watch?v=yzPX6zmaBdg", "seg": "کل ویدیو (۵ دقیقه)", "dialog": true, "task": "عبارات تلفنی را یادداشت کن و نقش کسی که تماس می‌گیرد را Shadow کن."}, "pr": {"t": "Numbers, spelling & chunking", "fa": "اعداد تلفن را دسته‌دسته (chunk) بگو و بین دسته‌ها مکث کن. -teen تکیه روی آخر (thirTEEN)، -ty تکیه روی اول (THIRty). حروف مشکل‌دار: E/I، G/J، A/R.", "items": ["thirTEEN vs THIRty", "fifTEEN vs FIFty", "0912 — 345 — 6789", "double seven", "E, I, G, J, A, R, Y", "@ = at, . = dot"]}, "fl": "Voicemail drill: ۳ پیغام صوتی ۳۰ ثانیه‌ای برای ۳ موقعیت مختلف (عقب انداختن جلسه، پیگیری فاکتور، تشکر) ضبط کن، بدون نوشتن قبلی.", "rp": {"scene": "This is a phone call. You are the receptionist at a software company. I call to speak to your manager about a partnership. The manager is not available, so I must leave a message with my name (spell it), number and reason for calling. Occasionally pretend the line is bad so I must ask you to repeat. Then play the manager calling me back.", "role": "a receptionist, then the manager calling back"}, "qs": ["Who would you like to speak to?", "Can I ask what it's regarding?", "Could you spell your name for me?", "What's the best number to reach you on?"], "ch": "یک تماس ۲ دقیقه‌ای با ChatGPT: تو زنگ می‌زنی، خودت را معرفی می‌کنی، هدف را می‌گویی، یک اطلاعات (ایمیل یا شماره) را هجی می‌کنی و تماس را مؤدبانه تمام می‌کنی. معیار قبولی: حداقل یک بار درخواست تکرار/وضوح و هجی بی‌غلط.", "work": "اسم، ایمیل و شماره‌ات را آن‌قدر به انگلیسی تمرین کن که بدون فکر هجی کنی.", "must": ["Hi, this is ... from ...", "I'm calling about ...", "Sorry, you're breaking up.", "hold on", "reach (someone)"]});
S({"n": 10, "ph": 1, "review": true, "t": "مرور و ارزیابی فاز ۱", "en": "Review & Checkpoint 1"});
S({"n": 11, "ph": 2, "t": "گزارش وضعیت (Stand-up)", "en": "Giving a status update (stand-up meeting)", "goal": "در ۶۰–۹۰ ثانیه وضعیت کارت را شفاف بگویی: چه کردم، چه می‌کنم، کجا گیر کرده‌ام.", "v": [["progress", "پیشرفت", "We've made good progress this week."], ["on track", "طبق برنامه", "The project is on track."], ["behind schedule", "عقب‌تر از برنامه", "We're a bit behind schedule."], ["blocker", "مانع، گیر کار", "My main blocker is the API access."], ["update", "به‌روزرسانی، گزارش", "Here's a quick update."], ["milestone", "نقطهٔ عطف، مرحلهٔ کلیدی", "We hit our first milestone."], ["pending", "در انتظار", "The review is still pending."], ["almost done", "تقریباً تمام", "I'm almost done with the report."]], "pv": [["wrap up", "جمع کردن، تمام کردن", "I'll wrap up the testing today."], ["hold up", "معطل کردن", "The design is holding us up."], ["follow up", "پیگیری کردن", "I'll follow up with the client."], ["sort out", "حل و فصل کردن", "We need to sort out the server issue."]], "ex": [["Yesterday I ..., today I'm going to ...", "قالب استاندارد Stand-up", "Yesterday I fixed the login bug; today I'm going to test the app."], ["I'm still working on ...", "هنوز دارم روی … کار می‌کنم", "I'm still working on the payment page."], ["I'm waiting on ... for ...", "منتظر … برای … هستم", "I'm waiting on Ali for the design files."], ["No blockers on my side.", "از طرف من مانعی نیست", "That's it for me — no blockers on my side."], ["It's taking longer than expected.", "بیشتر از انتظار طول کشیده", "The migration is taking longer than expected."], ["I should have it done by ...", "تا … تمامش می‌کنم", "I should have it done by Thursday."]], "g": {"t": "Present Perfect for results + already / yet / just", "fa": "در گزارش وضعیت، نتیجه مهم است نه زمان: I've finished… already در جمله مثبت، yet در منفی و سؤالی (آخر جمله)، just یعنی همین الان.", "ex": ["I've already finished the design.", "I haven't tested it yet.", "Have you sent the invoice yet?", "We've just deployed the new version."], "drill": "یک لیست ۸ کاره از پروژهٔ واقعی‌ات تصور کن و برای هر کدام با already / yet / just بگو وضعیتش چیست."}, "li": {"t": "BBC — English at Work 31: Project management (5 min)", "u": "https://www.youtube.com/watch?v=efc3fFMCvvc", "seg": "کل ویدیو (۵ دقیقه)", "dialog": true, "task": "زبان مدیریت پروژه و گزارش وضعیت در یک دیالوگ. عبارات گزارش پیشرفت را یادداشت کن."}, "pr": {"t": "Linking: consonant → vowel", "fa": "وقتی کلمه‌ای با صامت تمام و بعدی با مصوت شروع می‌شود، به هم می‌چسبند: check it out ← «چِکیدات». این مهم‌ترین قانون روان‌گویی است.", "items": ["check it out", "work on it", "set up an account", "follow up on it", "wrap it up", "sort it out", "hold on a minute", "an update"]}, "fl": "Stand-up x3: گزارش Stand-up کار واقعی‌ات را ۳ بار بگو: ۹۰، ۶۰ و ۳۰ ثانیه. نسخهٔ ۳۰ ثانیه‌ای فقط مهم‌ترین‌ها را دارد.", "rp": {"scene": "It's our daily stand-up meeting. You are the team lead. Ask me for my update (yesterday, today, blockers). Ask follow-up questions about anything vague: 'When exactly will it be done?', 'What do you need from me?'. Then give me a short update of your own that includes a problem, and ask for my opinion.", "role": "my team lead running a daily stand-up"}, "qs": ["What did you get done yesterday?", "What's on your plate today?", "Is anything blocking you?", "Are we still on track for the deadline?"], "ch": "یک Stand-up ۶۰ ثانیه‌ای از پروژهٔ واقعی‌ات ضبط کن. معیار قبولی: ساختار دیروز/امروز/مانع، حداقل ۲ مورد از already/yet/just، یک phrasal verb امروز، و بدون جملهٔ «ترجمه‌ای».", "work": "فردا اول وقت یک Stand-up واقعی برای خودت (یا تیمت!) به انگلیسی بگو.", "must": ["I'm still working on ...", "No blockers on my side.", "It's taking longer than expected.", "on track", "wrap up"]});
S({"n": 12, "ph": 2, "t": "درخواست کمک و انجام کار", "en": "Making requests and asking for help", "goal": "مؤدبانه اما واضح از کسی کاری بخواهی، دلیل بیاوری و زمان مشخص کنی.", "v": [["favor", "لطف، کمک", "Could I ask you a favor?"], ["request", "درخواست", "I have a small request."], ["time-sensitive", "زمان‌حساس، فوری", "It's a bit time-sensitive, so today would be great."], ["whenever", "هر وقت که", "Whenever you have time."], ["approve", "تأیید کردن", "Could you approve my request?"], ["access", "دسترسی", "I need access to the server."], ["review", "بررسی کردن", "Could you review my code?"], ["appreciate", "قدردانی کردن", "I'd really appreciate it."]], "pv": [["help out", "کمک کردن", "Could you help me out with this?"], ["fill in (for)", "جای کسی کار کردن", "Can you fill in for me on Monday?"], ["look into", "بررسی کردن", "Could you look into this issue?"], ["send over", "فرستادن (برای کسی)", "I'll send over the files now."]], "ex": [["Do you have a minute?", "یک دقیقه وقت داری؟", "Hey, do you have a minute?"], ["I was wondering if you could ...", "می‌خواستم ببینم می‌توانی … (خیلی مؤدبانه)", "I was wondering if you could check this for me."], ["Would it be possible to ...?", "امکانش هست …؟", "Would it be possible to get it by Friday?"], ["No rush.", "عجله‌ای نیست", "No rush — next week is fine."], ["I owe you one.", "یکی طلبت", "Thanks so much — I owe you one!"], ["Sure, no problem. / I'd love to, but ...", "قبول / رد مؤدبانه", "I'd love to, but I'm swamped today."]], "g": {"t": "Articles: a / an / the / no article", "fa": "فارسی حرف تعریف ندارد؛ برای همین فارسی‌زبان‌ها یا آن را حذف می‌کنند یا همه‌جا the می‌گذارند. قاعدهٔ عملی: a/an = یک چیز شمردنیِ نامشخص یا اولین بار؛ the = چیزی که هر دو طرف می‌دانند کدام است؛ بدون حرف تعریف = جمع یا غیرشمردنی به معنای کلی.", "ex": ["Could you send me a file? (هر فایلی) / Could you send me the file? (همان که می‌دانیم)", "I need a favor. — Sure, what's the favor?", "I work with schools. (کلی) / The schools in Shiraz use our app. (مشخص)", "Could you give me some advice? (غیرشمردنی، بدون a)"], "drill": "۱۰ درخواست کاری بساز و قبل از هر اسم یک لحظه فکر کن: a، the یا هیچ؟ (Could you check the report I sent yesterday? / I need access to the server. / Can I ask you a question?) بعد یک دقیقه دفتر کارت را توصیف کن و فقط روی حروف تعریف دقت کن."}, "li": {"t": "BBC — English at Work 21: Asking for help (6 min)", "u": "https://www.youtube.com/watch?v=AG2kYShBZl0", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "ببین چطور مؤدبانه کمک می‌خواهند و چطور جواب می‌دهند. یکی از درخواست‌ها را ۵ بار Shadow کن."}, "pr": {"t": "Polite intonation (fall–rise)", "fa": "لحن یکنواخت یا پایین‌رونده در درخواست، دستوری به نظر می‌رسد. در درخواست مؤدبانه، صدا را در انتها کمی پایین و بعد کمی بالا ببر.", "items": ["Could you HELP me? ↘↗", "Do you have a MINute? ↗", "I was wondering if you could CHECK this. ↘↗", "Thanks so MUCH! ↘"]}, "fl": "Request roulette: ۱۰ درخواست کاری مختلف (از کوچک تا بزرگ) در ۲ دقیقه بگو، هر کدام با یک ساختار متفاوت.", "rp": {"scene": "You are a busy colleague from another team. I need three things from you: server access, a code review and someone to cover my shift on Sunday. You are busy, so you agree to one, negotiate the time for another and politely refuse the third. Make me be polite but persistent.", "role": "a busy colleague from another team"}, "qs": ["What do you need help with at work these days?", "How do you usually ask your manager for something?", "When was the last time someone helped you out?", "How do you say no to a request?"], "ch": "۳ درخواست متفاوت ضبط کن (۱ از همکار، ۱ از مدیر، ۱ از مشتری) هر کدام ۲۰–۳۰ ثانیه. معیار قبولی: سطح ادب متناسب با مخاطب، دلیل درخواست و زمان مشخص در هر سه، و حداقل ۵ اسم با a/the درست.", "work": "امروز حداقل یک درخواست کاری واقعی را اول در ذهنت به انگلیسی بساز.", "must": ["I was wondering if you could ...", "Would it be possible to ...?", "No rush.", "look into", "time-sensitive"]});
S({"n": 13, "ph": 2, "t": "توضیح یک مشکل (غیرفنی)", "en": "Explaining a problem clearly", "goal": "یک مشکل را با ساختار «چه شده، از کِی، چه تأثیری دارد، چه پیشنهادی دارم» توضیح بدهی.", "v": [["issue", "مشکل، موضوع", "We have an issue with the payment system."], ["affect", "تأثیر گذاشتن بر", "It affects about 20 users."], ["cause", "علت؛ باعث شدن", "We don't know the cause yet."], ["solution", "راه‌حل", "I think I have a solution."], ["temporary", "موقت", "This is only a temporary fix."], ["frustrating", "اعصاب‌خردکن", "It's really frustrating for the users."], ["impact", "تأثیر، پیامد", "What's the impact on the business?"], ["workaround", "راه‌حل موقت، دور زدن", "There's a workaround for now."]], "pv": [["break down", "خراب شدن؛ تجزیه کردن", "The system broke down last night."], ["run out of", "تمام کردن (موجودی)", "We've run out of storage."], ["come across", "برخوردن به (اتفاقی)", "I came across a strange problem."], ["get around", "دور زدن (مشکل)", "We can get around it for now."]], "ex": [["The thing is, ...", "مسئله اینه که …", "The thing is, the report isn't ready."], ["It looks like ...", "به نظر می‌رسد …", "It looks like the email didn't go out."], ["Since yesterday, ...", "از دیروز تا الان …", "Since yesterday, some users can't log in."], ["The main problem is that ...", "مشکل اصلی این است که …", "The main problem is that we don't have access."], ["What I'd suggest is ...", "پیشنهاد من این است که …", "What I'd suggest is to delay the launch."], ["It's not the end of the world, but ...", "فاجعه نیست، اما …", "It's not the end of the world, but we need to fix it."]], "g": {"t": "Present Perfect with since / for + Present Perfect Continuous", "fa": "برای «از کِی» مشکل وجود دارد: since + نقطهٔ زمانی (since Monday)، for + مدت (for two days). برای کاری که هنوز ادامه دارد: have been + ing.", "ex": ["The site has been down since 9 a.m.", "We've had this problem for two weeks.", "I've been trying to fix it all morning.", "How long has it been like this?"], "drill": "۶ مشکل (خانه، کار، ماشین، اینترنت…) را توصیف کن و برای هر کدام بگو از کِی و چه مدت: since / for / have been + ing."}, "li": {"t": "Yves Morieux — As work gets more complex, 6 rules to simplify", "u": "https://www.ted.com/talks/yves_morieux_as_work_gets_more_complex_6_rules_to_simplify", "task": "لهجهٔ فرانسوی دارد — تمرین خوبی برای فهمیدن لهجه‌های غیربومی که در محیط کار زیاد می‌شنوی. ۶ قانون را خلاصه کن و بلند بگو.", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Final consonants — صامت آخر را نخور", "fa": "صامت‌های پایانی مخصوصاً در -ed و -s و خوشه‌ها (kst, sts, nths) نباید حذف شوند؛ در غیر این صورت زمان و جمع گم می‌شوند.", "items": ["fixed /fɪkst/", "asked /æskt/", "tests", "months", "tasks", "costs", "helped", "issues"]}, "fl": "Problem in 4 lines: ۵ مشکل مختلف را هر کدام در ۴ جمله بگو: What / Since when / Impact / Suggestion. هر کدام حداکثر ۳۰ ثانیه.", "rp": {"scene": "You are my manager. I come to you to explain a problem: our biggest client says the reports they downloaded are wrong. Ask me what exactly happened, since when, how many people are affected, what the impact is and what I suggest. Be a bit impatient and ask for the bottom line if I talk too long.", "role": "my slightly impatient manager"}, "qs": ["What exactly is the problem?", "When did you first notice it?", "Who is affected?", "What do you suggest we do?", "Is there a workaround for now?"], "ch": "یک مشکل واقعی از کار یا زندگی‌ات را در ۹۰ ثانیه ضبط کن با ساختار ۴ مرحله‌ای. معیار قبولی: هر ۴ بخش وجود دارد، since/for درست، و یک پیشنهاد مشخص.", "work": "اولین مشکلی که امروز پیش آمد را در ذهنت با The thing is… توضیح بده.", "must": ["The thing is, ...", "It looks like ...", "What I'd suggest is ...", "workaround", "come across"]});
S({"n": 14, "ph": 2, "t": "شرکت فعال در جلسه", "en": "Participating in meetings", "goal": "در جلسه نوبت بگیری، نظر بدهی، مؤدبانه وسط حرف بپری و به بحث برگردانی.", "v": [["agenda", "دستور جلسه", "What's on the agenda today?"], ["sidetracked", "از موضوع پرت شدن", "Sorry, we got sidetracked — back to the budget."], ["input", "نظر، مشارکت", "We need your input on this."], ["decision", "تصمیم", "We need to make a decision today."], ["action item", "کار قابل‌پیگیری", "Let's go through the action items."], ["briefly", "به‌طور خلاصه", "I'll be brief."], ["relevant", "مرتبط", "That's not really relevant here."], ["consensus", "اجماع", "Do we have a consensus?"]], "pv": [["go over", "مرور کردن", "Let's go over the numbers."], ["move on", "رفتن به موضوع بعدی", "Can we move on to the next point?"], ["get back to", "برگشتن به (موضوع)", "Let's get back to the budget."], ["jump in", "وارد بحث شدن", "Can I jump in here?"]], "ex": [["Sorry to interrupt, but ...", "ببخشید که می‌پرم وسط …", "Sorry to interrupt, but I have a quick question."], ["If I could just add something ...", "اگر اجازه بدهید چیزی اضافه کنم", "If I could just add something here…"], ["Can I just finish my point?", "اجازه بدهید حرفم تمام شود", "Sorry — can I just finish my point?"], ["Going back to what ... said, ...", "برگردیم به حرف …", "Going back to what Sara said…"], ["Just to build on that, ...", "در ادامهٔ همین حرف …", "Just to build on that, we could also…"], ["I think we're getting off track.", "داریم از موضوع دور می‌شویم", "I think we're getting off track."]], "g": {"t": "Gerunds vs infinitives after common verbs", "fa": "بعضی فعل‌ها + ing (suggest, recommend, avoid, consider, finish, mind) و بعضی + to (want, need, plan, decide, agree, hope). این‌ها در جلسه مدام استفاده می‌شوند.", "ex": ["I suggest moving the deadline.", "We decided to postpone it.", "Let's avoid adding new features.", "We need to agree on a date."], "drill": "با هر کدام از این ۱۲ فعل یک جملهٔ جلسه‌ای بساز: suggest, recommend, avoid, consider, finish, mind, want, need, plan, decide, agree, hope."}, "li": {"t": "BBC — Office English, episode 2: Meetings (10 min)", "u": "https://www.youtube.com/watch?v=m2UD0-IC7iY", "seg": "۵ دقیقهٔ اول (بقیه اختیاری)", "dialog": true, "task": "جلسه با چند نفر: وسط حرف پریدن، نوبت گرفتن، نظر دادن. هر عبارت جلسه‌ای را که شنیدی یادداشت کن."}, "pr": {"t": "Sentence stress — کلمات محتوایی", "fa": "در انگلیسی فقط کلمات مهم (اسم، فعل اصلی، صفت، قید، منفی) تکیه می‌گیرند و بقیه سریع و ضعیف گفته می‌شوند. این همان «ریتم» انگلیسی است.", "items": ["I THINK we should MOVE ON.", "Can I JUMP in HERE?", "We NEED to DECIDE toDAY.", "That's a GOOD POINT."]}, "fl": "Meeting interjections: یک پادکست یا ویدیو را پخش کن و هر ۳۰ ثانیه متوقفش کن و با یکی از عبارات امروز «وارد بحث شو» (۱۰ بار).", "rp": {"scene": "We are in a team meeting with 3 other (imaginary) people — you play all of them plus the chair. The topic: should we launch the new feature next week or delay it by a month? The other people talk a lot, so I have to interrupt politely, give my opinion, build on others' points and bring the discussion back on track. At the end, ask me to summarize the decision.", "role": "a meeting chair and three colleagues"}, "qs": ["What do you think we should do?", "Do you agree with Sara's point?", "What are the risks if we delay?", "Can you summarize what we've decided?"], "ch": "۲ دقیقه در نقش خودت در یک جلسهٔ فرضی صحبت کن و ضبط کن: وسط حرف پریدن، نظر دادن، اضافه کردن به حرف دیگری و برگرداندن بحث. معیار قبولی: حداقل ۵ عبارت جلسه‌ای و ۳ فعل با gerund/infinitive درست.", "work": "در جلسهٔ بعدی‌ات (حتی فارسی) لحظه‌هایی را پیدا کن که یکی از عبارات امروز جایش بود.", "must": ["Sorry to interrupt, but ...", "Just to build on that, ...", "I think we're getting off track.", "move on", "jump in"]});
S({"n": 15, "ph": 2, "t": "روشن‌سازی و درخواست توضیح", "en": "Clarifying and checking understanding", "goal": "وقتی چیزی را نفهمیدی، بدون خجالت درخواست توضیح کنی و مطمئن شوی درست فهمیده‌ای.", "v": [["clarify", "روشن کردن", "Could you clarify that?"], ["confused", "گیج", "I'm a bit confused."], ["misunderstanding", "سوءتفاهم", "I think there's a misunderstanding."], ["assume", "فرض کردن", "I assumed you meant Monday."], ["specific", "مشخص", "Can you be more specific?"], ["exactly", "دقیقاً", "What exactly do you need?"], ["rephrase", "به بیان دیگر گفتن", "Let me rephrase that."], ["on the same page", "هم‌نظر، هماهنگ", "Just to make sure we're on the same page…"]], "pv": [["spell out", "صریح و جزء به جزء گفتن", "Could you spell out what you need?"], ["mix up", "قاطی کردن", "I mixed up the two dates."], ["go through", "یکی‌یکی بررسی کردن", "Can we go through it again?"], ["make out", "به‌زحمت تشخیص دادن/شنیدن", "Sorry, I couldn't make out the last part."]], "ex": [["Sorry, I didn't quite catch that.", "ببخشید، درست نشنیدم", "Sorry, I didn't quite catch that. Could you say it again?"], ["What do you mean by ...?", "منظورت از … چیست؟", "What do you mean by 'soon'?"], ["So, if I understand correctly, ...", "اگر درست فهمیده باشم …", "So, if I understand correctly, you want two reports."], ["Just to be clear, ...", "برای اینکه شفاف باشد …", "Just to be clear, the deadline is Friday, not Monday."], ["Does that make sense?", "منطقی بود؟ متوجه شدی؟", "Does that make sense?"], ["Let me put it another way.", "بگذار جور دیگری بگویم", "Let me put it another way."]], "g": {"t": "Indirect questions", "fa": "سؤال غیرمستقیم مؤدب‌تر است و ترتیبش مثل جملهٔ خبری است (فاعل قبل از فعل): Do you know where the file IS? — نه where IS the file.", "ex": ["Could you tell me when the meeting starts?", "Do you know if he's coming?", "I'm not sure what you mean.", "Can you explain how this works?"], "drill": "این ۸ سؤال را غیرمستقیم کن و بلند بگو: Where is the report? / When does it start? / Who is responsible? / Why did it fail? / How much does it cost? / Is he available? / What does she need? / Did they approve it?"}, "li": {"t": "BBC — English at Work 47: Clearing up confusion (6 min)", "u": "https://www.youtube.com/watch?v=xnKr27RvXp8", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "یک سوءتفاهم کاری و روشن کردنش. عبارات «روشن‌سازی» را یادداشت و Shadow کن."}, "pr": {"t": "Weak forms — to, for, of, can, and, at", "fa": "کلمات دستوری در جمله تقریباً همیشه ضعیف تلفظ می‌شوند: to → tə، for → fə، can → kən، and → ən. شنیدنشان هم بدون این تمرین سخت است.", "items": ["I need tə go", "It's fə you", "a cup əv tea", "I kən do it", "you ən me", "at the office → ət thə", "What do you → Whaddaya"]}, "fl": "Confirm & paraphrase: ۵ جملهٔ پیچیده از تاک امروز انتخاب کن؛ برای هر کدام بگو So, if I understand correctly… و با کلمات خودت بازگو کن.", "rp": {"scene": "You are a client giving me instructions for a project, but you speak vaguely, use some jargon and give some contradictory details (e.g. two different dates). I must ask clarifying questions, check my understanding and summarize the requirements correctly. Don't make it easy — only clarify when I ask properly.", "role": "a vague and slightly disorganized client"}, "qs": ["So, is everything clear?", "Do you have any questions?", "Can you tell me what you're going to deliver?", "When can I expect the first version?"], "ch": "به یک ویدیوی ۲ دقیقه‌ای (همان تاک امروز) گوش کن و بعد ۶۰ ثانیه خلاصه‌اش را با So, basically… ضبط کن و ۳ سؤال غیرمستقیم دربارهٔ آن بپرس. معیار قبولی: ترتیب کلمات سؤال‌های غیرمستقیم درست باشد.", "work": "امروز حداقل یک بار در یک مکالمهٔ واقعی خلاصهٔ حرف طرف را برایش تکرار کن (حتی به فارسی) — عادت Clarifying را بساز.", "must": ["Sorry, I didn't quite catch that.", "So, if I understand correctly, ...", "Just to be clear, ...", "on the same page", "mix up"]});
S({"n": 16, "ph": 2, "t": "مهلت‌ها، تأخیر و عذرخواهی", "en": "Deadlines, delays and apologizing", "goal": "خبر بد (تأخیر) را حرفه‌ای بدهی: عذرخواهی، دلیل، مسئولیت‌پذیری و برنامهٔ جدید.", "v": [["delay", "تأخیر", "Sorry for the delay."], ["postpone", "عقب انداختن", "We have to postpone the launch."], ["an extension (on a deadline)", "تمدید مهلت — با extension داخلی تلفن (جلسهٔ ۹) فرق دارد", "Could we get a three-day extension on the deadline?"], ["realistic", "واقع‌بینانه", "That deadline isn't realistic."], ["unexpected", "غیرمنتظره", "We had some unexpected problems."], ["responsibility", "مسئولیت", "I take full responsibility."], ["tight", "فشرده، تنگ", "The deadline is very tight."], ["revised", "اصلاح‌شده", "Here's the revised timeline."]], "pv": [["fall behind", "عقب افتادن", "We've fallen behind by a week."], ["squeeze in", "جا دادن (در برنامه)", "I can squeeze in a quick call at four."], ["make up for", "جبران کردن", "We'll work on Saturday to make up for it."], ["let (someone) down", "ناامید کردن کسی", "I'm sorry I let you down."]], "ex": [["I'm afraid we're running late on ...", "متأسفانه در … عقب هستیم", "I'm afraid we're running late on the report."], ["I'm really sorry about this.", "واقعاً بابت این متأسفم", "I'm really sorry about this — it's my fault."], ["That's on me.", "تقصیر من است", "The mistake in the numbers? That's on me."], ["To be honest, we underestimated ...", "راستش … را دست‌کم گرفتیم", "To be honest, we underestimated the testing."], ["What I can do is ...", "کاری که از دستم برمی‌آید …", "What I can do is send you part of it today."], ["It won't happen again.", "دیگر تکرار نمی‌شود", "I've fixed the process. It won't happen again."]], "g": {"t": "Modals for obligation & possibility: have to / must / might / should", "fa": "have to = اجبار از بیرون؛ must = اجبار از نظر گوینده یا قانون؛ might/may = احتمال؛ should = انتظار منطقی/توصیه. در خبر دادن تأخیر همه را لازم داری.", "ex": ["We have to redo the testing.", "It might take two more days.", "It should be ready by Monday.", "We mustn't miss this deadline again."], "drill": "۸ جمله دربارهٔ یک پروژهٔ عقب‌افتاده بساز با have to (۲)، might (۲)، should (۲)، mustn't (۲)."}, "li": {"t": "BBC — English at Work 27: Delivering bad news (6 min)", "u": "https://www.youtube.com/watch?v=L3QbkK0bB44", "seg": "کل ویدیو (۶ دقیقه)", "dialog": true, "task": "دقیقاً موضوع امروز: دادن خبر بد. به لحن آرام و جمله‌های نرم‌کننده دقت کن."}, "pr": {"t": "/æ/ vs /ʌ/ vs /ɑː/", "fa": "فارسی یک «اَ» دارد و انگلیسی سه صدای نزدیک. /æ/ دهان باز و پهن (cat)، /ʌ/ کوتاه و شل (cut)، /ɑː/ باز و بلند (cart).", "items": ["cat / cut / cart", "bad / bud", "back / buck", "sorry", "budget", "run / ran", "plan", "lunch"]}, "fl": "Bad news ladder: یک خبر بد را برای ۳ مخاطب بگو: همکار صمیمی، مدیر، مشتری. هر کدام ۴۵ ثانیه. لحن و کلمات باید تغییر کنند.", "rp": {"scene": "You are an important client. I have to call you and tell you that the project we promised for next Monday will be two weeks late. You are disappointed and a bit angry. Push me to explain why, take responsibility and offer something concrete. Accept the new plan only if I'm clear, honest and professional.", "role": "a disappointed, slightly angry client"}, "qs": ["Why am I only hearing about this now?", "What exactly went wrong?", "How can I be sure the new date is realistic?", "What are you going to do to make up for it?"], "ch": "یک پیام صوتی ۹۰ ثانیه‌ای ضبط کن که تأخیر یک هفته‌ای را به مدیرت خبر می‌دهی. معیار قبولی: عذرخواهی + دلیل + مسئولیت + برنامهٔ جدید + یک پیشنهاد جبرانی؛ حداقل ۳ مودال مختلف.", "work": "یک تأخیر واقعی (یا احتمالی) در کارت را انتخاب کن و متن خبر دادنش را به انگلیسی در ذهنت آماده کن.", "must": ["I'm afraid we're running late on ...", "That's on me.", "To be honest, we underestimated ...", "fall behind", "make up for"]});
S({"n": 17, "ph": 2, "t": "سپردن کار و پیگیری", "en": "Delegating tasks and following up", "goal": "کاری را واضح به کسی بسپاری (چه، چرا، تا کِی) و بعداً بدون حالت طلبکارانه پیگیری کنی.", "v": [["delegate", "واگذار کردن", "I need to delegate more."], ["assign", "محول کردن", "I've assigned the task to Reza."], ["ownership", "مالکیت، مسئولیت کامل", "Can you take ownership of this?"], ["expectation", "انتظار", "Let me be clear about expectations."], ["reminder", "یادآوری", "Just a quick reminder about the report."], ["status", "وضعیت", "What's the status of the task?"], ["due", "سررسید", "It's due next Monday."], ["heads-up", "خبر یا هشدار از قبل", "Thanks for the heads-up about the client."]], "pv": [["hand over", "تحویل دادن، سپردن", "I'll hand over the project to you."], ["take over", "بر عهده گرفتن (از کسی)", "Can you take over the client meetings?"], ["check on", "سر زدن، بررسی وضعیت", "I'll check on it tomorrow."], ["check back (with)", "دوباره پیگیری کردن", "I'll check back with you on Friday."]], "ex": [["Could you take care of ...?", "می‌توانی … را انجام دهی؟", "Could you take care of the client email?"], ["The goal here is to ...", "هدف اینجا … است", "The goal here is to reduce the loading time."], ["Ideally, by ...", "در بهترین حالت تا …", "Ideally, by Wednesday afternoon."], ["Let me know if you get stuck.", "اگر گیر کردی بگو", "Let me know if you get stuck."], ["Just checking in on ...", "فقط خواستم دربارهٔ … خبر بگیرم", "Just checking in on the report — how's it going?"], ["Any updates on ...?", "خبری از … داری؟", "Any updates on the contract?"]], "g": {"t": "he / she / they + his / her / their", "fa": "«او» در فارسی جنسیت ندارد؛ برای همین فارسی‌زبان‌ها در صحبت سریع he و she یا his و her را جابه‌جا می‌کنند — از پرتکرارترین خطاها که شنونده را گیج می‌کند. وقتی کار را به کسی می‌سپاری یا دربارهٔ همکاری حرف می‌زنی، مدام لازمش داری. وقتی جنسیت مهم نیست یا نمی‌دانی: they / their.", "ex": ["Ask Sara — she knows the client. Send her the file.", "Reza is busy; his team is on a deadline.", "Every developer should test their own code.", "Talk to the new designer and ask them for the draft."], "drill": "۵ همکار واقعی (زن و مرد) را در نظر بگیر و برای هر کدام ۳ جمله بگو: چه کاری به او می‌سپاری، تیم او چه می‌کند، و چرا او مناسب است. بعد ضبط را گوش کن و هر he/she یا his/her اشتباه را بشمار."}, "li": {"t": "Stanley McChrystal — Listen, learn… then lead", "u": "https://www.ted.com/talks/stanley_mcchrystal_listen_learn_then_lead", "task": "دربارهٔ رهبری و اعتماد. لحن محکم و آرامش را Shadow کن (۶۰ ثانیه).", "seg": "۰:۰۰ تا ۳:۰۰"}, "pr": {"t": "Thought groups & pausing", "fa": "جمله‌های طولانی را به گروه‌های معنایی تقسیم کن و بین آن‌ها کوتاه مکث کن. مکثِ درست تو را روان‌تر نشان می‌دهد، نه کُندتر.", "items": ["Could you take care of the report | and send it to the client | by Friday?", "The goal here | is to reduce | the loading time.", "If you get stuck | just let me know."]}, "fl": "Delegation brief: ۴ کار واقعی را که می‌خواهی به کسی بسپاری، هر کدام در ۳۰ ثانیه واگذار کن: چه، چرا، تا کِی، معیار موفقیت.", "rp": {"scene": "First, I am the manager: I delegate a task to you (a new team member) and you ask me lots of questions about the details, so I have to be clear. Then, a week later: I follow up on the task and you are late, with some excuses. I have to follow up firmly but politely and agree on a new deadline.", "role": "a new team member who asks lots of questions and later is late"}, "qs": ["What exactly do you want me to do?", "Why is this important?", "What if I get stuck?", "How will I know I've done a good job?"], "ch": "۲ دقیقه ضبط کن: یک کار را واگذار کن (۶۰ ثانیه) + پیگیری یک هفته بعد (۶۰ ثانیه). معیار قبولی: هیچ دستور مستقیم تند، حداقل ۲ phrasal verb امروز، مهلت دقیق، و هیچ he/she یا his/her اشتباه.", "work": "یک کار واقعی که باید به کسی بسپاری را انتخاب کن و متن واگذاری‌اش را بلند بگو.", "must": ["Could you take care of ...?", "Let me know if you get stuck.", "Just checking in on ...", "hand over", "heads-up"]});
