<style>

header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}

.doc{display:grid; gap:18px; max-width:860px}
.doc h1{font-size:30px; font-weight:800}

.next{background:var(--ink); color:var(--bg); border-radius:var(--r); padding:20px; display:grid; gap:10px; align-content:start}
.next .big{font-size:24px; font-weight:800}
.next a.btn{justify-self:start; background:var(--accent); color:var(--accent-ink); border:0; text-decoration:none; font-weight:700}
.progress-bar{height:8px; border-radius:99px; background:color-mix(in srgb, var(--bg) 25%, transparent); overflow:hidden}

li:{t:"Tim Harford — How messy problems can inspire creativity", u:TED("tim_harford_how_messy_problems_can_inspire_creativity"), task:"داستان‌محور. ۶۰ ثانیه Shadow کن؛ ایدهٔ اصلی را در ۳ جمله بگو."},

S({n:36, ph:4, t:"توضیح فنی برای آدم غیرفنی", en:"Explaining technical things to non-technical people",

v:[["simply put","به زبان ساده","Simply put, it's a digital filing cabinet."],["jargon","اصطلاحات تخصصی","Sorry, that's a lot of jargon."],["analogy","تشبیه، قیاس","Let me use an analogy."],["basically","در اصل","Basically, it's a backup."],["secure","امن","Your data is secure."],["automatically","به‌طور خودکار","It updates automatically."],["behind the scenes","پشت صحنه","Behind the scenes, it sends a request."],["in plain English","به زبان ساده","Can you say that in plain English?"]],

g:{t:"Real present conditionals for explanations (zero conditional)", fa:"برای قانون‌ها و رفتار سیستم: If/When + حال ساده، حال ساده. این ساختار برای توضیح اینکه «چه می‌شود اگر…» ساده و قابل‌فهم است.", ex:["If you forget your password, you get a code by SMS.","When a teacher enters a grade, parents see it immediately.","If the internet goes down, the app saves your work.","When you close the tab, you're logged out."], drill:"۸ جملهٔ zero conditional دربارهٔ رفتار یک اپ یا وسیله (گوشی، ATM، اپ مدرسه) بساز."},
li:{t:"Rory Sutherland — Perspective is everything", u:TED("rory_sutherland_perspective_is_everything"), task:"شوخ، پرمثال و بریتانیایی. ببین چطور ایدهٔ پیچیده را با مثال ساده می‌کند. ۴۵ ثانیه Shadow."},
pr:{t:"Silent letters", fa:"حروفی که نوشته می‌شوند اما گفته نمی‌شوند. خواندن بر اساس املا خطای رایج است.", items:["debt","receipt","Wednesday","business","comfortable","colleague","suite","island","listen","walk"]},
fl:"Explain like I'm 10: ۵ مفهوم را هر کدام در ۴۵ ثانیه برای یک بچهٔ ۱۰ ساله توضیح بده: cloud, password, API, AI, internet.",
rp:{scene:"You are a school principal (non-technical) and you've heard scary things about 'the cloud', 'hacking' and 'AI'. Ask me simple but tricky questions about how our platform stores data, whether it's secure and what AI does with it. If I use jargon, say 'Sorry, what does that mean?'. Tell me when my explanation is clear.", role:"a non-technical school principal"},
qs:["What exactly is 'the cloud'?","Can hackers see our students' grades?","What happens if the internet goes down?","How does the AI part work?"],

S({n:37, ph:4, t:"بحث فنی و سبک‌سنگین کردن راه‌حل‌ها", en:"Technical discussions: trade-offs and code review",
goal:"در بحث فنی (Code review، انتخاب تکنولوژی) مزایا و معایب را مطرح کنی و محترمانه روی نظرت بایستی.",
v:[["approach","رویکرد","I like this approach, but…"],["maintainable","قابل نگهداری","This code is more maintainable."],["readable","خوانا","Can we make it more readable?"],["overkill","زیادی، بیش از حد لازم","Microservices are overkill for us."],["edge case","حالت مرزی","What about edge cases?"],["performance","کارایی","It might hurt performance."],["technical debt","بدهی فنی","We're adding technical debt."],["consistent","یکدست، سازگار","Let's keep the naming consistent."]],
pv:[["clean up","تمیز کردن (کد)","Let's clean up this function."],["split up","تقسیم کردن","We could split it up into two files."],["pull out","جدا کردن (به تابع جدا)","Maybe pull this out into a helper."],["hold off (on)","فعلاً دست نگه داشتن","Let's hold off on refactoring."]],
ex:[["Have you thought about ...?","به … فکر کرده‌ای؟","Have you thought about using a queue?"],["The downside is ...","عیبش این است که …","The downside is it's harder to test."],["I'd lean towards ...","من بیشتر به … متمایلم","I'd lean towards the simpler option."],["It's a judgment call.","بستگی به قضاوت دارد","Honestly, it's a judgment call."],["Just a nit: ...","یک نکتهٔ خیلی جزئی","Just a nit: this variable name is unclear."],["Not a blocker, but ...","مانع نیست، اما …","Not a blocker, but we should add a test."]],
g:{t:"Cause and effect language", fa:"برای استدلال فنی: because of / due to + اسم؛ because / since / as + جمله؛ so / therefore / as a result برای نتیجه؛ which means … برای پیامد.", ex:["Due to the high traffic, the API is slow.","Since we don't have tests, it's risky.","It's more complex, so it'll take longer to maintain.","We cache the results, which means fewer database calls."], drill:"۸ جملهٔ علت و معلولی دربارهٔ تصمیم‌های فنی بساز، هر بار با یک رابط متفاوت."},
li:{t:"Adam Grant — The surprising habits of original thinkers", u:TED("adam_grant_the_surprising_habits_of_original_thinkers"), task:"استدلال و شواهد پشت سر هم. ۶۰ ثانیه Shadow؛ یک استدلالش را نقد کن (۱ دقیقه)."},
pr:{t:"Stress shift: noun vs verb", fa:"بعضی کلمات در نقش اسم تکیه اول و در نقش فعل تکیه دوم دارند.", items:["a REcord / to reCORD","a PREsent / to preSENT","an INcrease / to inCREASE","a CONtract / to conTRACT","an OBject / to obJECT","a PROgress / to proGRESS","an UPdate / to upDATE","an IMport / to imPORT"]},
fl:"Two sides: ۴ بحث فنی (Monolith vs microservices، React Native vs native، SQL vs NoSQL، build vs buy) — برای هر کدام ۳۰ ثانیه طرفداری و ۳۰ ثانیه مخالفت.",
rp:{scene:"Code review / technical discussion: I submitted a solution that adds a new database table. You are a senior engineer who prefers a different approach (using existing collections). Discuss the trade-offs: performance, maintainability, time and technical debt. Be polite but firm. We should end with a decision or a compromise.", role:"a senior engineer who prefers another approach"},
qs:["Why did you choose this approach?","What are the downsides?","How would this scale?","What would you do if we had twice the time?"],
ch:"۲ دقیقه ضبط کن: یک تصمیم فنی واقعی را توضیح بده، یک جایگزین را مطرح کن، trade-off را بگو و نتیجه بگیر. معیار قبولی: ۴ رابط علت و معلول، I'd lean towards… و یک عبارت نرم (Not a blocker, but…).",
work:"در Code review یا بحث فنی بعدی، یک کامنت را اول به انگلیسی بلند بگو."
});

S({n:38, ph:4, t:"عیب‌یابی در تماس (Troubleshooting)", en:"Troubleshooting with someone on a call",

S({n:46, ph:5, t:"مصاحبهٔ رفتاری (STAR)", en:"Behavioural interview questions — the STAR method",

li:{t:"Angela Lee Duckworth — Grit: the power of passion and perseverance", u:TED("angela_lee_duckworth_grit_the_power_of_passion_and_perseverance"), task:"کوتاه (۶ دقیقه) و روشن. ۶۰ ثانیه Shadow؛ یک مثال از grit در زندگی خودت بگو (۱ دقیقه)."},
pr:{t:"Linking glides /j/ and /w/", fa:"وقتی دو مصوت کنار هم می‌آیند، انگلیسی‌زبان‌ها یک /j/ یا /w/ کوچک بینشان می‌گذارند تا روان شود: I am ← I-y-am، go on ← go-w-on.", items:["I am → I-y-am","the end → the-y-end","go on → go-w-on","do it → do-w-it","we are → we-y-are","to ask → to-w-ask"]},

const BASE_SRS = [1,3,7,14,28];

/* ======================= State (per-browser convenience) ======================= */
const KEY="sp60_v1";
let ST = {done:{}, passed:{}, hard:{}, focus:[], err:[], metrics:{}, cando:{}};
try{ const raw = localStorage.getItem(KEY); if(raw){ ST = Object.assign(ST, JSON.parse(raw)); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

/* ======================= Helpers ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa = n => String(n).replace(/\d/g, d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const ALL = () => SESSIONS.filter(Boolean);
function nextSession(){ for(let i=1;i<=60;i++){ if(!ST.done[i]) return i; } return 60; }
function contentBefore(m){ while(m>=1 && SESSIONS[m] && SESSIONS[m].review) m--; return m; }
function dueSessions(n){
  const out=[]; for(const k of BASE_SRS){ const m=contentBefore(n-k); if(m>=1 && !out.some(o=>o.m===m)) out.push({m,k:n-m}); } return out;
}
function itemKey(n,type,i){ return n+"|"+type+"|"+i; }
function itemBy(key){ const [n,t,i]=key.split("|"); const s=SESSIONS[+n]; return s && s[t] && s[t][+i]; }
function hardList(){ return Object.keys(ST.hard).filter(k=>ST.hard[k]).map(k=>({k, it:itemBy(k)})).filter(x=>x.it); }
function yg(t){
  if(/ vs /.test(t)) return null;
  const c = t.split("→")[0].replace(/\(.*?\)|\/.*?\/|[↘↗→|…✓✗?!.,]/g,"").replace(/\s+/g," ").trim();
  if(!c || c.split(" ").length>3 || !/^[A-Za-z' -]+$/.test(c)) return null;
  return "https://youglish.com/pronounce/"+encodeURIComponent(c.toLowerCase())+"/english";
}
function pronHtml(t){
  const parts = / \/ /.test(t) ? t.split(" / ") : [t];
  return parts.map(x=>{ const u=yg(x); return u?`<a href="${u}" target="_blank" rel="noopener">${esc(x)}</a>`:`<span>${esc(x)}</span>`; }).join("");
}
function pick(arr, count, seed){ const out=[]; if(!arr||!arr.length) return out; for(let i=0;i<Math.min(count,arr.length);i++){ out.push(arr[(seed+i)%arr.length]); } return out; }
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); btn.textContent="کپی شد ✓"; setTimeout(()=>btn.textContent="کپی پرامپت",1800); }
  catch(e){ const pre=btn.parentElement.querySelector("pre"); if(pre){ const r=document.createRange(); r.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);} btn.textContent="انتخاب شد — Ctrl/⌘+C"; }
}

/* ======================= Prompt builders ======================= */
const LEARNER = "I'm a Persian-speaking professional working in tech (software and an ed-tech product for schools). My English is between intermediate and upper-intermediate (around B1+/B2). My main goal is to speak fluently and naturally at work and in daily life, and to stop translating from Persian in my head.";
function focusLines(){ return (ST.focus||[]).filter(f=>FOCUS[f]).map(f=>"- "+FOCUS[f].gpt).join("\n"); }
function errLines(){ return (ST.err||[]).filter(e=>!e.done).slice(-6).map(e=>"- I said \""+e.wrong+"\" → correct: \""+e.right+"\"").join("\n"); }
const RULES = `RULES FOR YOU:
- Keep your turns short (1–3 sentences). I should be talking at least 70% of the time.
- Ask one question at a time, then wait for me.
- If my answer is shorter than 3 sentences, push me: "Tell me more", "Why?", "Can you give me an example?"
- When I make a clear mistake (grammar, word choice, pronunciation, or an unnatural "Persian-style" phrase), correct it right away but briefly: say "Quick fix:" and the natural version, ask me to repeat it once, then continue. Max one correction per turn so the conversation keeps flowing.
- Speak at a natural, normal speed. Don't simplify your English too much.
- Never switch to Persian, even if I ask for a translation; explain in simple English instead.
- If I'm stuck for words, don't give me the answer immediately: first ask me to describe it another way.`;
const WRAP = `WHEN I SAY "FEEDBACK" (or after about 15 minutes), stop the conversation and give me:
1) My top 3 recurring mistakes, each with the correct version and a one-line rule.
2) 5 more natural phrases I could have used, based on what I said.
3) Which of today's target items I used correctly, and which I didn't use at all.
4) Scores from 1 to 10 for fluency, accuracy, vocabulary range and pronunciation, with one sentence of reasoning each.
5) One sentence for me to practise saying 5 times.`;

function buildPrompt(s){
  const due = dueSessions(s.n);
  const rev=[];
  due.forEach((d,j)=>{ const o=SESSIONS[d.m]; rev.push(...pick(o.pv,2,s.n+j).map(x=>x[0]), ...pick(o.ex,2,s.n+j).map(x=>x[0]), ...pick(o.v,2,s.n+j).map(x=>x[0])); });
  hardList().slice(0,8).forEach(h=>rev.push(h.it[0]));
  const fl=focusLines(), el=errLines();
  return `You are my personal English speaking coach. ${LEARNER}

This is Session ${s.n} of a 60-session speaking programme. Today's topic: "${s.en}".

TODAY'S TARGET LANGUAGE — create chances for me to use these, and tell me when I use one correctly:
- Vocabulary: ${s.v.map(x=>x[0]).join(", ")}
- Phrasal verbs: ${s.pv.map(x=>x[0]).join(", ")}
- Expressions: ${s.ex.map(x=>x[0]).join(" | ")}
- Grammar focus: ${s.g.t}
${rev.length?`
REVIEW ITEMS FROM EARLIER SESSIONS (spaced repetition) — naturally work at least 5 of these into your questions so I have to use them:
${rev.join(", ")}
`:""}${el?`
MY RECENT MISTAKES — if I repeat any of these, correct me firmly:
${el}
`:""}${fl?`
MY WEAKEST AREAS (from my assessment) — pay extra attention to:
${fl}
`:""}
HOW TO RUN TODAY'S SESSION (about 15 minutes):
1. Warm-up (2 min): short, friendly small talk connected to today's topic.
2. Questions (5 min): ask me these one at a time and follow up on each answer:
${s.qs.map(q=>"   - "+q).join("\n")}
3. Role-play (6–8 min): ${s.rp.scene} You play ${s.rp.role}. Stay in character, make it realistic, and add one unexpected complication I have to handle.
4. Finish with the feedback described below.

${RULES}

${WRAP}

Start now with the warm-up. Don't repeat these instructions back to me.`;
}

function reviewItems(n){
  const ph = SESSIONS[n].ph, from = SESSIONS[n].final ? 1 : (ph-1)*10+1;
  return ALL().filter(s=>!s.review && s.n>=from && s.n<n);
}
function buildReviewPrompt(n){
  const s=SESSIONS[n], c=CHECK[n];
  const items=[]; reviewItems(n).forEach((o,j)=>{ const per = s.final?1:2; items.push(...pick(o.pv,per,j).map(x=>x[0]), ...pick(o.ex,per,j+1).map(x=>x[0]), ...(s.final?[]:pick(o.v,1,j).map(x=>x[0]))); });
  hardList().slice(0,10).forEach(h=>items.push(h.it[0]));
  const topics = reviewItems(n).map(o=>o.en).join("; ");
  const fl=focusLines(), el=errLines();
  return `You are my English speaking coach and examiner. ${LEARNER}

This is Session ${n} of my 60-session programme: a REVIEW and CHECKPOINT session${s.final?" — the FINAL one":""}. The sessions I'm reviewing covered: ${topics}.

Run this review in 4 parts (about 20 minutes in total):

PART 1 — ACTIVE RECALL QUIZ (6 min). Choose 15 items at random from the list below. For each one, give me a short situation, and I must respond using that item naturally within a few seconds. Say "correct", "almost" (and fix it) or "missed" (and show me a model sentence). Keep a count.
ITEMS: ${items.join(", ")}

PART 2 — MIXED QUESTIONS (5 min). Ask me open questions that mix the topics above. Push me to speak for at least 45 seconds per answer.

PART 3 — CHECKPOINT ROLE-PLAY (6 min). ${c.rp} You play the other person(s). Make it realistic and a little challenging.

PART 4 — REPORT. When I say "FEEDBACK", give me:
1) My quiz score (correct / almost / missed out of 15) and the items I missed.
2) Scores from 1 to 9 (IELTS-style bands) for Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, and Pronunciation, with one reason each.
3) An honest CEFR estimate (B1, B1+, B2, B2+, C1) for today's performance.
4) My 5 most frequent error patterns, with examples from what I said and corrections.
5) The two areas I should focus on most in the next 10 sessions.
${el?`
MY RECENT MISTAKES — check whether I still make them:
${el}
`:""}${fl?`
MY WEAKEST AREAS:
${fl}
`:""}
${RULES.replace("RULES FOR YOU:","RULES FOR YOU (in parts 1–3):")}

Start now with Part 1.`;
}

const TABS=[["today","امروز"],["list","جلسه‌ها"],["errors","دفتر خطا"],["more","بیشتر"]];
let LASTN=1, CURN=null;
function stepsDone(){ return (ST.steps&&ST.steps[CURN])||[]; }
function route(keep){
  const h=(location.hash||"").replace("#","");
  let view="today", n=null;
  if(/^s\d+$/.test(h)){ view="s"; n=Math.min(60,Math.max(1,parseInt(h.slice(1)))); }
  else if(["guide","assess","errors","progress","list","more"].includes(h)) view=h;
  if(view==="today") n=nextSession();
  CURN = n!=null ? n : (view==="assess" ? "a" : null);
  const on = view==="s" ? (n===nextSession()?"today":"list") : (["guide","assess","progress"].includes(view)?"more":view);
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<a href="#${k}" class="${on===k?"on":""}">${l}</a>`).join("");
  const app=$("#app");
  if(view==="guide") app.innerHTML=renderGuide();
  else if(view==="assess") app.innerHTML=renderAssess();
  else if(view==="errors") app.innerHTML=renderErrors();
  else if(view==="progress") app.innerHTML=renderProgress();
  else if(view==="list") app.innerHTML=renderList();
  else if(view==="more") app.innerHTML=renderMore();
  else app.innerHTML=renderSessionShell(n);
  if(n!=null) LASTN=n;
  bind(view,n);
  tidy();
  const opened=openStep();
  if(keep && opened) opened.scrollIntoView({block:"start"});
  else if(!keep) window.scrollTo(0,0);
}

  }

}

function srsBlock(n){
  const due=dueSessions(n); const hard=hardList(); const errs=(ST.err||[]).filter(e=>!e.done).slice(-5);
  if(!due.length && !hard.length && !errs.length) return `<p>این اولین جلسهٔ آموزشی است؛ چیزی برای مرور نداری. به جایش ۸ دقیقه نتیجهٔ ارزیابی اولیه‌ات (بخش «ارزیابی اولیه») و ۳ ضعف اصلی‌ات را مرور کن و یک بار دیگر ضبط Task A را گوش بده.</p>`;
  let h=`<div class="how"><b>روش:</b> برای هر مورد، در کمتر از ۵ ثانیه یک جملهٔ <b>واقعی دربارهٔ زندگی خودت</b> بلند بگو (معنی را از روی کارت نخوان — نگه‌داشتن نشانگر روی هر مورد، معنی‌اش را نشان می‌دهد). اگر نتوانستی، روی آن بزن تا نارنجی شود و به «لیست سخت‌ها» برود و در جلسه‌های بعد و پرامپت ChatGPT تکرار شود.</div><div class="srs-block">`;

    h+=`<div class="srs-src"><div class="lbl">از جلسهٔ ${fa(d.m)} (${fa(d.k)} جلسه پیش) — ${esc(o.t)}</div><div class="chips">${chips.join("")}</div></div>`; });

  <li><b>Task C — ChatGPT Voice:</b> پرامپت همین بخش را بده و آزمون شفاهی را انجام بده (نمرهٔ ۱–۹ Fluency را یادداشت کن).</li>
  <li><b>Task D — یادآوری فعال:</b> ۳۰ مورد از موارد مرور همین صفحه را تصادفی انتخاب کن؛ برای هر کدام در ۵ ثانیه یک جملهٔ درست بگو. درصد موفقیت = Recall٪.</li>
  <li><b>Task E — شنیدن:</b> آخرین قسمت <a href="https://www.bbc.co.uk/learningenglish/english/features/6-minute-english" target="_blank" rel="noopener">BBC 6 Minute English</a> را <b>بدون متن</b> گوش کن و درصد فهمت را تخمین بزن (۰–۱۰۰)؛ بعد ۳۰ ثانیه از آن را دیکته بنویس و با متن مقایسه کن.</li></ol>`;
}
const MEASURE_HOW = `<div class="how"><b>چطور عددها را بگیری:</b><ul><li><b>کلمه در دقیقه (WPM):</b> فایل ضبط Task A را متن کن (در ChatGPT: دکمهٔ میکروفون داخل باکس متنی — نه حالت Voice — را بزن و فایل را کنارش پخش کن، یا از Transcript خودکار ضبط‌کنندهٔ گوشی) و در پرامپت تحلیل Paste کن تا کلمه‌ها را بشمارد. WPM = کل کلمه‌ها ÷ ۲.</li><li><b>مکث‌های طولانی:</b> ضبط Task A را گوش کن و مکث‌های بیش از ۳ ثانیه را بشمار.</li><li><b>Filler در دقیقه:</b> umm / err / «اِ» / like بی‌جا را در ضبط بشمار ÷ ۲.</li><li><b>خطا در دقیقه:</b> از تحلیل ChatGPT (بخش ۱).</li><li><b>اعتمادبه‌نفس:</b> ۱ تا ۱۰، صادقانه: «اگر همین الان یک جلسهٔ کاری انگلیسی داشتم، چقدر راحت بودم؟»</li></ul></div>`;
function targetsTable(n){
  const c=CHECK[n];
  return `<div class="tbl"><table><thead><tr><th>معیار</th><th>هدف این مرحله (نسبت به جلسهٔ صفر)</th></tr></thead><tbody>
  <tr><td>سرعت گفتار (WPM) در Task A</td><td>حداقل ${fa(c.wpm)}٪ بیشتر از خط پایه${n>=50?" (یا بالای ۱۲۵)":""}</td></tr>
  <tr><td>مکث‌های بیش از ۳ ثانیه (در ۲ دقیقه)</td><td>حداکثر ${fa(c.pauses)}</td></tr>
  <tr><td>Filler در دقیقه</td><td>حداکثر ${fa(c.fillers)}</td></tr>
  ${c.err?`<tr><td>خطای گرامری/واژگانی در دقیقه</td><td>حداقل ${fa(c.err)}٪ کمتر از خط پایه</td></tr>`:""}
  <tr><td>Recall٪ موارد مرور</td><td>حداقل ${fa(c.recall)}٪</td></tr>
  ${c.listen?`<tr><td>فهم BBC 6 Minute English بدون متن</td><td>حداقل ${fa(c.listen)}٪</td></tr>`:""}
  <tr><td>اعتمادبه‌نفس (۱–۱۰)</td><td>حداقل ${fa(c.conf)} واحد بیشتر از خط پایه</td></tr></tbody></table></div>`;
}
function renderReview(s){
  const n=s.n, ph=PHASES[s.ph], items=reviewItems(n);
  const head=`<div class="s-head"><div class="kick"><span class="pill amb">جلسهٔ مرور و ارزیابی</span><span class="pill">جلسهٔ ${fa(n)} از ۶۰</span>${ST.done[n]?`<span class="pill good">انجام شده ✓</span>`:""}</div>
  <h1>${esc(s.t)}</h1><div class="ent en">${esc(s.en)}</div>
  <div class="goal"><b>هدف:</b> ${s.final?"سنجش نهایی با همان آزمون‌های جلسهٔ صفر، مقایسهٔ قبل و بعد، و ساختن برنامهٔ ادامه.":"سنجیدن پیشرفت با همان آزمون‌های جلسهٔ صفر + مرور فشردهٔ همهٔ فاز "+fa(s.ph)+" ("+esc(ph.t)+")."}</div>
  <div class="plan-chips"><span>آزمون‌ها ۲۰′</span><span>مرور فشرده ۱۵′</span><span>ChatGPT مرور ۲۰′</span><span>ثبت و تصمیم ۱۰′</span><span>جمع: حدود ۶۵ دقیقه</span></div></div>`;
  let groups="";
  items.forEach(o=>{ const chips=[]; ["pv","ex","v"].forEach(t=>o[t].forEach((x,i)=>{ const k=itemKey(o.n,t,i); chips.push(`<button class="chip ${ST.hard[k]?"on":""}" data-star="${k}" title="${esc(x[1])} — ${esc(x[2])}">${esc(x[0])}</button>`); }));
    groups+=`<div class="srs-src"><div class="lbl">جلسهٔ ${fa(o.n)} — ${esc(o.t)}</div><div class="chips">${chips.join("")}</div></div>`; });
  const hard=hardList();
  const s1=step(1,"آزمون‌های ثابت (مثل جلسهٔ صفر)","۲۰ دقیقه", benchmarkTests(n)+MEASURE_HOW+`<p>پرامپت تحلیل متن Task A و B (همان پرامپت ارزیابی اولیه):</p><div class="prompt"><button class="btn pri copy" data-copy>کپی پرامپت</button><pre>${esc(ASSESS_TRANSCRIPT_PROMPT)}</pre></div>`,"challenge");
  const s2=step(2,s.final?"مرور کل برنامه":"مرور فشردهٔ فاز","۱۵ دقیقه",
    `<div class="how"><b>روش:</b> کل موارد را یکی‌یکی مرور کن؛ برای هر کدام در ۵ ثانیه یک جملهٔ واقعی بگو (معنی با نگه‌داشتن نشانگر روی هر مورد دیده می‌شود). هر موردی که گیر کردی را بزن تا نارنجی شود. این همان Task D است؛ تعداد موفق‌ها را بشمار.</div><div class="srs-block">${groups}${hard.length?`<div class="srs-src" style="border-color:var(--amber)"><div class="lbl">لیست سخت‌ها (${fa(hard.length)})</div><div class="chips">${hard.map(x=>`<button class="chip on" data-star="${x.k}" title="${esc(x.it[1])} — ${esc(x.it[2])}">${esc(x.it[0])}</button>`).join("")}</div></div>`:""}</div>`);
  const s3=step(3,"مرور و آزمون شفاهی با ChatGPT Voice","۲۰ دقیقه",
    `<div class="how">این پرامپت شامل Quiz یادآوری فعال، سؤال‌های ترکیبی از کل فاز، یک Role-play ارزیابی و گزارش نمره است. نمرهٔ Fluency و CEFR را در صفحهٔ پیشرفت ثبت کن.</div><div class="prompt"><button class="btn pri copy" data-copy>کپی پرامپت</button><pre>${esc(buildReviewPrompt(n))}</pre></div>`,"gpt");
  const s4=step(4,"ثبت عددها و تصمیم برای ادامه","۱۰ دقیقه",
    `<p>عددها را در <a href="#progress">صفحهٔ پیشرفت</a> (ردیف جلسهٔ ${fa(n)}) وارد کن. هدف‌های این مرحله:</p>${targetsTable(n)}
    <div class="note"><b>قانون تصمیم:</b> اگر به <b>۴ هدف یا بیشتر</b> رسیدی → با خیال راحت جلو برو. اگر به ۲–۳ هدف رسیدی → جلو برو اما در ۵ جلسهٔ بعد «تمرین اضافه» ضعیف‌ترین حوزه را از صفحهٔ «ارزیابی اولیه» فعال کن. اگر کمتر از ۲ هدف → قبل از ادامه، ۲ جلسه از این فاز را که چالششان را قبول نشدی (یا سخت‌ترین‌ها) یک بار دیگر کامل انجام بده. <b>هرگز بیش از ۲ جلسه عقب برنگرد</b>؛ پیشرفت Speaking غیرخطی است.</div>`);
  const reflect = s.final ? `<ol><li>ضبط Task A امروز را با ضبط جلسهٔ صفر پشت سر هم گوش کن. ۳ تفاوت مشخص را بنویس.</li><li>ضبط ۵ دقیقه‌ای جلسهٔ ۵۹ را گوش کن: کجا هنوز ترجمه می‌کنی؟</li><li>پرامپت ارزیابی صوتی (صفحهٔ ارزیابی اولیه) را دوباره اجرا کن و نمرهٔ هر ۴ معیار را با روز اول مقایسه کن.</li><li>خودارزیابی «می‌توانم…» را در صفحهٔ ارزیابی اولیه دوباره پر کن (ستون جلسهٔ ۶۰).</li></ol>
    <h3 style="margin-top:8px">برنامهٔ بعد از ۶۰ جلسه (نگه‌داشتن و ادامهٔ پیشرفت)</h3><ul><li><b>روزانه (۲۰ دقیقه):</b> ۱۰ دقیقه ChatGPT Voice با یک موقعیت واقعی کاری آن روز + ۵ دقیقه Shadowing یک تاک TED جدید + ۵ دقیقه مرور لیست سخت‌ها و دفتر خطا.</li><li><b>هفتگی:</b> یک جلسهٔ ۲۰ دقیقه‌ای مرور یکی از فازها (به ترتیب ۱ تا ۶) با پرامپت جلسهٔ مرور همان فاز.</li><li><b>ماهانه:</b> Task A و B را ضبط کن و عددها را ثبت کن؛ اگر WPM یا خطاها ۲ ماه ثابت ماند، دور دوم این برنامه را از فاز ضعیف‌تر شروع کن.</li><li><b>قدم بعدی:</b> اگر CEFR تخمینی به B2+ رسیده، هدف بعدی را «C1 کاری» بگذار: ارائه‌های ۱۰ دقیقه‌ای، مذاکرهٔ واقعی و گفتگو با انسان‌ها (Meetup آنلاین، Tandem، یا همکاران خارجی) — ChatGPT جایگزین کامل انسان نیست.</li></ul>`
    : `<ol><li>در این ۹ جلسه، کدام موقعیت را الان واقعاً راحت‌تر انجام می‌دهی؟ یک مثال مشخص بزن.</li><li>کدام ۳ مورد از لیست سخت‌ها هنوز سخت است؟ برای هر کدام همین الان ۳ جمله بگو.</li><li>پرتکرارترین اشتباه دفتر خطا چیست؟ یک قانون ۱ جمله‌ای برای خودت بنویس.</li><li>در ۱۰ جلسهٔ بعد، کدام ضعف را باید «تمرین اضافه» بگیری؟ در صفحهٔ ارزیابی اولیه به‌روزش کن.</li></ol>`;
  const s5=step(5, s.final?"مقایسهٔ قبل و بعد + برنامهٔ ادامه":"بازتاب (۲ دقیقه با خودت، بلند و به انگلیسی)", s.final?"۱۵ دقیقه":"۵ دقیقه", reflect+`<label class="check-line"><input type="checkbox" id="done" ${ST.done[n]?"checked":""}> این جلسه را کامل انجام دادم</label>`);
  return head+`<div class="steps">${s1}${s2}${s3}${s4}${s5}</div>`;
}

/* ======================= Guide ======================= */
function renderGuide(){
  const nx=nextSession(), doneCount=Object.keys(ST.done).filter(k=>ST.done[k]).length, s=SESSIONS[nx];
  const assessed = ST.metrics && ST.metrics[0] && ST.metrics[0].wpm;
  return `<div class="hero"><div class="doc">
    <h1>یک برنامهٔ ۶۰ جلسه‌ای برای اینکه واقعاً انگلیسی <span style="color:var(--accent)">حرف بزنی</span></h1>
    <p class="lead">هر جلسه حدود ۶۵ دقیقه است و همه چیزش همین‌جاست: لغت، Phrasal Verb، عبارت، گرامر گفتاری، ویدیو برای Shadowing، تلفظ، تمرین روانی، پرامپت آمادهٔ ChatGPT Voice و یک چالش ضبط‌شده. مرور فاصله‌دار خودکار است: هر جلسه، موارد ۱، ۳، ۷، ۱۴ و ۲۸ جلسه قبل را برمی‌گرداند.</p>
  </div><div class="next">
    <div class="small" style="opacity:.75">${assessed?"جلسهٔ بعدی تو":"قدم اول"}</div>
    <div class="big">${assessed?`جلسهٔ ${fa(nx)} — ${esc(s.t)}`:"ارزیابی اولیه (جلسهٔ صفر)"}</div>
    <div class="progress-bar" aria-label="پیشرفت"><i style="width:${Math.round(doneCount/60*100)}%"></i></div>
    <div class="small" style="opacity:.75">${fa(doneCount)} از ۶۰ جلسه انجام شده</div>
    <a class="btn" href="${assessed?"#s"+nx:"#assess"}">${assessed?"شروع جلسه":"شروع ارزیابی"} ←</a>
  </div></div>

  <div class="doc" style="margin-top:28px">
  <section><h2>مسیر: ۶ فاز، هر فاز ۱۰ جلسه</h2><p class="muted small">جلسه‌های ۱۰، ۲۰، ۳۰، ۴۰، ۵۰ و ۶۰ جلسهٔ مرور و ارزیابی‌اند و همان آزمون‌های جلسهٔ صفر را تکرار می‌کنند تا پیشرفت با عدد دیده شود.</p>
  <div class="phase-grid">${[1,2,3,4,5,6].map(p=>`<div class="card"><span class="pill acc">فاز ${fa(p)} · جلسه‌های ${fa((p-1)*10+1)}–${fa(p*10)}</span><h3 style="margin-top:6px">${esc(PHASES[p].t)}</h3><p class="small muted">${esc(PHASES[p].d)}</p></div>`).join("")}</div></section>

  <section><h2>ساختار ثابت هر جلسه</h2><div class="tbl"><table><thead><tr><th>بخش</th><th>زمان</th><th>چرا</th></tr></thead><tbody>
  <tr><td>۱. مرور فاصله‌دار</td><td>۸′</td><td>موارد جلسه‌های قبل قبل از فراموش شدن برمی‌گردند؛ با جمله‌سازی بلند، نه با خواندن.</td></tr>
  <tr><td>۲. ورودی جدید</td><td>۱۰′</td><td>۸ لغت + ۴ Phrasal Verb + ۶ عبارت؛ همه در موقعیت کاری یا روزمره و با مثال.</td></tr>
  <tr><td>۳. گرامر گفتاری</td><td>۷′</td><td>فقط گرامری که در Speaking لازم است؛ تمرین شفاهی، نه تست.</td></tr>
  <tr><td>۴. شنیدن و Shadowing</td><td>۱۰′</td><td>یک تاک TED یا BBC مشخص با متن؛ ریتم و لحن طبیعی را از بدن رد می‌کنی.</td></tr>
  <tr><td>۵. تلفظ</td><td>۵′</td><td>روی خطاهای مخصوص فارسی‌زبان‌ها (w/v، th، «اِسکول»، تکیه، schwa، …) با لینک YouGlish.</td></tr>
  <tr><td>۶. تمرین روانی</td><td>۵′</td><td>روش‌هایی مثل ۴/۳/۲ و صحبت بی‌توقف؛ برای شکستن عادت ترجمهٔ ذهنی.</td></tr>
  <tr><td>۷. ChatGPT Voice</td><td>۱۵′</td><td>پرامپت آماده که موضوع، لغات، موارد مرور، اشتباه‌های قبلی و ضعف‌هایت را خودکار دارد.</td></tr>
  <tr><td>۸. چالش ضبط‌شده</td><td>۵′</td><td>با معیار قبولی مشخص؛ نشان می‌دهد جلسه را واقعاً یاد گرفته‌ای.</td></tr>
  <tr><td>۹. دفتر خطا + کار واقعی</td><td>۲′</td><td>اشتباه‌ها ثبت می‌شوند و در جلسه‌های بعد و پرامپت‌ها برمی‌گردند.</td></tr></tbody></table></div></section>

  <section><h2>قوانین برنامه</h2><ul>
  <li><b>همه چیز را بلند بگو.</b> خواندن در ذهن ≠ تمرین Speaking. حتی مرور لغات را با جمله‌سازی بلند انجام بده.</li>
  <li><b>قبل از حرف زدن ننویس.</b> نوشتن جمله و بعد خواندنش همان ترجمهٔ ذهنی است که می‌خواهیم حذفش کنیم.</li>
  <li><b>در تمرین روانی، روانی از دقت مهم‌تر است.</b> در Drillهای گرامر و چالش، دقت مهم‌تر است. این دو را جدا تمرین می‌کنیم.</li>
  <li><b>هر چالش را ضبط کن</b> و یک بار گوش بده. ضبط‌ها را نگه دار؛ در جلسهٔ ۶۰ مقایسه‌شان می‌کنی.</li>
  <li><b>ریتم پیشنهادی:</b> ۵ جلسه در هفته (۱۲ هفته). حداقل ۳ جلسه در هفته (۲۰ هفته). اگر ۳ روز یا بیشتر وقفه افتاد، اول فقط مرور فاصله‌دار و ChatGPT جلسهٔ آخر را تکرار کن، بعد ادامه بده.</li>
  <li><b>روزهای شلوغ (نسخهٔ ۲۰ دقیقه‌ای):</b> فقط بخش ۱ (مرور) + بخش ۷ (ChatGPT) را انجام بده و روز بعد جلسه را کامل کن. بیش از ۲ بار در هفته از نسخهٔ کوتاه استفاده نکن.</li>
  <li><b>ستاره (★) بزن</b> روی هر لغت یا عبارتی که برایت سخت است؛ وارد «لیست سخت‌ها» می‌شود و تا وقتی برش نداری، در مرور و پرامپت‌ها تکرار می‌شود.</li></ul></section>

  <section><h2>استفاده از ChatGPT Voice</h2><ul>
  <li>پرامپت هر جلسه را در یک <b>چت جدید</b> و در <b>باکس متنی</b> Paste کن، ارسال کن، <b>بعد</b> دکمهٔ Voice را بزن. پرامپت بلند را با صدا نخوان.</li>
  <li>اگر وسط کار ChatGPT قوانین را فراموش کرد (مثلاً زیاد حرف زد یا تصحیح نکرد)، بگو: <span class="en">"Remember the rules: short turns, correct my mistakes."</span></li>
  <li>در پایان بگو <span class="en">"FEEDBACK"</span>. بعد از بستن Voice، بازخورد به صورت متن در چت هست؛ از آنجا دفتر خطا را پر کن.</li>
  <li>اگر در حالت Voice صدایت را اشتباه متن می‌کند، معمولاً یعنی تلفظ آن کلمه واضح نیست — آن کلمه را در دفتر خطا با نوع «تلفظ» ثبت کن.</li></ul></section>

  <section><h2>منابع ثابتی که در برنامه استفاده می‌شوند</h2><ul>
  <li><a href="https://www.ted.com/talks" target="_blank" rel="noopener">TED Talks</a> — برای Shadowing؛ همهٔ تاک‌ها متن کامل (Transcript) دارند. لینک دقیق هر تاک در جلسه‌اش هست.</li>
  <li><a href="https://www.bbc.co.uk/learningenglish/english/features/6-minute-english" target="_blank" rel="noopener">BBC Learning English — 6 Minute English</a> — شنیدن استاندارد در جلسه‌های ارزیابی.</li>
  <li><a href="https://www.bbc.co.uk/learningenglish/english/features/english-at-work" target="_blank" rel="noopener">BBC — English at Work</a> — دیالوگ‌های محیط کار.</li>

/* ======================= Progress ======================= */
const MET=[["wpm","WPM (Task A)"],["pauses","مکث >۳ثانیه"],["fillers","Filler/دقیقه"],["err","خطا/دقیقه"],["recall","Recall٪"],["listen","فهم شنیداری٪"],["band","Band روانی (۱–۹)"],["conf","اعتمادبه‌نفس (۱–۱۰)"]];
function evalCell(cp, key, val){
  const base=(ST.metrics[0]||{})[key]; const c=CHECK[cp]; if(!c || val===""||val==null) return "";
  const v=+val, b=+base;
  let ok=null;
  if(key==="wpm" && base) ok = v >= b*(1+c.wpm/100) || (cp>=50 && v>=125);
  if(key==="pauses") ok = v <= c.pauses;
  if(key==="fillers") ok = v <= c.fillers;
  if(key==="err" && base && c.err) ok = v <= b*(1-c.err/100);
  if(key==="recall") ok = v >= c.recall;
  if(key==="listen" && c.listen) ok = v >= c.listen;
  if(key==="conf" && base) ok = v >= b + c.conf;
  if(ok===null) return "";
  return ok?` <span class="ok" title="به هدف رسیدی">✓</span>`:` <span class="bad" title="هنوز به هدف نرسیده">✗</span>`;
}
function renderProgress(){
  const m=ST.metrics||{};
  const rows=[0,10,20,30,40,50,60].map(cp=>`<tr><td class="kpi"><b>${cp===0?"خط پایه (۰)":"جلسهٔ "+fa(cp)}</b></td>${MET.map(([k])=>{ const v=(m[cp]||{})[k]; return `<td style="white-space:nowrap"><input type="number" step="any" style="width:74px" data-met="${cp}|${k}" value="${v==null?"":esc(v)}" aria-label="${k}">${cp?evalCell(cp,k,v):""}</td>`; }).join("")}</tr>`).join("");
  const b=m[0]||{}, last=[60,50,40,30,20,10].find(cp=>m[cp]&&Object.values(m[cp]).some(x=>x!==""&&x!=null));
  let delta="";
  if(last && b.wpm){ const L=m[last];
    const d=(k,better)=>{ if(L[k]==null||L[k]===""||b[k]==null||b[k]==="") return null; const diff=(+L[k])-(+b[k]); return {diff, good: better==="up"?diff>0:diff<0}; };
    const items=[["wpm","سرعت گفتار","up"],["pauses","مکث‌های طولانی","down"],["fillers","Filler","down"],["err","خطا در دقیقه","down"],["band","Band روانی","up"],["conf","اعتمادبه‌نفس","up"]].map(([k,l,dir])=>{ const x=d(k,dir); return x?`<div class="card" style="padding:10px 14px"><div class="small muted">${l}</div><div class="kpi" style="font-size:20px;font-weight:800;color:${x.good?"var(--good)":"var(--rec)"}">${x.diff>0?"+":""}${fa(Math.round(x.diff*10)/10)}</div></div>`:""; }).join("");
    delta=`<h2>تغییر از خط پایه تا جلسهٔ ${fa(last)}</h2><div class="phase-grid">${items}</div>`;
  }
  return `<div class="doc" style="margin-top:24px; max-width:1100px">
  <h1>پیشرفت با عدد</h1>
  <p>بعد از جلسهٔ صفر و هر جلسهٔ مرور (۱۰، ۲۰، … ۶۰) عددها را وارد کن. ✓ یعنی به هدف آن مرحله رسیده‌ای. هدف‌ها نسبت به خط پایهٔ خودت تعریف شده‌اند، نه یک سطح ثابت؛ چون هدف پیشرفت واقعی توست.</p>
  <div class="tbl"><table><thead><tr><th>نقطهٔ سنجش</th>${MET.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="how"><b>هدف‌های کلی تا جلسهٔ ۶۰:</b> WPM حداقل ۳۰٪ بیشتر از خط پایه (یا ۱۳۰+) · حداکثر ۱ مکث بیش از ۳ ثانیه در ۲ دقیقه · حداکثر ۳ Filler در دقیقه · نصف شدن خطاها در دقیقه · Recall حداقل ۸۰٪ · فهم ۸۰٪ یک قسمت 6 Minute English بدون متن · اعتمادبه‌نفس ۳ واحد بالاتر · یک صحبت پیوستهٔ ۵ دقیقه‌ای (جلسهٔ ۵۹). راهنمای اندازه‌گیری در جلسهٔ صفر است.</div>
  ${delta}
  <h2>جلسه‌های انجام‌شده</h2>
  <p class="kpi">${fa(Object.keys(ST.done).filter(k=>ST.done[k]).length)} از ۶۰ جلسه · چالش‌های قبول‌شده: ${fa(Object.keys(ST.passed).filter(k=>ST.passed[k]).length)} · موارد لیست سخت‌ها: ${fa(hardList().length)} · اشتباه‌های حل‌نشده: ${fa((ST.err||[]).filter(e=>!e.done).length)}</p>
  <h2>پشتیبان‌گیری</h2>
  <p class="small muted">همهٔ داده‌ها (تیک‌ها، ستاره‌ها، دفتر خطا، عددها) فقط در همین مرورگر هستند. متن زیر را کپی کن و جایی نگه دار (مثلاً در یک یادداشت). برای برگرداندن، متن را در باکس دوم Paste کن.</p>
  <div class="prompt"><button class="btn pri copy" data-copy>کپی پشتیبان</button><pre id="backup">${esc(JSON.stringify(ST))}</pre></div>
  <label for="restore" class="small">برگرداندن از پشتیبان:</label><textarea id="restore" class="en" placeholder='{"done":{...}}'></textarea>
  <div class="row"><button class="btn" id="restore-btn">برگرداندن</button><span id="restore-msg" class="small"></span></div>
  </div>`;
}

/* ======================= Events ======================= */
function bind(view,n){
  document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{ copyText(b.parentElement.querySelector("pre").textContent,b); }));
  const setHard=(k,v)=>{ if(v) ST.hard[k]=true; else delete ST.hard[k]; save(); document.querySelectorAll(`[data-star="${k}"]`).forEach(x=>x.classList.toggle("on",!!v)); };
  document.querySelectorAll("[data-star]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.star; const src=b.closest(".srs-src");
    if(b.classList.contains("chip") && src){ const r=src.querySelector(".reveal"), it=itemBy(k); if(!r||!it) return;
      src.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); b.classList.add("sel");
      r.hidden=false; r.innerHTML=`<div class="en"><b>${esc(it[0])}</b></div><div>${esc(it[1])}</div><div class="en ex">${esc(it[2])}</div><div class="row"><button class="btn" data-know="${k}">بلد بودم ✓</button><button class="btn" data-hardset="${k}">سخت بود ★</button></div>`;
      r.querySelector("[data-know]").onclick=()=>{ setHard(k,false); b.classList.add("known"); r.hidden=true; };
      r.querySelector("[data-hardset]").onclick=()=>{ setHard(k,true); r.hidden=true; };
      return; }
    setHard(k,!ST.hard[k]); if(view==="errors") route(true); }));
  document.querySelectorAll("[data-stepdone]").forEach(b=>b.addEventListener("click",()=>{ const num=+b.dataset.stepdone; ST.steps=ST.steps||{}; const arr=ST.steps[CURN]=ST.steps[CURN]||[]; if(!arr.includes(num)) arr.push(num);
    const total=document.querySelectorAll("details.step").length; if(typeof CURN==="number" && arr.length>=total) ST.done[CURN]=true; save(); route(true);
    if(typeof CURN==="number" && ST.done[CURN] && arr.length>=total){ const nr=document.querySelector(".navrow"); if(nr) nr.scrollIntoView({block:"center"}); } }));
  document.querySelectorAll("details.step").forEach(d=>d.addEventListener("toggle",()=>{ if(d.open) document.querySelectorAll("details.step").forEach(o=>{ if(o!==d) o.open=false; }); }));
  const pk=$("#pick"); if(pk) pk.addEventListener("change",()=>{ location.hash="s"+pk.value; });
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ location.hash="s"+b.dataset.go; }));
  const d=$("#done"); if(d) d.addEventListener("change",()=>{ ST.done[n]=d.checked; if(!d.checked) delete ST.done[n]; save(); });
  const p=$("#passed"); if(p) p.addEventListener("change",()=>{ ST.passed[n]=p.checked; if(!p.checked) delete ST.passed[n]; save(); });
  document.querySelectorAll("[data-focus]").forEach(c=>c.addEventListener("change",()=>{ const set=new Set(ST.focus||[]); c.checked?set.add(c.dataset.focus):set.delete(c.dataset.focus); ST.focus=[...set]; save(); }));
  document.querySelectorAll("[data-cando]").forEach(sel=>sel.addEventListener("change",()=>{ const [cp,i]=sel.dataset.cando.split("|"); ST.cando[cp]=ST.cando[cp]||[]; ST.cando[cp][+i]=+sel.value; save(); route(true); }));
  const f=$("#errform"); if(f) f.addEventListener("submit",e=>{ e.preventDefault(); const w=$("#e-wrong").value.trim(), r=$("#e-right").value.trim(); if(!w||!r) return; ST.err.push({s:LASTN, wrong:w, right:r, type:$("#e-type").value, done:false}); save(); route(true); });
  document.querySelectorAll("[data-errdone]").forEach(c=>c.addEventListener("change",()=>{ ST.err[+c.dataset.errdone].done=c.checked; save(); route(true); }));
  document.querySelectorAll("[data-errdel]").forEach(b=>b.addEventListener("click",()=>{ ST.err.splice(+b.dataset.errdel,1); save(); route(true); }));
  document.querySelectorAll("[data-met]").forEach(inp=>inp.addEventListener("change",()=>{ const [cp,k]=inp.dataset.met.split("|"); ST.metrics[cp]=ST.metrics[cp]||{}; if(inp.value==="") delete ST.metrics[cp][k]; else ST.metrics[cp][k]=+inp.value; save(); route(true); }));
  const rb=$("#restore-btn"); if(rb) rb.addEventListener("click",()=>{ try{ const o=JSON.parse($("#restore").value); if(typeof o!=="object"||!o) throw 0; ST=Object.assign({done:{},passed:{},hard:{},focus:[],err:[],metrics:{},cando:{}},o); save(); route(true); }catch(e){ $("#restore-msg").textContent="متن پشتیبان معتبر نیست؛ کل متن را دقیق کپی کن."; } });
